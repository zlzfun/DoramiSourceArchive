          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: 联调错误示例 INTERNAL_ERROR
                      request_id: briefs-example-001
                ACCOUNT_MAPPING_CONFLICT:
                  value:
                    error:
                      code: ACCOUNT_MAPPING_CONFLICT
