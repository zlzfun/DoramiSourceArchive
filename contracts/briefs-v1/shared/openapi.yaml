components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: dorami_admin_session
      description: 必须有效且 role=admin。CSRF 要求由现有部署交接。
  headers:
    CacheControl:
      description: 个人内容禁止缓存
      schema:
        type: string
        const: no-store
    RequestId:
      description: 服务端确认或生成的追踪 ID
      schema:
        type: string
        minLength: 1
    ContractVersion:
      description: 当前契约版本；bot 接受兼容的 1.x
      schema:
        type: string
        const: '1.0'
  schemas:
    EmployeeNumber:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^\S+$
    RelatedSource:
      type: object
      required:
      - title
      - source_name
      - source_url
      properties:
        title: &id009
          type: string
          minLength: 1
          pattern: \S
        source_name: *id009
        source_url: &id010
          type: string
          format: uri
          pattern: ^https?://[^\s/]+(?:[^\s]*)$
        publish_date: &id011
          anyOf:
          - &id014
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
          - &id016
            type: string
            format: date-time
            pattern: (Z|[+-]\d{2}:\d{2})$
          - type: 'null'
      additionalProperties: true
    Snapshot:
      type: object
      required:
      - title
      - source_name
      - source_url
      - publish_date
      - summary
      - score_reason
      - tags
      - display_tags
      - event_id
      - related_sources
      properties:
        title: *id009
        source_name: *id009
        source_url: *id010
        publish_date: *id011
        summary: &id012
          type:
          - string
          - 'null'
        score_reason: *id012
        tags: &id013
          type: array
          items: *id009
        display_tags: *id013
        event_id: &id015
          anyOf:
          - *id009
          - type: 'null'
        related_sources:
          type: array
          items:
            $ref: '#/components/schemas/RelatedSource'
      additionalProperties: true
    Item:
      type: object
      required:
      - position
      - section
      - selection_lane
      - quality_score
      - selection_reason
      - snapshot
      properties:
        position:
          type: integer
          minimum: 1
        section: *id009
        selection_lane:
          type: string
          enum:
          - interest
          - quality
          - breaking
        quality_score:
          type:
          - number
          - 'null'
        selection_reason: *id012
        snapshot:
          $ref: '#/components/schemas/Snapshot'
      additionalProperties: true
    Edition:
      type: object
      required:
      - report_date
      - revision
      - status
      - degraded_reason
      - selection_stats
      - generated_at
      - items
      properties:
        report_date: *id014
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - failed
        degraded_reason: *id015
        selection_stats:
          type: object
          additionalProperties: true
        generated_at:
          anyOf:
          - *id016
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
      additionalProperties: true
      oneOf:
      - properties:
          status:
            const: ready
          generated_at: *id016
      - properties:
          status:
            enum:
            - pending
            - processing
            - failed
          generated_at:
            type: 'null'
          items:
            maxItems: 0
    BriefResponse:
      type: object
      required:
      - employee_number
      - username
      - status
      - pushable
      - fallback_hint
      - edition
      properties:
        employee_number:
          $ref: '#/components/schemas/EmployeeNumber'
        username: *id009
        status:
          type: string
          enum:
          - missing
          - pending
          - processing
          - ready
          - degraded
          - empty
          - failed
        pushable:
          type: boolean
        fallback_hint:
          enum:
          - public
          - retry
          - null
        edition:
          anyOf:
          - $ref: '#/components/schemas/Edition'
          - type: 'null'
      additionalProperties: true
      oneOf:
      - properties:
          status:
            const: missing
