            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: 联调错误示例 FORBIDDEN
                      request_id: briefs-example-001
                CSRF_REJECTED:
