openapi: 3.1.0
info:
  title: Dorami Personal Briefs M2M Contract
  version: 1.0.0
  description: 业务语义以同版本 CONTRACT.md 为准。登录与既有 CSRF 规则通过环境交接。所有已定义字段固定，允许兼容新增字段。
servers:
- url: /
  description: 同一 Dorami base URL，部署时由双方配置
paths:
  /api/admin/reader/briefs/today:
    get:
      operationId: getTodayPersonalBrief
      summary: 只读获取今日最新 revision
      description: 无生成副作用；账号存在但无版返回 200/missing。
      security:
      - AdminCookie: []
      parameters:
      - name: employee_number
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EmployeeNumber'
        description: subscriptions.user_id，精确匹配 users.w3_uid。仅允许出现一次；未知 query 参数返回
          422。
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]+$
        description: 可选追踪 ID；缺失或无效由服务端生成。
      responses:
        '401':
          description: UNAUTHENTICATED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                UNAUTHENTICATED:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: 联调错误示例 UNAUTHENTICATED
                      request_id: briefs-example-001
        '403':
          description: FORBIDDEN / CSRF_REJECTED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                FORBIDDEN:
                  value:
                    error:
                      code: FORBIDDEN
                      message: 联调错误示例 FORBIDDEN
                      request_id: briefs-example-001
                CSRF_REJECTED:
                  value:
                    error:
                      code: CSRF_REJECTED
                      message: 联调错误示例 CSRF_REJECTED
                      request_id: briefs-example-001
        '404':
          description: ACCOUNT_NOT_FOUND
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                ACCOUNT_NOT_FOUND:
                  value:
                    error:
                      code: ACCOUNT_NOT_FOUND
                      message: 联调错误示例 ACCOUNT_NOT_FOUND
                      request_id: briefs-example-001
        '422':
          description: INVALID_ARGUMENT
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                INVALID_ARGUMENT:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: 联调错误示例 INVALID_ARGUMENT
                      request_id: briefs-example-001
        '429':
          description: RATE_LIMITED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Briefs-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
            Retry-After:
              description: 限流等待秒数或 HTTP-date；bot 不早于此时间补查
              schema:
