# 版本 tag 推上来 → 自动建 GitHub Release(说明由两个 tag 之间的 PR 标题自动生成,
# tag 自身的 annotated 说明放在最前)。与 sync-master.yml 同一触发点、各管一事。
#
# 任何人都能打 tag(2026-09-14 拍板,不设 tag 保护),所以这里做两道核对,不过就不建
# Release 并把任务标红——tag 已经推上去了没法撤,但至少「这个 tag 不是合格发布版」会被看见:
#   1. tag 指向的提交必须在 main 线上(与 sync-master 同一条规则);
#   2. tag 名必须等于 v + src/version.py 的 __version__(用 scripts/release.sh 打的 tag 天然满足;
#      手工 git tag 打在没 bump 版本的提交上就会在这里被拦下)。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is a proper release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          sha="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${TAG}(${sha:0:7})不在 main 线上,不建 Release。"
            exit 1
          fi
          version="$(grep -o '__version__ = "[^"]*"' src/version.py | sed 's/.*"\(.*\)"/\1/')"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::tag ${TAG} 与代码版本号 ${version} 不一致——请用 scripts/release.sh 发版。"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::warning::${TAG} 是轻量 tag(无说明);发版请用 scripts/release.sh 打 annotated tag。"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在,跳过。"
            exit 0
          fi
          # annotated tag 的正文(release.sh 写入的本版内容清单)作为说明开头;
          # --generate-notes 会把自动生成的 PR 清单追加在后面。
          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$notes"
          echo "### ✅ 已发布 Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
