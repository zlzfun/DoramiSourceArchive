# 版本 tag 推上来 → 自动建 GitHub Release → 串联部署(deploy.yml,等 Environment production 批准)。
# 与 sync-master.yml 同一触发点、各管一事。
#
# 任何人都能打 tag(2026-09-14 拍板,不设 tag 保护),所以先做核对,不过就不建 Release、不部署,并把任务标红——
# tag 已经推上去了没法撤,但至少「这个 tag 不是合格发布版」会被看见。核对由 scripts/verify-release-ref.sh 承担
# (tag 在 main 线上;**目标 tag 里的** src/version.py 版本号 = tag 名;轻量 tag 只告警),三条入口共用同一份核验。
#
# 部署(issue #102):GITHUB_TOKEN 建的 Release 不会触发 `on: release`,故部署作为同一次 run 里 `needs: release` 的
# 后续 job 串联,核对与部署可追溯。Environment secrets 由被调用 job 自己的 `environment` 声明获得,这里不传 secrets。
# 手动补建 Release(workflow_dispatch)默认不顺带部署,勾 deploy 才部署。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要建 Release 的已存在 tag(如 v3.56.0)
        required: true
      deploy:
        description: 建完 Release 后是否顺带部署到生产(默认否)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      target_sha: ${{ steps.verify.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is a proper release
        id: verify
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: scripts/verify-release-ref.sh "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # gh release view 对 draft 也成功:已存在的 Release 必须是已发布的,否则不能让后面的 deploy job 拿它当发布单元
          existing="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [ "$existing" = "false" ]; then
            echo "Release ${TAG} 已存在(已发布),跳过。"
            exit 0
          elif [ "$existing" = "true" ]; then
            echo "::error::Release ${TAG} 已存在但仍是 draft:请在 GitHub 上发布或删除它后重跑,不自动覆盖。"
            exit 1
          fi
          # annotated tag 的正文(release.sh 写入的本版内容清单)作为说明开头;
          # --generate-notes 会把自动生成的 PR 清单追加在后面。
          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes "$notes"
          echo "### ✅ 已发布 Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    if: ${{ github.event_name == 'push' || inputs.deploy == true }}
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      target_sha: ${{ needs.release.outputs.target_sha }}
