# 合入门禁:PR 与 main 上的每次 push 都跑后端测试 + 前端 lint/build。
# 「tag 即发布」的前提是「合入 main 的东西已经过了测试」——发版只是给 main 上某个提交起名,
# 不再做验证;所以验证必须前移到这里。分支保护里把 `backend (pytest)` 与 `frontend (lint + build)`
# 设为 required(见 docs/ops/release-process.md 的分支保护清单)。docs-site job 只校验用户手册能构建(含死链),不进 required。
#
# 后端测试(issue #150)拆成两个 job 各占一台 runner 并行,每个 job 内再用 pytest-xdist 开 4 个 worker
# (public 仓库的 ubuntu-latest 是 4 vCPU):
#   backend-unit   —— tests/ 里除部署脚本 / 迁移之外的全部用例(2026-11-16 实测约 3470 个;不分片时 4 worker ≈ 10 min,
#                     曾是 PR 等待时间的决定项,本机同一条命令 3.5 min)
#   backend-deploy —— tests/test_deploy_*.py + tests/test_migrations.py(约 220 个,单个 10~26 s:每个用例真起
#                     deploy.sh,一次运行几百次进程 spawn,等待为主;4 worker ≈ 4~6 min)
# 两边对 tests/ 的划分由 tests/test_ci_workflow.py 守卫(互斥、覆盖全部文件、并行参数不退回串行)。
# 分片(issue #289):两个 job 各用矩阵再拆成 N 个 job 并行(unit 3 片、deploy 2 片;public 仓库 runner 免费),每片仍是 4 个 worker。
# 命令只差 `--shard I/N`:tests/conftest.py 按用例函数 nodeid 的 CRC32 决定它属于哪一片,纯函数、每条用例恰好一片。
# 2026-11-16 实测:整条 CI 从 8.7~10.5 min 降到约 4 min(unit 三片 2.9~3.7 min,deploy 两片 2.1~2.4 min)。
# 矩阵取值必须恰是 1..N、分母必须等于 N、命令里必须用矩阵变量——少一片的后果是那一片的用例哪个 job 都不跑而 CI 照样绿。
# 守这件事的用例不能只待在被分片的 job 里(分片一旦写错,它们自己可能正好落在没人跑的那一片):所以另有不分片的
# backend-guards job 单独跑 tests/test_ci_workflow.py 与 tests/test_ci_scope.py(清单 = ci_scope.GUARD_TESTS),汇总门要求它成功。
# 汇总门读的 `needs.<job>.result` 对矩阵 job 是各片的汇总:按官方文档,任一片失败即 failure、job 级 `if` 为假时整体 skipped。
# (社区有未经官方确认的报告称「某一片因分不到 runner 被取消」时汇总仍可能是 success;记观察期,见 docs/backlog.md。)
# `--dist worksteal` 不是可选项:默认 load 调度按连续块分发,收集顺序里连成一片的部署用例会整块落到
# 单个 worker、其余三个空转(2026-09-23 本地实测 13 min vs 5:50)。
# `backend (pytest)` 是汇总门 job,只为让分支保护里既有的 required check 名继续有效;
# `if: always()` + 逐项核对上游结果——不这样写,上游失败时它会被 skip,而 skip 在分支保护眼里等于通过。
#
# 按改动面选 job(issue #288):`changes` job 跑 scripts/ci_scope.py。PR 的**全部**改动路径都落在 frontend/ docs/ docs-site/
# 与仓根 *.md 之内时,两个重型后端 job 跳过,改跑 backend-light——只含「读这些路径的后端守卫」(清单 = ci_scope.LIGHT_TESTS,
# 不到一分钟);任一路径在外、没有改动路径、看不准、以及 push 到 main,一律照常全量。偏向全量是有意的:
# 判错成「全量」只是多等几分钟,判错成「轻量」会让后端回归带着绿灯合入。push 到 main 永远全量,是这条裁剪的兜底。
# 「重型 job 被跳过不丢覆盖」由 tests/conftest.py 的读取审计强制(不在 LIGHT_TESTS 里的测试读了上述路径即失败);
# 汇总门只在 `changes` 成功且明确给出 backend=false 时才接受上游 skipped,此时必须 backend-light 成功。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动面判定(见文件头)。fetch-depth: 2 = 合并提交 + 它的两个父提交,脚本靠这两个父提交认出「这是 PR 的合并提交」
  # 并算出相对 base 的改动路径;深度退回 1 时脚本看不到父提交、一律按全量(安全,但裁剪悄悄失效——守卫测试钉住这个值)。
  # 判定只由脚本写 $GITHUB_OUTPUT,工作流里不另写。
  changes:
    name: changes (scope)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide which backend jobs this change needs
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_scope.py

  backend-unit:
    name: backend-unit (pytest)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # 依赖按入库的钉版清单装(与两条部署路径同一份版本事实来源),不现解 pyproject;
      # tests/test_docker_requirements.py 守卫清单与 pyproject 一致。pytest / pytest-xdist 是测试工具,
      # 不进部署清单(pyproject 的 dev 组同样声明了二者)。
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      # issue #171:uv.lock 现已入库,但改依赖时最容易漏掉它——锁悄悄陈旧(旧锁里 mcp 丢过 <2 上限、
      # oss2 整条缺席、registry 还是开发机的镜像源),而基于本地新锁导出的 requirements 全绿。
      # 这一步把「锁与 pyproject 漂移」变成红灯;文本侧的不变量(无镜像源、无退役重型栈、根包 version
      # 与 src/version.py 一致)由 tests/test_uv_lock.py 在 Run tests 里守。
      # 写成独立步骤:上面那条 pytest 命令守卫(tests/test_ci_workflow.py)按一行解析,不能并进去。
      - name: Verify uv.lock matches pyproject
        run: uv lock --check

      # 少数 Podcast 测试探测 ffmpeg/ffprobe 是否存在(存在时走真实封装路径);部署测试用 PATH 桩,不需要它
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      # 划分模式与 backend-deploy 的正向列表逐字相同(守卫测试比对);命令写成一行,守卫按行解析。
      # --ignore-glob 的值加引号:它要原样交给 pytest 去 fnmatch,不能让 shell 先展开(zsh 会直接报 no matches)
      - name: Run tests
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider -n 4 --dist worksteal --durations=25 --shard ${{matrix.shard}}/3 --ignore-glob='tests/test_deploy_*.py' --ignore=tests/test_migrations.py

  backend-deploy:
    name: backend-deploy (pytest)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # issue #227:已发布(进过正式 tag)的迁移文件一字不改——生产机 worker 第 7 道门向前部署时对 alembic/versions 的任何
      # M / D 一律 fail closed、没有放行开关(v3.67.0 就被 #211 的 docstring 路径与 #220 的收养守卫卡住,只能走手工路径)。
      # 这里把同一条规则前移到 PR:checkout 是 depth 1、无 tag,脚本自己 ls-remote 取最新 vX.Y.Z 并只 fetch 那一个 tag;
      # 新增允许,改写 / 删除 / 改名 fail;取不到基线同样是红(rc 2),不会静默放行。只用 git + 标准库,放在装依赖之前先红先知道。
      - name: Released migration files are byte-identical to the latest tag
        run: python3 scripts/check_released_migrations.py

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      # 位置参数不加引号:pytest 不展开 glob,靠 runner 的 bash 展开;无匹配时 bash 原样传递、pytest 报文件不存在,CI 会红而不是静默漏跑
      - name: Run tests
        run: .venv/bin/python -m pytest tests/test_deploy_*.py tests/test_migrations.py -q -p no:cacheprovider -n 4 --dist worksteal --durations=25 --shard ${{matrix.shard}}/2

  # 重型 job 被跳过时的替身(issue #288):只跑读前端 / 文档文件的后端守卫。文件清单与 scripts/ci_scope.py 的 LIGHT_TESTS
  # 逐字一致(守卫测试比对);命令写成一行,守卫按行解析。这几条不探测 ffmpeg,不装它。
  backend-light:
    name: backend-light (pytest)
    needs: [changes]
    if: needs.changes.outputs.backend == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      - name: Run tests
        run: .venv/bin/python -m pytest tests/test_docs_index.py tests/test_pwa_support.py -q -p no:cacheprovider

  # 守卫工作流自己的测试,不分片、单独跑(issue #289,Codex R1-1,见文件头)。它们同时仍在 unit 的某一片里各跑一遍:
  # 两边互为对照——unit 的命令被改坏了这里会红,这个 job 的命令被改坏了 unit 那边会红。只动前端 / 文档的 PR 改不到
  # 工作流与测试,不必跑它。文件清单与 scripts/ci_scope.py 的 GUARD_TESTS 逐字一致;命令不带 --shard。
  backend-guards:
    name: backend-guards (pytest)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      - name: Run tests
        run: .venv/bin/python -m pytest tests/test_ci_workflow.py tests/test_ci_scope.py -q -p no:cacheprovider

  # 汇总门:分支保护里 required 的是这个名字(见文件头注释)。两条通过路径,其余全拒:
  #   backend=true  → backend-unit、backend-deploy、backend-guards 都 success;
  #   backend=false → 这三个都是 skipped 且 backend-light success。
  # `changes` 没成功时它的 output 是空串,落进最后的 else——判定本身出错不能变成放行。
  backend:
    name: backend (pytest)
    needs: [changes, backend-unit, backend-deploy, backend-light, backend-guards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the backend jobs this change needs
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          UNIT: ${{ needs.backend-unit.result }}
          DEPLOY: ${{ needs.backend-deploy.result }}
          LIGHT: ${{ needs.backend-light.result }}
          GUARDS: ${{ needs.backend-guards.result }}
        run: |
          echo "changes=$CHANGES backend=$BACKEND backend-unit=$UNIT backend-deploy=$DEPLOY backend-light=$LIGHT backend-guards=$GUARDS"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$BACKEND" = "true" ]; then
            [ "$UNIT" = "success" ] && [ "$DEPLOY" = "success" ] && [ "$GUARDS" = "success" ]
          elif [ "$BACKEND" = "false" ]; then
            [ "$UNIT" = "skipped" ] && [ "$DEPLOY" = "skipped" ] && [ "$GUARDS" = "skipped" ] && [ "$LIGHT" = "success" ]
          else
            exit 1
          fi

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 官方下载脚本取钉版的 actionlint 二进制(结果可重现);工作流一改就静态检查(issue #102 起 release.yml / deploy.yml 承担部署)
      - name: Run actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 . >/dev/null
          # concurrency.queue 是 GitHub 2026-05-07 公告的官方键(deploy.yml 用 queue: max,最多保留 100 个等待项),
          # actionlint 1.7.12 的 schema 尚未收录,单独忽略这一条,其余照查。
          ./actionlint -color -shellcheck= -pyflakes= -ignore 'unexpected key "queue" for "concurrency" section'

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docs-site:
    name: docs-site (vitepress build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # 读者使用手册(issue #89 / #162);vitepress build 默认校验站内死链,文档改动一合入就能发现(文档整理波 issue #210 D8)
      - run: npm ci --no-audit --no-fund
      - run: npm run build
