# 临时实验(issue #289),合入前删除本文件。
# 问题:同一条 unit 命令本机 3.5 min、runner 上 10 min。一个假设是 SQLite 的 fsync——macOS 的 fsync 不真正落盘,
# runner 的 ext4 会;几千个用例各自提交多次。验证办法:同一片用例(与 ci.yml 的第 1 片逐字同一条命令),
# 只把临时目录(pytest tmp_path、conftest 沙箱都跟 TMPDIR 走)放到 tmpfs,和 ci.yml 里同一次运行的第 1 片比耗时。
name: CI experiment (issue 289)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-exp-289-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-shm:
    name: exp unit 1/3 on tmpfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Run tests
        env:
          TMPDIR: /dev/shm
        run: df -h /dev/shm && .venv/bin/python -m pytest tests -q -p no:cacheprovider -n 4 --dist worksteal --durations=25 --shard 1/3 --ignore-glob='tests/test_deploy_*.py' --ignore=tests/test_migrations.py

  deploy-shm:
    name: exp deploy 1/2 on tmpfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r docker/requirements.txt pytest pytest-xdist

      - name: Run tests
        env:
          TMPDIR: /dev/shm
        run: df -h /dev/shm && .venv/bin/python -m pytest tests/test_deploy_*.py tests/test_migrations.py -q -p no:cacheprovider -n 4 --dist worksteal --durations=25 --shard 1/2
