# Dorami 生产部署(推荐路径)。用法见 docs/deploy-docker.md;一键部署:./deploy-docker.sh
# 装不了 Docker 的机器走裸机路径 ./deploy.sh(docs/deploy-baremetal.md)。
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      # 受限网络可换 PyPI 镜像,如:
      # args: { PIP_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple" }
    restart: unless-stopped
    environment:
      DORAMI_CONFIG_FILE: /app/config/production.ini
      # 外网/内网都保持 all；空覆盖由 installation 自动派生：external
      # 开完整处理链，internal 关闭处理并只同步。
      DORAMI_RUNTIME_ROLE: "all"
      DORAMI_PODCAST_INSTALLATION: ${DORAMI_PODCAST_INSTALLATION:?set external or internal}
      DORAMI_PODCAST_ALLOWED_STAGES: ${DORAMI_PODCAST_ALLOWED_STAGES-}
      # 跨重启/重建保持稳定,不要使用 hostname/container id。
      DORAMI_PODCAST_AUTHORITY_ID: ${DORAMI_PODCAST_AUTHORITY_ID:?set a stable Podcast authority id}
      DORAMI_PODCAST_READER_TEXT_DEFAULT_CHARS: ${DORAMI_PODCAST_READER_TEXT_DEFAULT_CHARS:-}
      DORAMI_PODCAST_READER_TEXT_MAX_CHARS: ${DORAMI_PODCAST_READER_TEXT_MAX_CHARS:-}
      DORAMI_PODCAST_READER_TEXT_QUERY_MAX_CHARS: ${DORAMI_PODCAST_READER_TEXT_QUERY_MAX_CHARS:-}
      DORAMI_PODCAST_TEXT_ARTIFACT_MAX_BYTES: ${DORAMI_PODCAST_TEXT_ARTIFACT_MAX_BYTES:-}
      DORAMI_PODCAST_TEXT_ARTIFACT_MAX_CHARS: ${DORAMI_PODCAST_TEXT_ARTIFACT_MAX_CHARS:-}
      DORAMI_PODCAST_TRANSCRIPT_DURATION_TOLERANCE_SECONDS: ${DORAMI_PODCAST_TRANSCRIPT_DURATION_TOLERANCE_SECONDS:-}
      DORAMI_PODCAST_TEXT_SYNC_PAGE_MAX_BYTES: ${DORAMI_PODCAST_TEXT_SYNC_PAGE_MAX_BYTES:-}
      DORAMI_PODCAST_TEXT_SYNC_PAGE_MAX_ROWS: ${DORAMI_PODCAST_TEXT_SYNC_PAGE_MAX_ROWS:-}
      DORAMI_PODCAST_READER_CURSOR_SECRET: ${DORAMI_PODCAST_READER_CURSOR_SECRET:-}
      # External defaults on and internal defaults off. Missing concrete provider
      # credentials/accounting still prevents any paid request.
      DORAMI_PODCAST_PROCESSING_ENABLED: ${DORAMI_PODCAST_PROCESSING_ENABLED:-}
      DORAMI_PODCAST_PROVIDER_READY_TARGETS: ${DORAMI_PODCAST_PROVIDER_READY_TARGETS:-}
      DORAMI_PODCAST_TEXT_PIPELINE_VERSION: ${DORAMI_PODCAST_TEXT_PIPELINE_VERSION:-}
      DORAMI_PODCAST_AUDIO_PIPELINE_VERSION: ${DORAMI_PODCAST_AUDIO_PIPELINE_VERSION:-}
      DORAMI_PODCAST_PROCESSING_POLICY_VERSION: ${DORAMI_PODCAST_PROCESSING_POLICY_VERSION:-}
      DORAMI_PODCAST_MONTHLY_BUDGET_CNY_MINOR: ${DORAMI_PODCAST_MONTHLY_BUDGET_CNY_MINOR:-}
      DORAMI_PODCAST_PER_RUN_BUDGET_CNY_MINOR: ${DORAMI_PODCAST_PER_RUN_BUDGET_CNY_MINOR:-}
      DORAMI_PODCAST_BUDGET_SCOPE: ${DORAMI_PODCAST_BUDGET_SCOPE:-}
      DORAMI_PODCAST_BUDGET_TIMEZONE: ${DORAMI_PODCAST_BUDGET_TIMEZONE:-}
      DORAMI_PODCAST_VOICE_PROFILES: ${DORAMI_PODCAST_VOICE_PROFILES:-}
      DORAMI_PODCAST_DEFAULT_VOICE_PROFILE: ${DORAMI_PODCAST_DEFAULT_VOICE_PROFILE:-}
      DORAMI_PODCAST_WORKER_TICK_SECONDS: ${DORAMI_PODCAST_WORKER_TICK_SECONDS:-}
      DORAMI_PODCAST_WORKER_LEASE_SECONDS: ${DORAMI_PODCAST_WORKER_LEASE_SECONDS:-}
      DORAMI_PODCAST_WORKER_HEARTBEAT_SECONDS: ${DORAMI_PODCAST_WORKER_HEARTBEAT_SECONDS:-}
      DORAMI_PODCAST_WORKER_FALLBACK_RETRY_SECONDS: ${DORAMI_PODCAST_WORKER_FALLBACK_RETRY_SECONDS:-}
      DORAMI_PODCAST_WORKER_MAX_STEPS_PER_TICK: ${DORAMI_PODCAST_WORKER_MAX_STEPS_PER_TICK:-}
      # 必须位于下方持久卷 /app/data 内。
      DORAMI_PODCAST_ARTIFACT_ROOT_DIR: /app/data/podcast-artifacts
      # 可由宿主按持久卷容量覆盖；留空时读取 production.ini。
      DORAMI_PODCAST_ARTIFACT_TOTAL_QUOTA_MB: ${DORAMI_PODCAST_ARTIFACT_TOTAL_QUOTA_MB:-}
      DORAMI_PODCAST_ARTIFACT_MINIMUM_FREE_MB: ${DORAMI_PODCAST_ARTIFACT_MINIMUM_FREE_MB:-}
      DORAMI_PODCAST_ARTIFACT_STAGING_TTL_SECONDS: ${DORAMI_PODCAST_ARTIFACT_STAGING_TTL_SECONDS:-}
      DORAMI_PODCAST_ARTIFACT_SOURCE_AUDIO_TTL_SECONDS: ${DORAMI_PODCAST_ARTIFACT_SOURCE_AUDIO_TTL_SECONDS:-}
      DORAMI_PODCAST_ARTIFACT_SOURCE_AUDIO_QUOTA_MB: ${DORAMI_PODCAST_ARTIFACT_SOURCE_AUDIO_QUOTA_MB:-}
      DORAMI_PODCAST_ARTIFACT_DOWNLOAD_MAX_REDIRECTS: ${DORAMI_PODCAST_ARTIFACT_DOWNLOAD_MAX_REDIRECTS:-}
      # External ASR only: fixed public CAS endpoint + short-lived HMAC grant.
      DORAMI_PODCAST_ASR_FETCH_PUBLIC_BASE_URL: ${DORAMI_PODCAST_ASR_FETCH_PUBLIC_BASE_URL:-}
      DORAMI_PODCAST_ASR_FETCH_SIGNING_SECRET: ${DORAMI_PODCAST_ASR_FETCH_SIGNING_SECRET:-}
      DORAMI_PODCAST_ASR_FETCH_PREVIOUS_SIGNING_SECRET: ${DORAMI_PODCAST_ASR_FETCH_PREVIOUS_SIGNING_SECRET:-}
      DORAMI_PODCAST_ASR_FETCH_URL_TTL_SECONDS: ${DORAMI_PODCAST_ASR_FETCH_URL_TTL_SECONDS:-}
      DORAMI_PODCAST_ASR_FETCH_CLOCK_SKEW_SECONDS: ${DORAMI_PODCAST_ASR_FETCH_CLOCK_SKEW_SECONDS:-}
      DORAMI_PODCAST_ASR_FETCH_MIN_REMAINING_SECONDS: ${DORAMI_PODCAST_ASR_FETCH_MIN_REMAINING_SECONDS:-}
      # 机密只走环境变量注入(宿主 export 或 .env 文件),不进镜像不入库
      DORAMI_X_BEARER_TOKEN: ${DORAMI_X_BEARER_TOKEN:-}
      ALIYUN_AK_ID: ${ALIYUN_AK_ID:-}
      ALIYUN_AK_SECRET: ${ALIYUN_AK_SECRET:-}
      ALIYUN_SECURITY_TOKEN: ${ALIYUN_SECURITY_TOKEN:-}
      NLS_APP_KEY: ${NLS_APP_KEY:-}
      NLS_ACCESS_TOKEN: ${NLS_ACCESS_TOKEN:-}
      NLS_TOKEN_EXPIRES_AT: ${NLS_TOKEN_EXPIRES_AT:-}
      DORAMI_ALIYUN_ISI_REGION_ID: ${DORAMI_ALIYUN_ISI_REGION_ID:-}
      DORAMI_ALIYUN_ISI_ASR_DOMAIN: ${DORAMI_ALIYUN_ISI_ASR_DOMAIN:-}
      DORAMI_ALIYUN_ISI_ASR_PRODUCT: ${DORAMI_ALIYUN_ISI_ASR_PRODUCT:-}
      DORAMI_ALIYUN_ISI_ASR_API_VERSION: ${DORAMI_ALIYUN_ISI_ASR_API_VERSION:-}
      DORAMI_ALIYUN_ISI_ASR_TASK_VERSION: ${DORAMI_ALIYUN_ISI_ASR_TASK_VERSION:-}
      DORAMI_ALIYUN_ISI_ASR_ENABLE_WORDS: ${DORAMI_ALIYUN_ISI_ASR_ENABLE_WORDS:-}
      DORAMI_ALIYUN_ISI_ASR_AUTO_SPLIT: ${DORAMI_ALIYUN_ISI_ASR_AUTO_SPLIT:-}
      DORAMI_ALIYUN_ISI_ASR_ENABLE_SAMPLE_RATE_ADAPTIVE: ${DORAMI_ALIYUN_ISI_ASR_ENABLE_SAMPLE_RATE_ADAPTIVE:-}
      DORAMI_ALIYUN_ISI_ASR_POLL_INTERVAL_SECONDS: ${DORAMI_ALIYUN_ISI_ASR_POLL_INTERVAL_SECONDS:-}
      DORAMI_ALIYUN_ISI_TOKEN_URL: ${DORAMI_ALIYUN_ISI_TOKEN_URL:-}
      DORAMI_ALIYUN_ISI_TTS_URL: ${DORAMI_ALIYUN_ISI_TTS_URL:-}
      DORAMI_ALIYUN_ISI_TTS_DEVICE_ID: ${DORAMI_ALIYUN_ISI_TTS_DEVICE_ID:-}
      DORAMI_ALIYUN_ISI_TTS_VOICE_PROFILES_JSON: ${DORAMI_ALIYUN_ISI_TTS_VOICE_PROFILES_JSON:-}
      DORAMI_ALIYUN_ISI_TTS_RESULT_ALLOWED_HOST_SUFFIXES: ${DORAMI_ALIYUN_ISI_TTS_RESULT_ALLOWED_HOST_SUFFIXES:-}
      DORAMI_ALIYUN_ISI_TTS_MAX_CHARS: ${DORAMI_ALIYUN_ISI_TTS_MAX_CHARS:-}
      DORAMI_ALIYUN_ISI_TTS_POLL_INTERVAL_SECONDS: ${DORAMI_ALIYUN_ISI_TTS_POLL_INTERVAL_SECONDS:-}
      DORAMI_ALIYUN_ISI_REQUEST_TIMEOUT_SECONDS: ${DORAMI_ALIYUN_ISI_REQUEST_TIMEOUT_SECONDS:-}
      DORAMI_ALIYUN_ISI_TOKEN_REFRESH_SKEW_SECONDS: ${DORAMI_ALIYUN_ISI_TOKEN_REFRESH_SKEW_SECONDS:-}
      # 独立于凭据的供应商额度/单价快照；任一必填项留空即 fail-closed。
      DORAMI_ALIYUN_ISI_ASR_QUOTA_SCOPE: ${DORAMI_ALIYUN_ISI_ASR_QUOTA_SCOPE:-}
      DORAMI_ALIYUN_ISI_ASR_QUOTA_TIMEZONE: ${DORAMI_ALIYUN_ISI_ASR_QUOTA_TIMEZONE:-}
      DORAMI_ALIYUN_ISI_ASR_DAILY_AUDIO_SECONDS_LIMIT: ${DORAMI_ALIYUN_ISI_ASR_DAILY_AUDIO_SECONDS_LIMIT:-}
      DORAMI_ALIYUN_ISI_ASR_ENTITLEMENT_ENDS_AT: ${DORAMI_ALIYUN_ISI_ASR_ENTITLEMENT_ENDS_AT:-}
      DORAMI_ALIYUN_ISI_ASR_PROVIDER_DEADLINE_SECONDS: ${DORAMI_ALIYUN_ISI_ASR_PROVIDER_DEADLINE_SECONDS:-}
      DORAMI_ALIYUN_ISI_ASR_PRICE_CNY_MINOR_PER_HOUR: ${DORAMI_ALIYUN_ISI_ASR_PRICE_CNY_MINOR_PER_HOUR:-}
      DORAMI_ALIYUN_ISI_ASR_PRICING_REVISION: ${DORAMI_ALIYUN_ISI_ASR_PRICING_REVISION:-}
      DORAMI_ALIYUN_ISI_TTS_QUOTA_SCOPE: ${DORAMI_ALIYUN_ISI_TTS_QUOTA_SCOPE:-}
      DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_ID: ${DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_ID:-}
      DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_STARTS_AT: ${DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_STARTS_AT:-}
      DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_ENDS_AT: ${DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_ENDS_AT:-}
      DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_CHARACTER_LIMIT: ${DORAMI_ALIYUN_ISI_TTS_CAMPAIGN_CHARACTER_LIMIT:-}
      DORAMI_ALIYUN_ISI_TTS_PROVIDER_DEADLINE_SECONDS: ${DORAMI_ALIYUN_ISI_TTS_PROVIDER_DEADLINE_SECONDS:-}
      DORAMI_ALIYUN_ISI_TTS_PRICE_CNY_MINOR_PER_10000_CHARS: ${DORAMI_ALIYUN_ISI_TTS_PRICE_CNY_MINOR_PER_10000_CHARS:-}
      DORAMI_ALIYUN_ISI_TTS_PRICING_REVISION: ${DORAMI_ALIYUN_ISI_TTS_PRICING_REVISION:-}
      DORAMI_ALIYUN_ISI_TTS_USAGE_SETTLEMENT_MODE: ${DORAMI_ALIYUN_ISI_TTS_USAGE_SETTLEMENT_MODE:-}
      # cron 语义按此时区解释(与裸机部署的宿主时区行为对齐)
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # SQLite、图片与 Podcast 本地 CAS(上面的 artifact root)一并持久化。
      - ./data:/app/data
      - ./config/production.ini:/app/config/production.ini:ro
    # Chromium 渲染需要:Docker 默认 /dev/shm 只有 64MB,页面渲染会崩
    shm_size: "1gb"
    healthcheck:
      # /api/auth/session 是免鉴权端点(全局鉴权中间件的白名单);/api/runtime 未登录会 401
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/api/auth/session"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      # 受限网络可换 npm 镜像,如:
      # args: { NPM_REGISTRY: "https://registry.npmmirror.com" }
    restart: unless-stopped
    ports:
      # 默认 80(全接口);外层还有 TLS 反代时用绑定形式收进环回,
      # 如 DORAMI_HTTP_LISTEN=127.0.0.1:8080(生产:宿主 Nginx 443 终止 TLS 后反代到这里)
      - "${DORAMI_HTTP_LISTEN:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
