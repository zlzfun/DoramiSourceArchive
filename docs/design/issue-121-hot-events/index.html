<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="porcelain">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>热点事件榜 · 样页总览</title>
<script>
  // 首帧挂主题 / 配色 / 减少动效(现网:index.html 内联脚本挂 <html data-theme data-palette data-motion>)
  (function () {
    var q = new URLSearchParams(location.search), r = document.documentElement;
    r.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
    var p = q.get('palette');
    r.dataset.palette = p === 'graphite' || p === 'paper' ? p : 'porcelain';
    if (q.get('motion') === 'reduce') r.dataset.motion = 'reduce';
  })();
</script>

* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
* { scrollbar-width: thin;
  scrollbar-color: transparent transparent; }
*:hover { scrollbar-color: var(--dorami-scrollbar) transparent; }

::-webkit-scrollbar-track { background: transparent; }

body { margin: 0;
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse 70% 50% at 12% -8%, rgba(var(--dorami-accent-rgb), 0.06), transparent 58%),

button { cursor: pointer; }
@layer base {
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible { outline: 2px solid var(--dorami-focus);
    outline-offset: 2px; }
  [lang="en"] { --font-serif: var(--font-serif-latin); }
}
button:disabled { cursor: not-allowed; }
input[type="checkbox"],
input[type="radio"] { accent-color: var(--dorami-blue); }
::selection { background: rgba(var(--dorami-accent-rgb), 0.18);
  color: var(--dorami-ink); }

    /* 静默仪器·描边预算:亮色零描边(靠高程),暗色由 token 换成细白线 */
    border: 1px solid var(--dorami-card-bd);
    background: var(--dorami-card);
    box-shadow: var(--sh-2), inset 0 1px 0 var(--dorami-edge);
    backdrop-filter: blur(18px) saturate(1.1);
    transition:
      border-color var(--motion-medium) var(--motion-ease),
      box-shadow var(--motion-medium) var(--motion-ease),
      transform var(--motion-medium) var(--motion-ease),
      background var(--motion-medium) var(--motion-ease); }

    padding: 0 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;   /* 次要按钮 400,主按钮 600(一个视图一个主操作,§8) */
    letter-spacing: 0;
    line-height: 20px;
    transition:
      transform var(--motion-fast) var(--motion-spring),
      box-shadow var(--motion-fast) var(--motion-ease),
      border-color var(--motion-fast) var(--motion-ease),
      background var(--motion-fast) var(--motion-ease),

<script>
/* 画框共用:阅读器外壳(视图轨 + 源栏 + 榜单页头)、移动壳、时间与徽标工具。
   结构照抄现网 DOM(docs/design/guest-mode/assets/snap 的读者快照),类名全部来自 index.css / mobile.css。 */
(function () {
  const H = window.HOT;
  const q = new URLSearchParams(location.search);
  const U = (window.HOTU = {});

  U.esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  U.icon = (name, cls = '') => `<svg class="lucide lucide-${name} ${cls}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${window.ICONS[name] || ''}</svg>`;

  // ── 时间(读者面相对时间,口径同 utils/datetime.formatRelativeTime;组头同 utils/readerTime.dayLabelOf)──
  // 一律按北京时间墙钟显示(数据带 +08:00),与看样页机器的时区无关
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const pad = (n) => String(n).padStart(2, '0');
  const D = (s) => new Date(s);
  const B = (s) => new Date(Date.parse(s) + 8 * 3600e3); // 用 getUTC* 读出北京时间
  U.setNow = (iso) => { U.NOW = D(iso); U.NOW_ISO = iso; };
  U.ms = (iso) => Date.parse(iso);
  U.rel = (iso) => {
    const sec = Math.floor((U.NOW - D(iso)) / 1000);
    if (sec < 60) return '刚刚';
    if (sec < 3600) return `${Math.floor(sec / 60)} 分钟前`;
    if (sec < 86400) return `${Math.floor(sec / 3600)} 小时前`;
    if (sec < 86400 * 7) return `${Math.floor(sec / 86400)} 天前`;
    return U.md(iso);
  };
  U.md = (iso) => { const d = B(iso); return `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`; };
  U.hm = (iso) => { const d = B(iso); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
  U.mdhm = (iso) => `${U.md(iso)} ${U.hm(iso)}`;
  U.full = (iso) => { const d = B(iso); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${U.hm(iso)}`; };
  U.dayKey = (iso) => { const d = B(iso); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  U.dayLabel = (iso) => {
    const md = U.md(iso);
    const k = U.dayKey(iso);
    if (k === U.dayKey(U.NOW_ISO)) return `今天 · ${md}`;
    if (k === U.dayKey(new Date(U.NOW - 86400e3).toISOString())) return `昨天 · ${md}`;
    return `${md} 周${WD[B(iso).getUTCDay()]}`;
  };
  U.weekdayLabel = (iso) => `${U.md(iso)} 周${WD[B(iso).getUTCDay()]}`;
  U.timeTag = (iso, text) => `<time datetime="${iso}" title="${U.full(iso)}">${U.esc(text ?? U.rel(iso))}</time>`;

  // 英文文本标 lang="en"(utils/readerText.latinLang 同口径)
  U.lang = (t) => (/[A-Za-z]/.test(t) && !/[\u4e00-\u9fff]/.test(t) ? ' lang="en"' : '');

  U.ROLE = { official: '官方', media: '媒体', personal: '个人', leaderboard: '榜单' };

  // ── LogoMark(sourceTaxonomy.LOGO_SIZES 刻度;本地 logo 失败 / 无 logo 时露字母徽标,与内网拿不到 favicon 时一致)──
  const SIZES = { s15: [15, 4.5, 7.5, 10], s17: [17, 5.5, 8, 11], s20: [20, 6, 9, 13], xs: [22, 7, 9, 14], sm: [30, 9, 11, 18] };
  U.logo = (pubKey, size = 's20', extra = '') => {
    const p = H.publishers[pubKey] || { name: pubKey, accent: '#64748b', mono: '?' };
    const [box, r, font, img] = SIZES[size];
    const src = p.logo && window.LOGOS[p.logo];
    return `<span class="logo-mark logo-mark-img ${extra}" style="width:${box}px;height:${box}px;border-radius:${r}px;--logo-accent:${p.accent}" title="${U.esc(p.name)}"><span class="logo-mark-img-fallback" style="font-size:${font}px">${U.esc(p.mono)}</span>${src ? `<img src="${src}" width="${img}" height="${img}" alt="">` : ''}</span>`;
  };
  U.pubName = (k) => (H.publishers[k] || { name: k }).name;

  // 排名变化:previous_rank 来自最近一次 07:00 快照(无快照的部署整列不画)
  U.move = (it) => {
    if (it.previous_rank == null) return { dir: 'enter', n: 0 };
    const n = it.previous_rank - it.rank;
    if (n > 0) return { dir: 'up', n };
    if (n < 0) return { dir: 'down', n: -n };
    return { dir: 'flat', n: 0 };
  };

  // 代表稿之外,「最新进展」= 报道时间最新的成员(与代表稿同一篇时不重复画)
  U.latestMember = (d) => {
    const m = d.members[0];
    return m && !m.is_representative ? m : null;
  };
  U.memberTitle = (m) => m.title_zh || m.title;
  U.groupByPublisher = (d) => {
    const map = new Map(d.publishers.map((p) => [p.key, { ...p, items: [] }]));
    for (const m of d.members) map.get(m.publisher_key)?.items.push(m);
    for (const g of map.values()) {
      g.items.sort((a, b) => D(a.report_at) - D(b.report_at));
      g.channels = [...new Set(g.items.map((m) => m.source_name))];
      g.role = g.items.some((m) => m.source_role === 'official') ? 'official' : g.items[0].source_role;
    }
    return [...map.values()];
  };
  U.byDay = (members, asc = false) => {
    const list = [...members].sort((a, b) => (asc ? D(a.report_at) - D(b.report_at) : D(b.report_at) - D(a.report_at)));
    const out = [];
    for (const m of list) {
      const k = U.dayKey(m.report_at);

    ['媒体', [['ithome', 'IT之家 AI'], ['aiera', '新智元'], ['qbitai', '量子位'], ['the_decoder', 'The Decoder']]],

    const items = ctx.state.board.items;
    if (q.get('open') === 'first' && items.length) ctx.open = items[0].event_id;
    document.documentElement.classList.add('is-frame', `is-${device}`);
    const DIR = window.DIRECTION;
    const root = document.getElementById('root');
    U.render = () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      const main = U.rankingHead() + DIR.board(ctx);
      root.innerHTML = device === 'desktop' ? U.desktopShell(main, dark) : U.mobileShell(main);
      DIR.after?.(ctx, root);
    };
    U.ctx = ctx;
    root.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'rail') { U.toast('样页只画了榜单页'); return; }
      if (act === 'seg') { U.toast('样页只画了「热点」段'); return; }
      if (act === 'theme') {
        if (window.parent !== window) window.parent.postMessage({ type: 'hot-theme-toggle' }, '*');
        else { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; U.render(); }
        return;
      }
      DIR.onAct?.(act, el, ctx, e);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') DIR.onEscape?.(ctx); });
    window.addEventListener('message', (e) => {
      if (e.data?.type !== 'hot-theme') return;
      const r = document.documentElement;
      r.dataset.theme = e.data.theme;
      r.dataset.palette = e.data.palette;
      U.render();
    });
    U.render();
  };
})();

</script>
<script>

(function () {

        '契约影响：卡上「最新」一行要榜单接口每件多带最新一篇（标题 / 来源 / 时间），现草案只有 latest_at，选 B 需加这个字段。',
      ],
    },
    c: {
      name: '头版', file: 'direction-c.html',
      pitch: '报纸头版式：第 1 件做头条（大标题 + 代表稿原题 + 摘要 + 报道走势条），第 2–3 件并排二条，其余一行一件。点开进整页「事件页」，回到热点用页内返回。',
      points: [
        '层级最强，头条之外的密度最低；只有 3 件时正好是「头条 + 二条」，版面依然完整，空榜也占一整块头条位。',
        '报道走势条只按时间排点：谁在什么时候报了这件事，不画热度；左端挂「接前报」，右端挂「后续」。',
        '事件页同时摊开时间线（主栏）和按发布主体分组的来源（侧栏），顶部一条故事线；不弹层，页面本身就是详情。',
        '默认黑体；宋体报头在规范里只给「我的」页（早报 / 兴趣），这里留了「头条字体」对照开关，需破例才用。',

  const ORDER = ['a', 'b', 'c'];
  const isIndex = !window.DIRECTION;

      <section class="sh-card sh-notes">
        <h2>数据与口径</h2>
        <table><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
      </section>`;
  }

  function fit() {
    const stage = root.querySelector('.sh-stage');
    const sd = root.querySelector('#s-desktop');
    if (!stage || !sd) return;
    const avail = stage.clientWidth - (S.view === 'both' ? 390 + 24 : 0);
    const s = Math.max(0.42, Math.min(1, avail / 1440));
    sd.style.width = `${Math.round(1440 * s)}px`;
    sd.style.height = `${Math.round(900 * s)}px`;
    root.querySelector('#f-desktop').style.transform = `scale(${s})`;
    root.querySelector('#lbl-d').textContent = `桌面 · 1440 × 900${s < 1 ? ` · 缩放 ${Math.round(s * 100)}%` : ''}`;
  }

  function applyTheme() {
    const r = document.documentElement;
    r.dataset.theme = S.theme;
    r.dataset.palette = S.palette;
    for (const id of ['f-desktop', 'f-mobile']) {
      root.querySelector(`#${id}`)?.contentWindow?.postMessage({ type: 'hot-theme', theme: S.theme, palette: S.palette }, '*');
    }
  }

  function sync() {
    const p = new URLSearchParams();
    if (isIndex) p.set('dir', S.dir);
    for (const k of ['state', 'theme', 'palette', 'view', 'open', 'serif']) p.set(k, S[k]);
    history.replaceState(null, '', `?${p}`);
    for (const a of root.querySelectorAll('a.sh-dir, a.sh-solo')) {
      const file = new URL(a.getAttribute('href'), location.href).pathname.split('/').pop();
      const lp = new URLSearchParams(p);
      if (file === 'index.html') lp.set('dir', S.dir); else lp.delete('dir');
      if (file !== 'direction-c.html' && file !== 'index.html') lp.delete('serif');
      a.href = `${file}?${lp}`;
    }
  }

  root.addEventListener('click', (e) => {
    const dirBtn = e.target.closest('button[data-dir]');
    if (dirBtn) { S.dir = dirBtn.dataset.dir; if (S.dir !== 'c') S.serif = '0'; render(); applyTheme(); sync(); return; }
    const b = e.target.closest('.sh-seg button');
    if (!b) return;
    const k = b.parentElement.dataset.k;
    const v = b.dataset.v;
    if (S[k] === v) return;
    S[k] = v;
    if (k === 'theme' || k === 'palette') {
      applyTheme();
      for (const x of b.parentElement.children) { x.classList.toggle('is-on', x === b); x.setAttribute('aria-pressed', String(x === b)); }
    } else {
      render();
    }
    sync();
  });
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'hot-theme-toggle') {
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      for (const x of root.querySelectorAll('.sh-seg[data-k="theme"] button')) { const on = x.dataset.v === S.theme; x.classList.toggle('is-on', on); x.setAttribute('aria-pressed', String(on)); }
      applyTheme();
      sync();
    }
  });
  window.addEventListener('resize', fit);
  applyTheme();
  render();
  sync();
})();

</script>
</body>
</html>
