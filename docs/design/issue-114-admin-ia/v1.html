<style>/* ══════════════════════════════════════════════════════════════════════
   issue #114 R2 · 本稿新增类
   ops-*  = 实装时会进 index.css 的产品类(运维首页 / 功能页 / 搜功能 / 面包屑)
   spec-* = 样页辅助 chrome(spec 栏、数据来源标注),实装不要
   只用 token,不写 hex;字重 400 / 600;字号 ≥ 12px。
   ══════════════════════════════════════════════════════════════════════ */

/* ── 样页壳:spec 栏占顶,产品整体下移 --spec-h ── */
:root { --spec-h: 0px; }
.app-rail { top: var(--spec-h); }
.spec-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 95;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px;
  min-height: 40px; padding: 6px 16px;
  background: var(--dorami-ink); color: var(--dorami-surface);
  font-size: 12px; font-weight: 400; line-height: 1.2;
}
.spec-title { font-weight: 600; margin-right: 4px; white-space: nowrap; }
.spec-group { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.spec-name { color: color-mix(in oklab, var(--dorami-surface) 72%, transparent); }
.spec-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--dorami-surface) 14%, transparent); }
.spec-btn { min-height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; color: color-mix(in oklab, var(--dorami-surface) 80%, transparent); }
.spec-btn:hover:not(.is-on) { color: var(--dorami-surface); }
.spec-btn.is-on { background: var(--dorami-surface); color: var(--dorami-ink); }
.spec-btn:focus-visible { outline: 2px solid var(--dorami-surface); outline-offset: 1px; }
.spec-hide { margin-left: auto; }
.spec-pill {
  position: fixed; right: 14px; bottom: 14px; z-index: 95;
  min-height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--dorami-ink); color: var(--dorami-surface); font-size: 12px; box-shadow: var(--sh-2);
}
/* 数据来源标注(spec 开关「数据来源 显」) */
.spec-src {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-left: 6px;
  border: 1px dashed currentColor; border-radius: 4px;
  font-size: 12px; font-weight: 400; line-height: 1; white-space: nowrap; vertical-align: middle;
  font-variant-numeric: normal; letter-spacing: 0; cursor: help;
}
.spec-src.is-have { color: var(--state-ok); }
.spec-src.is-agg { color: var(--state-warn); }
.spec-src.is-add { color: var(--state-bad); }
.spec-srcline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.spec-srcline .spec-src { margin-left: 0; }

/* ── 页头:搜功能(常驻) ── */
.ops-search { position: relative; display: inline-flex; align-items: center; }
.ops-search-icon { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--dorami-faint); pointer-events: none; }
.ops-search-input.form-input { width: 216px; padding-left: 30px; padding-right: 44px; }
.ops-kbd {
  position: absolute; right: 8px; display: inline-flex; align-items: center; height: 18px; padding: 0 5px;
  border-radius: 4px; background: var(--dorami-well); color: var(--dorami-faint);
  font-size: 12px; line-height: 1; pointer-events: none;
}
.ops-search.is-open .ops-kbd, .ops-search-input:focus + .ops-kbd { visibility: hidden; }

/* 浮层:搜功能下拉 / 面包屑全部功能页(壳 = ctx-menu 刻度) */
@keyframes ops-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.ops-pop {
  position: absolute; z-index: 70; padding: 4px;
  border-radius: var(--r-card); background: var(--dorami-surface);
  border: 1px solid var(--dorami-border); box-shadow: var(--sh-3);
  font-size: 13px; font-weight: 400;
  animation: ops-pop-in var(--motion-fast) var(--motion-ease);
}
.ops-search-pop { top: calc(100% + 6px); right: 0; width: 320px; max-height: 360px; overflow-y: auto; }
.ops-hit {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 0 10px;
  border-radius: 8px; color: var(--dorami-ink-2); text-align: left; white-space: nowrap;
}
.ops-hit svg { width: 14px; height: 14px; flex: none; color: var(--dorami-faint); }
.ops-hit.is-active { background: var(--dorami-select); color: var(--dorami-ink); }
.ops-hit-name { overflow: hidden; text-overflow: ellipsis; }
.ops-hit-page { color: var(--dorami-faint); font-size: 12px; }
.ops-hit-enter { margin-left: auto; color: var(--dorami-faint); visibility: hidden; }
.ops-hit.is-active .ops-hit-enter { visibility: visible; }
.ops-hit-empty { padding: 8px 10px; color: var(--dorami-faint); font-size: 12px; }

/* ── 页头:面包屑「运维管理 › 播客 ▾」 ── */
.ops-crumb { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; }
.ops-crumb-root { color: var(--dorami-faint); font-weight: 400; border-radius: var(--r-sm); }
.ops-crumb-root:hover { color: var(--dorami-ink-2); }
.ops-crumb-sep { width: 18px; height: 18px; flex: none; color: var(--dorami-faint); }
.ops-crumb-cur {
  display: inline-flex; align-items: center; gap: 4px; margin: -2px -6px; padding: 2px 6px;
  border-radius: var(--r-control); font: inherit; color: var(--dorami-ink);
}
.ops-crumb-cur:hover, .ops-crumb-cur[aria-expanded="true"] { background: var(--dorami-hover); }
.ops-crumb-cur svg { width: 18px; height: 18px; color: var(--dorami-muted); }
.ops-crumb-pop {
  top: calc(100% + 8px); left: 0; display: grid; grid-template-columns: repeat(5, max-content);
  gap: 4px 6px; padding: 10px; letter-spacing: 0; line-height: 1.4;
}
.ops-crumb-col { display: flex; flex-direction: column; gap: 2px; min-width: 132px; }
.ops-crumb-group { padding: 4px 10px 4px; font-size: 12px; font-weight: 600; color: var(--dorami-faint); }
.ops-crumb-item {
  display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px; border-radius: 8px;
  font-size: 13px; font-weight: 400; color: var(--dorami-ink-2); white-space: nowrap;
}
.ops-crumb-item svg { width: 14px; height: 14px; flex: none; color: var(--dorami-faint); }
.ops-crumb-item:hover { background: var(--dorami-hover); color: var(--dorami-ink); }
.ops-crumb-item.is-cur { background: var(--dorami-select); color: var(--dorami-ink); font-weight: 600; }
.ops-crumb-item .ops-crumb-check { margin-left: auto; color: var(--dorami-ink-2); }

/* ── 首页:待处理条(有事才出现,一行) ── */
.ops-pending { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: -6px 0 14px; }
.ops-row-lbl { flex: none; font-size: 12px; font-weight: 600; color: var(--dorami-faint); margin-right: 4px; white-space: nowrap; }
.ops-pending .stamp { cursor: pointer; }
.ops-pending .stamp b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── 首页:总闸一排 ── */
.ops-switches.ai-switchboard { gap: 0; row-gap: 6px; flex-wrap: wrap; padding: 11px 18px; margin-bottom: 14px; justify-content: space-between; }
.ops-switches .ai-divider { height: 20px; margin: 0 4px; }
.ops-sw { display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 6px; border-radius: var(--r-control); white-space: nowrap; }
.ops-sw-name { border-radius: var(--r-sm); }
.ops-sw-name:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--dorami-border-strong); }
.ops-sw.is-link:hover { background: var(--dorami-hover); }
.ops-sw-state { font-size: 12px; color: var(--dorami-faint); }

/* ── 首页:宏观一排(与时间窗联动) ── */
.ops-macro-row { margin-bottom: 16px; }
.ops-macro-line { display: flex; align-items: flex-end; gap: 10px; }
.ops-spark { flex: none; width: 96px; height: 30px; margin-left: auto; overflow: visible; }

/* ── 首页:目录磁贴(5 列 × 2 行,同组同列) ── */
.ops-dir { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: auto auto; gap: 12px; }
.ops-tile { position: relative; display: flex; flex-direction: column; gap: 12px; min-height: clamp(148px, calc((100vh - var(--spec-h) - 480px) / 2), 188px); padding: 15px 16px 14px; border-radius: var(--r-card); transition: background var(--motion-fast) var(--motion-ease); }
.ops-tile:hover { background-image: linear-gradient(var(--dorami-hover), var(--dorami-hover)); }
.ops-tile:has(.ops-tile-name:focus-visible) { box-shadow: var(--sh-2), inset 0 1px 0 var(--dorami-edge), 0 0 0 2px var(--dorami-focus); }
.ops-tile-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ops-tile-icon { width: 16px; height: 16px; flex: none; color: var(--dorami-muted); }
.ops-tile-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
.ops-tile-name::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.ops-tile-group { margin-left: auto; flex: none; font-size: 12px; color: var(--dorami-faint); }
.ops-tile-nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ops-tile-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.ops-tile-lbl { font-size: 12px; line-height: 16px; color: var(--dorami-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ops-tile-num { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; font-size: 20px; font-weight: 600; line-height: 26px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--dorami-ink); white-space: nowrap; }
.ops-tile-num.is-warn { color: var(--state-warn); }
.ops-tile-num.is-bad { color: var(--state-bad); }
.ops-tile-num.is-zero { color: var(--dorami-faint); }
.ops-tile-mark { width: 8px; height: 7px; flex: none; background: currentColor; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.ops-tile-num.is-bad .ops-tile-mark { width: 7px; height: 7px; clip-path: none; transform: rotate(45deg); }
.ops-tile-num .stamp { margin: 2px 0; }
.ops-tile-num:has(.spec-src) { flex-wrap: wrap; white-space: normal; }
.ops-tile-links { position: relative; z-index: 1; margin-top: auto; font-size: 12px; line-height: 18px; color: var(--dorami-faint); }
.ops-tile-li { display: inline-block; white-space: nowrap; }
.ops-tile-li:not(:last-child)::after { content: "·"; margin: 0 6px; color: var(--dorami-faint); }
.ops-tile-link { color: var(--dorami-muted); border-radius: 4px; }
.ops-tile-link:hover { color: var(--dorami-ink); text-decoration: underline; text-underline-offset: 3px; }

/* ── 首页:跨页索引(spec「跨页索引 开」) ── */
.ops-xidx { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.ops-xidx .ai-divider { height: 18px; margin: 0 6px; }
.ops-xidx-item {
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px;
  border-radius: var(--r-control); background: var(--dorami-surface); border: 1px solid var(--dorami-border);
  font-size: 13px; color: var(--dorami-ink-2);
}
.ops-xidx-item svg { width: 14px; height: 14px; color: var(--dorami-faint); }
.ops-xidx-item:hover { background: var(--dorami-hover); color: var(--dorami-ink); }

/* ── 功能页:满幅、板块 = zone 标题 + 细分隔线 ── */
.ops-sec { position: relative; scroll-margin-top: calc(var(--spec-h) + 18px); }
.ops-sec:focus { outline: none; }
.ops-sec > .zone-head { margin: 0 2px 12px; }
.ops-sec + .ops-sec { margin-top: 26px; }
.ops-sec-body { display: grid; gap: 12px; }
.ops-flash::before {
  content: ""; position: absolute; inset: -10px -12px; z-index: -1; border-radius: var(--r-card);
  background: var(--dorami-wash); pointer-events: none;
  animation: ops-flash 1.6s var(--motion-ease) forwards;
}
@keyframes ops-flash { 0%, 35% { opacity: 1; } 100% { opacity: 0; } }
:root[data-motion="reduce"] .ops-flash::before { animation-duration: 1ms; animation-delay: 900ms; }

/* 去卡片:板块之间一条细线,卡片退成平面,表格铺满内容宽 */
.ops-flat .ops-sec + .ops-sec { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--dorami-border); }
.ops-flat .surface-card { background: transparent; box-shadow: none; border-color: transparent; backdrop-filter: none; border-radius: 0; }
.ops-flat .kpi-strip .kpi { padding-top: 4px; padding-bottom: 4px; }
.ops-flat .kpi-strip .kpi:first-child { padding-left: 2px; }
.ops-flat .ai-switchboard { padding: 2px; }
.ops-flat .card-pad { padding: 4px 2px; }
.ops-flat .acct-scroll { margin: 0 -12px; }
.ops-flat .acct-table .acct-th:first-child, .ops-flat .acct-row td:first-child { padding-left: 14px; }
.ops-flat .acct-table .acct-th:last-child, .ops-flat .acct-row td:last-child { padding-right: 14px; }
.ops-flat .acct-row:first-child td { border-top-color: var(--dorami-border); }
.ops-flat .table-foot, .ops-flat .ledger-batchbar, .ops-flat .ops-acct-foot { padding-left: 2px; padding-right: 2px; }
.ops-flat .ops-lofi.is-card { background: var(--dorami-well); }

/* 现行 PodcastZone 的 <strong> 在 600 的 .knob 里按 bolder 落成 900(现网同病,实装顺手修) */
.knob.is-fixed strong { font-weight: 600; }

/* 低保真骨架(静态,不闪烁——它是示意,不是加载态) */
.ops-lofi {
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-card); background: var(--dorami-well);
  color: var(--dorami-faint); font-size: 12px;
}
.ops-lofi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ops-lofi-grid.is-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ops-lofi-row { display: flex; gap: 12px; }
.ops-lofi-row > .ops-lofi { flex: 1; }

/* 功能页图表(样页内联 SVG,实装仍走 recharts) */
.ops-chart { display: block; width: 100%; overflow: visible; }
.ops-chart text { font-size: 12px; fill: var(--dorami-faint); font-variant-numeric: tabular-nums; }
.ops-chart .is-ink { fill: var(--dorami-ink-2); }
.ops-rank { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; align-items: center; gap: 8px 10px; font-size: 12px; }
.ops-rank-name { color: var(--dorami-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.ops-rank-bar { height: 8px; border-radius: 0 3px 3px 0; background: var(--dorami-blue); }
.ops-rank-n { color: var(--dorami-ink-2); font-variant-numeric: tabular-nums; }
.ops-bars { display: grid; gap: 8px; font-size: 12px; }
.ops-bars-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px; align-items: center; gap: 8px; }
.ops-bars-row > span:first-child { color: var(--dorami-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops-bars-n { text-align: right; color: var(--dorami-ink-2); font-variant-numeric: tabular-nums; }

@media (max-width: 1180px) {
  .ops-dir { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: none; }
  .ops-dir .ops-tile { grid-column: auto !important; grid-row: auto !important; }
  .ops-switches.ai-switchboard { flex-wrap: wrap; justify-content: flex-start; row-gap: 6px; }
}
.spec-bar[hidden], .spec-pill[hidden] { display: none; }
</style>
</head>
<body>
<div id="spec" class="spec-bar" role="region" aria-label="样页控制"></div>
<button type="button" id="spec-pill" class="spec-pill" data-act="spec-show" hidden>样页控制</button>
<div class="app-shell font-sans">
  <aside id="rail" class="app-rail hidden lg:flex" aria-label="主导航"></aside>
  <main id="main" class="ml-[var(--rail-w)] px-5 pt-[22px] pb-9 sm:px-7"><div class="page-shell"><div id="view" class="tab-panel"></div></div></main>
</div>
<div id="drawer"></div>
<div id="toast" aria-live="polite"></div>

const TODAY = '2026-11-02';

function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function isoDay(offset) {
  const d = new Date(Date.UTC(2026, 10, 2));
  d.setUTCDate(d.getUTCDate() - offset);
  return d.toISOString().slice(0, 10);
}
function weekday(iso) { return new Date(`${iso}T00:00:00Z`).getUTCDay(); }

const D = (() => {
  const r = mulberry(114);
  const N = 90;
  // 近 90 天逐日(下标 0 = 最早,N-1 = 今天)
  const days = Array.from({ length: N }, (_, i) => isoDay(N - 1 - i));
  const wk = days.map((d) => ([0, 6].includes(weekday(d)) ? 0.55 : 1));
  const today = N - 1;
  const partial = 0.62; // 今天只过了大半天
  const scale = (i) => (i === today ? partial : 1);

  const dau = days.map((_, i) => Math.round((18 + r() * 9) * wk[i] * scale(i)));
  const logins = dau.map((v) => Math.round(v * (1.25 + r() * 0.2)));
  const reads = days.map((_, i) => Math.round((150 + r() * 70) * wk[i] * scale(i)));

  const guestVisitors = days.map((_, i) => Math.round((3 + r() * 6) * (0.8 + 0.2 * wk[i]) * scale(i)));
  const guestVisits = guestVisitors.map((v) => v + Math.round(v * r() * 0.9));
  const guestConv = guestVisitors.map((v) => (r() < 0.16 && v > 3 ? 1 : 0));
  const newAccounts = days.map(() => { const x = r(); return x < 0.05 ? 2 : x < 0.27 ? 1 : 0; });

    const lastDays = weight === 0 ? 40 + Math.floor(r() * 200) : Math.floor(r() * 12);

      subs: Math.floor(4 + r() * 22),
      base: { logins: weight * 14, reads: weight * 90, ai: aiOn ? weight * 40 : 0 },

function acctWindow(row, days) {
  const f = Math.min(1, days / 30) * (days > 30 ? 1 + (days - 30) / 60 : 1);
  return {
    logins: Math.round(row.base.logins * f),
    reads: Math.round(row.base.reads * f),
    ai: Math.round(row.base.ai * f),
  };
}

  theme: Q.get('theme') === 'dark' ? 'dark' : 'light',
  root: Q.get('view') !== 'admin',
  toggle: Q.get('sw') !== 'read',

  pod: { stage: '', verdict: '', tts: '', q: '' },
  drawer: null,
  route: { page: null, block: null },
};
function syncQuery() {
  const q = new URLSearchParams();
  if (S.theme === 'dark') q.set('theme', 'dark');
  if (!S.root) q.set('view', 'admin');
  if (!S.toggle) q.set('sw', 'read');
  if (!S.pending) q.set('pending', '0');
  if (!S.flat) q.set('card', '1');
  if (S.xidx) q.set('xidx', '1');
  if (S.src) q.set('src', '1');
  if (!S.spec) q.set('spec', S.pill ? '0' : 'none');
  const qs = q.toString();
  history.replaceState(null, '', `${location.pathname}${qs ? `?${qs}` : ''}${location.hash}`);
}

let toastTimer = 0;
function toast(msg, type = 'info') {
  const bg = type === 'success' ? 'bg-emerald-600' : 'bg-slate-800 dark:bg-slate-900';
  const ic = type === 'success' ? 'circle-check' : 'info';
  const el = $('#toast');
  el.innerHTML = `<div class="toast-pop fixed left-1/2 z-[200] flex w-max max-w-[90vw] items-center gap-3 rounded-[var(--r-card)] py-3.5 pl-5 pr-3 text-white shadow-2xl ${bg}" role="status">${icon(ic, 'h-5 w-5 shrink-0')}<span class="text-sm font-semibold">${esc(msg)}</span><button type="button" class="shrink-0 rounded-[var(--r-sm)] p-1 text-white/70 transition-colors hover:bg-white/15 hover:text-white" aria-label="关闭" data-act="toast-x">${icon('x', 'h-4 w-4')}</button></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, 2600);
}

/* ══ 迷你走势(内联 SVG) ══ */
function spark(values, { step = false } = {}) {
  const w = 96; const h = 30; const n = values.length;
  const max = Math.max(...values); const min = Math.min(...values);
  const span = max - min || 1;
  const x = (i) => (n === 1 ? w : (i / (n - 1)) * w);
  const y = (v) => h - 2 - ((v - min) / span) * (h - 6);
  let d = '';
  values.forEach((v, i) => {
    if (i === 0) d += `M${x(0).toFixed(1)},${y(v).toFixed(1)}`;
    else if (step) d += `H${x(i).toFixed(1)}V${y(v).toFixed(1)}`;
    else d += `L${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  });
  const last = values[n - 1];
  return `<svg class="ops-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--dorami-blue)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(last).toFixed(1)}" r="2.5" fill="var(--dorami-blue)"/></svg>`;
}
const cumulative = (arr, start) => { let t = start; return arr.map((v) => (t += v)); };

function pendingItems() {

  if (a.backupFailed) items.push(['bad', '备份未完成', '', '#/admin/external/storage', 'backup', '存储与外部资源 › 存储与备份']);
  if (a.podFailed) items.push(['bad', '播客失败', a.podFailed, '#/admin/podcast/tasks', 'podFailed', '播客 › 单集处理(实装带筛选:阶段 = 失败)']);
  if (a.backfillFailed) items.push(['bad', '回填失败', a.backfillFailed, '#/admin/analysis/backfill', 'backfillFailed', '分析与标签 › 完整分析回填(实装带筛选:状态 = 失败)']);
  if (budgetRatio() >= 0.8) items.push(['warn', '读者 AI 预算', pct(budgetRatio()), '#/admin/reader-ai/budget', 'aiBudget', '读者 AI › 日预算']);
  if (a.usrcFailing) items.push(['warn', '自定源失败', a.usrcFailing, '#/admin/user-sources/table', 'usrcFailing', '自定源 › 源表(实装带筛选:状态 = 失败中)']);
  if (a.fbOpen) items.push(['warn', '反馈待处理', a.fbOpen, '#/admin/inbox/feedback', 'fbOpen', '反馈与公告 › 反馈收件箱(实装带筛选:状态 = 待处理)']);
  if (a.candidates) items.push(['warn', '标签候选', a.candidates, '#/admin/analysis/ledger', 'candidates', '分析与标签 › 标签总账(实装带筛选:类型 = 候选)']);
  // 以下三项是现有接口能给出的候选,示意数据下不触发(X API 本月用了 8%、ASR 未冻结、播客存储未进保护)
  const xr = D.xapi.cost / D.xapi.budget;
  if (xr >= 0.8) items.push(['warn', 'X API 预算', pct(xr), '#/admin/external/xapi', 'xCost', '存储与外部资源 › X API']);
  if (D.podcast.asrFrozen) items.push(['warn', 'ASR 配额冻结', '', '#/admin/podcast/asr', 'asrFrozen', '播客 › ASR 配额']);
  if (D.podcast.pressure) items.push(['bad', '播客存储保护', '', '#/admin/podcast/kpi', 'podPressure', '播客 › 概览']);
  return items;
}

function macroCells() {

}

/* ══ 账户(高保真) ══ */
function acctList() {
  const A2 = S.acct;
  let rows = ACCOUNT_ROWS.map((r) => ({ ...r, w: acctWindow(r, S.days) }));
  if (A2.q) rows = rows.filter((r) => r.username.includes(A2.q));
  if (A2.role) rows = rows.filter((r) => r.role === A2.role);
  if (A2.status) rows = rows.filter((r) => (A2.status === 'active' ? r.active : !r.active));
  if (A2.ai) rows = rows.filter((r) => (A2.ai === 'on' ? r.ai : !r.ai));
  const key = { username: (r) => r.username, last_login: (r) => r.last || '', logins: (r) => r.w.logins, reads: (r) => r.w.reads, ai_calls: (r) => r.w.ai, subscriptions: (r) => r.subs }[A2.sort];
  rows.sort((x, y) => { const a = key(x); const b = key(y); const c = a < b ? -1 : a > b ? 1 : 0; return A2.order === 'asc' ? c : -c; });
  return rows;
}
const stamp2 = (iso) => { if (!iso) return '—'; const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const hue = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

function growthChart(width) {
  const d = S.days;
  const sr = D.lastN(D.series.newAccounts, d);
  const days = D.lastN(D.days, d);
  const start = D.accounts.total - sr.reduce((a, b) => a + b, 0);
  const tot = cumulative(sr, start);
  const H = 200; const L = 44; const R = 24; const T = 22; const B = 24;
  const w = Math.max(320, width); const iw = w - L - R; const ih = H - T - B;
  const lo = start - 1; const hi = tot[tot.length - 1] + 1;
  const X = (i) => L + ((i + 1) / d) * iw; const Y = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
  let path = `M${L},${Y(start)}`; tot.forEach((v, i) => { path += `H${X(i).toFixed(1)}V${Y(v).toFixed(1)}`; });
  const grid = [lo, Math.round((lo + hi) / 2), hi].map((v) => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--dorami-border)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const dots = tot.map((v, i) => (sr[i] ? `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--dorami-surface)" stroke="var(--dorami-blue)" stroke-width="1.6"/><text class="is-ink" x="${X(i) + 7}" y="${Y(v) - 8}">+${sr[i]}</text>` : '')).join('');
  const ticks = [0, Math.floor(d / 2), d - 1].map((i) => `<text x="${X(i)}" y="${H - 4}" text-anchor="middle">${days[i].slice(5).replace(/^0/, '').replace('-0', '-')}</text>`).join('');
  return `<svg class="ops-chart" width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" aria-label="账户增长">${grid}<path d="${path}" fill="none" stroke="var(--dorami-blue)" stroke-width="1.6"/>${dots}${ticks}</svg>`;
}
function guestChart(width) {
  const d = S.days;
  const v = D.lastN(D.series.guestVisitors, d); const c = D.lastN(D.series.guestConv, d); const days = D.lastN(D.days, d);
  const H = 200; const L = 40; const R = 16; const T = 16; const B = 24;
  const w = Math.max(320, width); const iw = w - L - R; const ih = H - T - B;
  const max = Math.max(4, Math.max(...v) + 1);
  const bw = Math.min(14, (iw / d) * 0.7);
  const X = (i) => L + (i + 0.5) * (iw / d); const Y = (n) => T + ih - (n / max) * ih;
  const grid = [0, Math.round(max / 2), max].map((n) => `<line x1="${L}" x2="${w - R}" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--dorami-border)"/><text x="${L - 8}" y="${Y(n) + 4}" text-anchor="end">${n}</text>`).join('');
  const bars = v.map((n, i) => `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${Y(n).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ih - Y(n)).toFixed(1)}" rx="2" fill="var(--dorami-blue)"/>`).join('');
  const dots = c.map((n, i) => (n ? `<circle cx="${X(i)}" cy="${Y(v[i]) - 9}" r="4.5" fill="var(--state-ok)" stroke="var(--dorami-surface)" stroke-width="2"/>` : '')).join('');
  const ticks = [0, Math.floor(d / 2), d - 1].map((i) => `<text x="${X(i)}" y="${H - 4}" text-anchor="middle">${days[i].slice(5).replace(/^0/, '').replace('-0', '-')}</text>`).join('');
  return `<svg class="ops-chart" width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" aria-label="游客走势">${grid}${bars}${dots}${ticks}</svg>`;
}

      <span class="drawer-acts">
        <button type="button" class="rowact-btn ${u.ai ? 'is-on' : ''}" title="${u.ai ? '关闭' : '开启'} ${u.username} 的 AI">${icon(u.ai ? 'zap' : 'zap-off')}</button>
        <button type="button" class="rowact-btn" title="将 ${u.username} 设为管理员">${icon(u.role === 'admin' ? 'shield-off' : 'shield-check')}</button>
        <button type="button" class="rowact-btn" title="重置密码">${icon('key-round')}</button>
        <button type="button" class="rowact-btn" title="${u.active ? '停用账户' : '启用账户'}">${icon(u.active ? 'ban' : 'power')}</button>
        <button type="button" class="rowact-btn is-danger" title="删除账户">${icon('trash-2')}</button>
        <span class="ai-divider"></span>
      </span>
      <button type="button" class="icon-button shrink-0" data-act="drawer-x" aria-label="关闭详情">${icon('x', 'h-5 w-5')}</button>
    </div>
    <div class="ledger-drawer-body">
      <div class="tiles"><div class="tile"><div class="tile-num">${fmt(w.reads)}</div><div class="tile-lbl">近 ${S.days} 天阅读</div></div><div class="tile"><div class="tile-num">${fmt(w.ai)}</div><div class="tile-lbl">近 ${S.days} 天 AI 调用</div></div><div class="tile"><div class="tile-num">${u.subs}</div><div class="tile-lbl">订阅来源</div></div></div>
      <div class="login-card"><div style="display:flex; align-items:baseline; gap:8px"><span class="tile-num" style="font-size:18px; line-height:22px">${fmt(w.logins)}</span><span class="tile-lbl" style="align-self:center">近 ${S.days} 天登录 · 最近 ${stamp2(u.last)}</span></div></div>
      <div><div class="drawer-sec-title">各源 · 文章阅读 / 文章收藏 · ${srcs.length} 个源</div>
        <div class="ops-bars">${srcs.map((s) => `<div class="ops-bars-row"><span>${s.n}<span class="ops-rank-bar" style="display:block; height:4px; margin-top:4px; width:${(s.r / maxR) * 100}%"></span></span><span class="ops-bars-n">${s.r}</span><span class="ops-bars-n">${s.f}</span></div>`).join('')}</div>
      </div>
    </div>
  </aside>`;
  document.body.style.overflow = 'hidden';
}

/* ══ 低保真功能页 ══ */
function lofi(h, label, cls = '') { return `<div class="ops-lofi ${cls}" style="height:${h}px">${esc(label)}</div>`; }
function renderLofi(p) {
  const out = [];
  const blocks = visibleBlocks(p);
  for (let i = 0; i < blocks.length; i += 1) {
    const b = blocks[i]; const next = blocks[i + 1];
    const title = b.name;
    if (b.kind === 'chart2' && next?.kind === 'merged') {
      out.push(`<section class="ops-sec" id="blk-${b.id}" data-block="${b.id}" tabindex="-1"><div class="zone-head"><span class="zone-title">${esc(title)}</span></div>
        <div class="ops-lofi-grid">${lofi(b.h, `${b.name} · 图`)}<div class="ops-sec" id="blk-${next.id}" data-block="${next.id}" tabindex="-1">${lofi(b.h, `${next.name} · 榜`)}</div></div></section>`);
      i += 1; continue;
    }
    if (b.kind === 'switch' && next?.kind === 'merged') {
      out.push(`<section class="ops-sec" id="blk-${b.id}" data-block="${b.id}" tabindex="-1"><div class="zone-head"><span class="zone-title">${esc(title)}</span></div>
        <div class="ops-lofi-row">${lofi(b.h, `${b.name} · 开关 · 模型 chip`)}<div class="ops-sec" style="flex:0 0 34%" id="blk-${next.id}" data-block="${next.id}" tabindex="-1">${lofi(b.h, `${next.name} · 输入 + 今日已用`)}</div></div></section>`);
      i += 1; continue;
    }
    const body = b.kind === 'chart2' ? `<div class="ops-lofi-grid">${lofi(b.h, `${b.name} · 图`)}${lofi(b.h, `${b.name} · 图`)}</div>`
      : b.kind === 'cards3' ? `<div class="ops-lofi-grid is-3">${lofi(b.h / 2 - 6, '旋钮卡')}${lofi(b.h / 2 - 6, '旋钮卡')}${lofi(b.h / 2 - 6, '旋钮卡')}${lofi(b.h / 2 - 6, '旋钮卡')}${lofi(b.h / 2 - 6, '旋钮卡')}${lofi(b.h / 2 - 6, '旋钮卡')}</div>`
        : b.kind === 'kpi+chart' ? `${lofi(92, 'KPI 条 · 5 格')}${lofi(b.h - 104, '新闻价值分布')}`
          : lofi(b.h, { switch: '开关条', kpi: 'KPI 条', table: '表格 · 列头即操作 · 分页', card: '状态卡', chart: '图' }[b.kind] || b.name);
    out.push(`<section class="ops-sec" id="blk-${b.id}" data-block="${b.id}" tabindex="-1"><div class="zone-head"><span class="zone-title">${esc(title)}</span></div><div class="ops-sec-body">${body}</div></section>`);
  }
  return `<div class="admin-page ops-page ${S.flat ? 'ops-flat' : ''}">${crumbHead(p)}${out.join('')}</div>`;
}

/* ══ 路由 ══ */
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] !== 'admin') return null;
  const page = PAGE[parts[1]] ? parts[1] : null;
  const block = page && parts[2] ? parts[2] : null;
  return { page, block };
}
function render({ keepScroll = false } = {}) {
  const r = parseHash();
  if (!r) { history.replaceState(null, '', `${location.pathname}${location.search}#/admin`); return render(); }
  S.route = r;
  const y = window.scrollY;
  const p = r.page && PAGE[r.page];
  $('#view').innerHTML = !p ? renderHome() : p.id === 'podcast' ? renderPodcast() : p.id === 'accounts' ? renderAccounts() : renderLofi(p);
  document.title = p ? `${p.name} · 运维管理` : '运维管理';
  drawCharts();
  renderDrawer();
  if (keepScroll) window.scrollTo(0, y);
  return r;
}
function drawCharts() {
  $$('[data-chart]').forEach((el) => {
    const w = el.clientWidth;
    el.innerHTML = el.dataset.chart === 'growth' ? growthChart(w) : guestChart(w);
  });
}
function land(block) {
  const el = block && $(`[data-block="${CSS.escape(block)}"]`);
  if (!el) { window.scrollTo(0, 0); return; }
  el.scrollIntoView({ block: 'start' });
  el.classList.remove('ops-flash');
  void el.offsetWidth;
  el.classList.add('ops-flash');
  el.focus({ preventScroll: true });
  setTimeout(() => el.classList.remove('ops-flash'), 1700);
}
function go(hash) {
  closePops();
  if (location.hash === hash) { const r = render({ keepScroll: true }); land(r.block); return; }
  location.hash = hash;
}
window.addEventListener('hashchange', () => { S.drawer = null; closePops(); const r = render(); land(r.block); });

/* ══ 搜功能 ══ */
function searchIndex() {
  const out = [];
  PAGES.forEach((p) => {
    out.push({ name: p.name, page: p, hash: `#/admin/${p.id}`, syn: [], icon: p.icon });
    visibleBlocks(p).forEach((b) => out.push({ name: b.name, page: p, hash: `#/admin/${p.id}/${b.id}`, syn: b.syn || [], icon: p.icon }));
  });
  if (S.xidx) XIDX.forEach((x) => out.push({ name: x.name, kind: x.kind, syn: x.syn, icon: x.icon, xidx: true }));
  return out;
}
function searchHits(q) {
  const k = q.trim().toLowerCase();
  if (!k) return [];
  const scored = [];
  searchIndex().forEach((e, order) => {
    const n = e.name.toLowerCase();
    let s = n.startsWith(k) ? 0 : n.includes(k) ? 1 : 9;
    if (s === 9) e.syn.forEach((x) => { const y = x.toLowerCase(); if (y === k) s = Math.min(s, 2); else if (y.includes(k)) s = Math.min(s, 3); });
    if (s === 9 && !e.xidx && e.page.name.toLowerCase().includes(k)) s = 4;
    if (s < 9) scored.push([s, order, e]);
  });
  return scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, 8).map((x) => x[2]);
}
let SR = { hits: [], idx: 0, wrap: null };
function openSearch(wrap) {
  const input = $('input', wrap);
  SR = { hits: searchHits(input.value), idx: 0, wrap };
  $('.ops-search-pop', wrap)?.remove();
  wrap.classList.toggle('is-open', Boolean(input.value.trim()));
  input.setAttribute('aria-expanded', String(Boolean(input.value.trim())));
  if (!input.value.trim()) return;
  const pop = document.createElement('div');
  pop.className = 'ops-pop ops-search-pop';
  pop.id = 'ops-hits';
  pop.setAttribute('role', 'listbox');
  pop.innerHTML = SR.hits.length
    ? SR.hits.map((h, i) => `<button type="button" role="option" class="ops-hit ${i === SR.idx ? 'is-active' : ''}" data-hit="${i}" aria-selected="${i === SR.idx}">${icon(h.icon)}<span class="ops-hit-name">${esc(h.name)}</span><span class="ops-hit-page">· ${esc(h.xidx ? h.kind : h.page.name)}</span>${icon('corner-down-left', 'ops-hit-enter')}</button>`).join('')
    : '<div class="ops-hit-empty">没有匹配的功能</div>';
  wrap.appendChild(pop);
}
function moveHit(delta) {
  if (!SR.hits.length) return;
  SR.idx = (SR.idx + delta + SR.hits.length) % SR.hits.length;
  $$('.ops-hit', SR.wrap).forEach((b, i) => { b.classList.toggle('is-active', i === SR.idx); b.setAttribute('aria-selected', String(i === SR.idx)); });
}
function pickHit(i) {
  const h = SR.hits[i];
  if (!h) return;
  const input = SR.wrap && $('input', SR.wrap);
  if (input) { input.value = ''; input.blur(); }
  closePops();
  if (h.xidx) { toast(`样页未收录:实装时打开 ${h.kind === '设置' ? '设置 › ' : ''}${h.name}`); return; }
  go(h.hash);
}
function closePops() {
  $$('.ops-search-pop').forEach((p) => p.remove());
  $$('.ops-search').forEach((w) => w.classList.remove('is-open'));
  $$('.ops-crumb-pop').forEach((p) => p.remove());
  $$('.ops-crumb-cur').forEach((b) => b.setAttribute('aria-expanded', 'false'));
}

/* ══ 事件 ══ */
document.addEventListener('input', (e) => {
  const wrap = e.target.closest('[data-search]');
  if (wrap) openSearch(wrap);
});
document.addEventListener('keydown', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-search]');
  if (wrap) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveHit(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveHit(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); pickHit(SR.idx); return; }
    if (e.key === 'Escape') { e.target.value = ''; closePops(); e.target.blur(); return; }
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('.ops-search-input')?.focus(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); $('.ops-search-input')?.focus(); return; }
  if (e.key === 'Escape') {
    if (S.drawer) { S.drawer = null; renderDrawer(); $$('.acct-row.is-sel').forEach((r) => r.classList.remove('is-sel')); return; }
    closePops();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.acct-row[data-user]')) { e.preventDefault(); openUser(e.target.dataset.user); }
});
document.addEventListener('focusout', (e) => {
  const wrap = e.target.closest && e.target.closest('[data-search]');
  if (wrap) setTimeout(() => { if (!wrap.contains(document.activeElement)) { $('.ops-search-pop', wrap)?.remove(); wrap.classList.remove('is-open'); } }, 120);
});
document.addEventListener('mousedown', (e) => { if (e.target.closest('.ops-search-pop')) e.preventDefault(); });
document.addEventListener('mouseover', (e) => {
  const h = e.target.closest('.ops-hit');
  if (h && SR.wrap?.contains(h)) { SR.idx = Number(h.dataset.hit); moveHit(0); }
});
function openUser(name) {
  S.drawer = name;
  $$('.acct-row').forEach((r) => r.classList.toggle('is-sel', r.dataset.user === name));
  renderDrawer();
}
function rerender() { render({ keepScroll: true }); }

document.addEventListener('click', (e) => {
  const t = e.target;
  const hit = t.closest('.ops-hit');
  if (hit) { pickHit(Number(hit.dataset.hit)); return; }
  if (!t.closest('.ops-crumb-pop') && !t.closest('[data-act="crumb"]')) $$('.ops-crumb-pop').forEach((p) => { p.remove(); $$('.ops-crumb-cur').forEach((b) => b.setAttribute('aria-expanded', 'false')); });
  const spec = t.closest('[data-spec]');
  if (spec) {
    const { spec: k, v } = spec.dataset;
    if (k === 'theme') { S.theme = v; document.documentElement.dataset.theme = v; renderRail(); }
    if (k === 'root') { S.root = v === '1'; S.drawer = null; S.acct.sel.clear(); renderRail(); }
    if (k === 'toggle') S.toggle = v === '1';
    if (k === 'pending') S.pending = v === '1';
    if (k === 'flat') S.flat = v === '1';
    if (k === 'xidx') S.xidx = v === '1';
    if (k === 'src') S.src = v === '1';
    syncQuery(); renderSpec(); rerender(); return;
  }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'spec-hide') { S.spec = false; syncQuery(); renderSpec(); return; }
  if (act === 'spec-show') { S.spec = true; S.pill = true; syncQuery(); renderSpec(); return; }
  if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; syncQuery(); renderSpec(); renderRail(); drawCharts(); return; }
  if (act === 'toast-x') { $('#toast').innerHTML = ''; return; }
  if (act === 'drawer-x') { S.drawer = null; renderDrawer(); $$('.acct-row.is-sel').forEach((r) => r.classList.remove('is-sel')); return; }
  if (act === 'sel-clear') { S.acct.sel.clear(); rerender(); return; }
  if (act === 'crumb') {
    const btn = t.closest('[data-act="crumb"]');
    const h1 = btn.closest('.ops-crumb');
    const open = $('.ops-crumb-pop', h1);
    if (open) { open.remove(); btn.setAttribute('aria-expanded', 'false'); return; }
    h1.insertAdjacentHTML('beforeend', crumbPop(S.route.page));
    btn.setAttribute('aria-expanded', 'true');
    return;
  }
  if (act === 'th-search') { toast('样页:实装为就地展开搜索(ThSearch)'); return; }
  const goEl = t.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const a = t.closest('a[href^="#/admin"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); return; }
  const toastEl = t.closest('[data-toast]');
  if (toastEl) { e.preventDefault(); toast(toastEl.dataset.toast); return; }
  const x = t.closest('[data-xidx]');
  if (x) { const it = XIDX.find((i) => i.name === x.dataset.xidx); toast(`样页未收录:实装时打开 ${it.kind === '设置' ? '设置 › ' : ''}${it.name}`); return; }
  const sw = t.closest('[data-sw]');
  if (sw) {
    const k = sw.dataset.sw; S.sw[k] = !S.sw[k];
    const msg = SWITCHES.find((s) => s[0] === k)[4][S.sw[k] ? 0 : 1];
    toast(msg, 'success'); rerender(); return;
  }
  const days = t.closest('[data-days]');
  if (days) { S.days = Number(days.dataset.days); S.acct.page = 1; rerender(); return; }
  const top = t.closest('[data-top]');
  if (top) { S.acct.top = top.dataset.top; rerender(); return; }
  const ps = t.closest('[data-podstage]');
  if (ps) { S.pod.stage = S.pod.stage === ps.dataset.podstage ? '' : ps.dataset.podstage; rerender(); if (ps.closest('.kpi')) land('tasks'); return; }
  const flt = t.closest('[data-filter]');
  if (flt) {
    const k = flt.dataset.filter;
    const cyc = { role: ['', 'admin', 'user'], status: ['', 'active', 'disabled'], ai: ['', 'on', 'off'], podstage: ['', 'not_processed', 'not_selected', 'awaiting_transcript', 'processing', 'full_analyzed', 'reconciliation', 'retry_wait', 'failed'] }[k];
    if (!cyc) { toast('样页:列头轮换筛选只接了「阶段」'); return; }
    if (k === 'podstage') { S.pod.stage = cyc[(cyc.indexOf(S.pod.stage) + 1) % cyc.length]; } else { S.acct[k] = cyc[(cyc.indexOf(S.acct[k]) + 1) % cyc.length]; S.acct.page = 1; S.acct.sel.clear(); }
    rerender(); return;
  }
  const fs = t.closest('[data-filterset]');
  if (fs) { const [k, v] = fs.dataset.filterset.split(':'); S.acct[k] = S.acct[k] === v ? '' : v; S.acct.page = 1; rerender(); land('table'); return; }
  const so = t.closest('[data-sort]');
  if (so && S.route.page === 'accounts') {
    const k = so.dataset.sort;
    if (S.acct.sort === k) S.acct.order = S.acct.order === 'asc' ? 'desc' : 'asc'; else { S.acct.sort = k; S.acct.order = k === 'username' ? 'asc' : 'desc'; }
    S.acct.page = 1; rerender(); return;
  }
  const pg = t.closest('[data-pg]');
  if (pg && S.route.page === 'accounts') { S.acct.page = Number(pg.dataset.pg); rerender(); return; }
  const selall = t.closest('[data-selall]');
  if (selall) { const rows = $$('[data-sel]').map((c) => c.dataset.sel); const all = rows.every((n) => S.acct.sel.has(n)); rows.forEach((n) => (all ? S.acct.sel.delete(n) : S.acct.sel.add(n))); rerender(); return; }
  const sel = t.closest('[data-sel]');
  if (sel) { const n = sel.dataset.sel; if (S.acct.sel.has(n)) S.acct.sel.delete(n); else S.acct.sel.add(n); rerender(); return; }
  if (t.closest('[data-stop]')) return;
  const ur = t.closest('tr[data-user]');
  if (ur) { openUser(ur.dataset.user); return; }
  const ep = t.closest('tr[data-ep]');
  if (ep && !t.closest('.rowacts')) { toast('样页:实装打开单集抽屉(处理时间线 / 文本 / 音频)'); }
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { drawCharts(); renderSpec(); }); });

/* ══ 启动 ══ */
document.documentElement.dataset.theme = S.theme;
renderSpec();
renderRail();
const first = render();
land(first.block);

</script>
</body>
