/* ══ 首页 ══ */
function pendingItems() {
  const a = A();
  const items = [];
  if (a.backupFailed) items.push(['bad', '备份未完成', '', '#/admin/external/storage', 'pBackup', 'external']);
  if (a.podFailed) items.push(['bad', '播客失败', a.podFailed, '#/admin/podcast/tasks', 'pPodFailed', 'podcast', 'failed']);
  if (a.backfillFailed) items.push(['bad', '回填失败', a.backfillFailed, '#/admin/analysis/backfill', 'pBackfill', 'analysis']);
  if (budgetRatio() >= 0.8) items.push(['warn', '读者 AI 预算', pct(budgetRatio()), '#/admin/reader/budget', 'pBudget', 'reader']);
  if (a.usrcFailing) items.push(['warn', '自定源失败', a.usrcFailing, '#/admin/user-sources/table', 'pUsrc', 'user-sources']);
  if (a.fbOpen) items.push(['warn', '反馈待处理', a.fbOpen, '#/admin/inbox/feedback', 'pFeedback', 'inbox']);
  if (a.candidates) items.push(['warn', '标签候选', a.candidates, '#/admin/analysis/ledger', 'pCandidates', 'analysis']);
  // 以下三项是现有接口能给出的候选,示意数据下不触发(X API 本月用了 8%、ASR 未冻结、播客存储未进保护)
  const xr = D.xapi.cost / D.xapi.budget;
  if (xr >= 0.8) items.push(['warn', 'X API 预算', pct(xr), '#/admin/external/xapi', 'pXapi', 'external']);
  if (D.podcast.asrFrozen) items.push(['warn', 'ASR 配额冻结', '', '#/admin/podcast/asr', 'pAsr', 'podcast']);
  if (D.podcast.pressure) items.push(['bad', '播客存储保护', '', '#/admin/podcast/kpi', 'pPressure', 'podcast']);
  return items;
}

  return `<span class="ops-tile-dot" title="有待处理:${esc(hits.map((x) => x[1]).join('、'))}" aria-label="有待处理"><i class="ops-mark ${bad ? 'is-bad' : ''}"></i></span>`;

}
const chartBox = (name, go, s = '', cls = '') => `<div class="ops-tile-chart${cls ? ` ${cls}` : ''}" data-chart="${name}" ${go ? `data-go="${go}" title="打开完整图表"` : ''}>${s ? src(s, 'is-pin') : ''}</div>`;

/* L · 账户:主角 = 近 N 天活跃账户(根)/ 账户总数(非根);次级 账户 · 新增 · 游客访客;图 = 逐日活跃账户离散柱(需聚合;无聚合端点退回增长阶梯线) */

    : hoverRows('heroAcct', { head: '账户', items: [{ name: '管理员', value: D.accounts.admins, s: 'growthTotals' }, { name: '停用', value: D.accounts.disabled, s: 'growthTotals' }] });

    : [num(`+${g.added}`, '新增', { s: 'growthSeries', roll: ['acctNew', g.added, 'plus'] }), num(fmt(D.accounts.readers), '读者', { s: 'growthTotals' }), num(fmt(gw.uniq), '游客访客', { s: 'guestKpi', roll: ['guest', gw.uniq] })];

function stageParts(withFailed = true, quiet = false) {

    { key: 'new', name: '未初评', value: s.not_processed, color: quiet ? 'color-mix(in oklab, var(--dorami-ink) 7%, var(--dorami-card-solid))' : 'var(--dorami-border-strong)', ink: 'var(--dorami-ink-2)' },
    ...(withFailed ? [{ key: 'failed', name: '失败', value: failed, color: 'var(--state-bad)' }] : []),

/* 状态:页头右侧待处理计数;列表按严重度;底部 8 个开关点(关着的常显名称;只读,点击跳所在板块) */

function sec(block, inner, { title, span = 12, rows = 0, hint = '', acts = '', stamps = '', ttl = '', fill = false } = {}) {

}
const hero = (lbl, num, { sub = '', lg = false, unit = '', cls = '', s = '', s2 = '' } = {}) => `<div class="ops-hero"><span class="ops-hero-lbl">${lbl}</span><span class="ops-hero-num${lg ? ' is-lg' : ''}${cls ? ` ${cls}` : ''}">${num}${unit ? `<small>${unit}</small>` : ''}${src(s)}</span>${sub ? `<span class="ops-hero-sub">${sub}${src(s2)}</span>` : ''}</div>`;
const legend = (items) => `<div class="ops-legend">${items.map(([name, color, num]) => `<span class="ops-lg">${color === 'mark' ? '<i class="ops-mark is-bad"></i>' : `<i style="background:${color}"></i>`}${esc(name)}${num != null ? ` <b>${fmt(num)}</b>` : ''}</span>`).join('')}</div>`;
const kpi = (num, lbl, sub = '', { tone = '', ttl = '' } = {}) => `<div class="kpi"${ttl ? ` title="${esc(ttl)}"` : ''}><span class="kpi-num${tone ? ` ${tone}` : ''}">${num}</span><span class="kpi-lbl">${lbl}</span>${sub !== '' ? `<span class="kpi-sub">${sub}</span>` : ''}</div>`;
function pager(page, pages) {
  const nums = pages <= 7 ? Array.from({ length: pages }, (_, i) => i + 1) : [1, 2, 3, '…', pages - 1, pages];
  return `<div class="pager">${nums.map((n) => (n === '…' ? '<span class="pager-ellipsis">…</span>' : `<button type="button" class="pager-btn ${n === page ? 'is-on' : ''}" data-pg="${n}">${n}</button>`)).join('')}</div>`;
}
const thSort = (label, k, cur, order, w, num = false) => `<th class="acct-th ${num ? 'is-num' : ''} ${cur === k ? 'is-sorted' : ''}" style="width:${w}${typeof w === 'number' ? 'px' : ''}" ${cur === k ? `aria-sort="${order === 'asc' ? 'ascending' : 'descending'}"` : ''}><button type="button" class="acct-sortbtn" data-sort="${k}" title="按${label}排序">${label}<span class="acct-sort-arrow" aria-hidden="true">${cur === k ? (order === 'asc' ? '▲' : '▼') : ''}</span></button></th>`;
function thFilter(label, key, value, options, w) {
  const idx = Math.max(0, options.findIndex(([v]) => v === value));
  const widest = [label, ...options.slice(1).map(([, l]) => l)].reduce((a, b) => (b.length > a.length ? b : a));
  const cycle = [label, ...options.slice(1).map(([, l]) => l)].join(' → ');
  return `<th class="acct-th ${value ? 'is-filtered' : ''}" style="width:${w}px"><button type="button" class="acct-sortbtn" data-widest="${widest}" data-filter="${key}" title="点击轮换筛选：${cycle}">${value ? options[idx][1] : label}</button></th>`;
}
const thSearch = (label, w, placeholder) => `<th class="acct-th" style="width:${w}"><button type="button" class="acct-sortbtn" title="${placeholder}" data-act="th-search">${label}${icon('search', 'h-2.5 w-2.5')}</button></th>`;
const card = (cls, inner, label = '') => `<section class="surface-card ${cls}"${label ? ` aria-label="${esc(label)}"` : ''}>${inner}</section>`;
const pageWrap = (p, inner, extra = '') => `<div class="admin-page ops-page ops-flat">${crumbHead(p, extra)}<div class="ops-grid">${inner}</div></div>`;

/* ══ 读者功能(高保真;Langfuse 次序:汇总 → 趋势 → 构成,其下开关与默认;v3 只去搜索框 + 删残留解释短语) ══ */
function renderReader() {
  const d = S.days; const aw = aiWin(d);
  const metric = S.reader.metric; const dim = S.root ? S.reader.dim : 'purpose';
  const ser = aiSeries(aw, metric, dim);
  const total = metric === 'calls' ? aw.totalCalls : aw.totalTokens;
  const unit = metric === 'calls' ? '次' : 'tokens';
  const seg = (key, opts, cur) => `<span class="mini-seg" role="group" aria-label="${key === 'rm' ? '指标' : '维度'}">${opts.map(([v, l]) => `<button type="button" class="mini-seg-btn ${cur === v ? 'is-on' : ''}" aria-pressed="${cur === v}" data-${key}="${v}">${l}</button>`).join('')}</span>`;
  const acts = `<span class="flex items-center gap-2">${seg('rm', [['calls', '调用'], ['tokens', 'tokens']], metric)}${S.root ? seg('rd', [['purpose', '按用途'], ['user', '按用户']], dim) : ''}</span>`;
  const usage = card('card-pad rounded-[var(--r-card)] ops-hero-card', `
    <div class="ops-ch-head">${hero(`近 ${d} 天${metric === 'calls' ? '总调用' : '总 tokens'}`, metric === 'calls' ? fmt(total) : fmtK(total), { lg: true, unit })}${legend(ser.keys.map((k, j) => [k, ser.colors[j]]))}</div>
    <div class="ops-chart-box is-static" data-chart="aiPage" style="flex:1; min-height:240px"></div>`, '每日用量');
  const ratio = budgetRatio();
  const kcol = card('ops-kcol', `
    ${kpi(fmt(aw.readerCalls), '读者用途调用', `占 ${pct(aw.readerCalls / aw.totalCalls)} · tokens ${fmtK(aw.readerTokens)}`, { ttl: '翻译 / 问答 / 速读 / 点播(计入读者日预算的用途)' })}
    ${kpi(fmtK(aw.prompt), '输入 tokens')}
    ${kpi(fmtK(aw.completion), '输出 tokens')}
    <div class="kpi" title="今日读者用途全账户合计 / 读者面日预算;超限当日全员暂停,次日自动恢复"><span class="kpi-lbl">今日读者预算</span><div class="ops-kpi-ring">${ring(ratio, { size: 56, tone: ratio >= 0.8 ? 'warn' : '' })}<div><span class="kpi-num${ratio >= 0.8 ? ' is-warn' : ''}">${pct(ratio)}</span><span class="kpi-sub">${fmt(A().aiUsed)} / ${fmt(D.readerAi.budget)}</span></div></div></div>`, 'AI 用量汇总');
  const M = metric === 'calls' ? aw.calls : aw.tokens;
  const pTotals = AI_PURPOSES.map((p, j) => [p.name, sum(M.map((r) => r[j]))]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

    ['share', `<span class="ai-light ${S.sw.share ? '' : 'is-off'}" aria-hidden="true"></span><span class="ai-switch-lbl" title="总闸:关闭后已发出的公开链接立即失效,签发记录保留,重新开启即回归。读者可为单篇内容生成免登录只读链接,可设有效期并随时撤销">公开分享</span><span class="ops-swcell-end"><span class="tiny-meta">有效 ${D.share.live} · 累计 ${D.share.total}</span>${swBtn('share', '公开分享链接总闸')}</span>`],

  const defaults = card('card-pad rounded-[var(--r-card)]', `<div class="ops-chiplist">${D.defaults.map((n) => `<div class="ops-chiprow"><span class="interest-chip-dot" aria-hidden="true"></span><span>${esc(n)}</span><button type="button" class="rowact-btn" title="移出 ${esc(n)}" aria-label="移出 ${esc(n)}" data-toast="样页:实装立即保存">${icon('x')}</button></div>`).join('')}</div>

/* ══ 账户(高保真;v3:主角区 = 横排 KPI 在主图上方,与首页 L 磁贴同构;游客 × 活跃 Top 并排;表铺满) ══ */
function acctList() {
  const A2 = S.acct;
  let rows = ACCOUNT_ROWS.map((r) => ({ ...r, w: acctWindow(r, S.days) }));
  if (A2.q) rows = rows.filter((r) => r.username.includes(A2.q));
  if (A2.role) rows = rows.filter((r) => r.role === A2.role);
  if (A2.status) rows = rows.filter((r) => (A2.status === 'active' ? r.active : !r.active));
  if (A2.ai) rows = rows.filter((r) => (A2.ai === 'on' ? r.ai : !r.ai));
  const key = { username: (r) => r.username, last_login: (r) => r.last || '', logins: (r) => r.w.logins, reads: (r) => r.w.reads, ai_calls: (r) => r.w.ai, subscriptions: (r) => r.subs }[A2.sort];
  rows.sort((x, y) => { const a = key(x); const b = key(y); const c = a < b ? -1 : a > b ? 1 : 0; return A2.order === 'asc' ? c : -c; });
  return rows;
}
const stamp2 = (iso) => { if (!iso) return '—'; const d = new Date(iso); const p = (n) => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const hue = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

        <div class="guest-legend">${ent.map(([l, c, p]) => `<span><i style="background:${c}"></i>${l} ${Math.round(p * 100)}%</span>`).join('')}</div>

const STAGE_META = { not_processed: ['未初评', 'idle'], not_selected: ['未入选', 'idle'], awaiting_transcript: ['待全文', 'idle'], processing: ['处理中', 'run'], full_analyzed: ['全文完成', 'ok'], reconciliation: ['待对账', 'warn'], retry_wait: ['等待重试', 'warn'], failed: ['失败', 'bad'] };

function stageReason(r) {

    case 'not_selected': return `简介初评 ${r.initial.toFixed(1)} < 付费 ASR 线 6.0`;
    case 'awaiting_transcript': return '已过付费 ASR 线 6.0 · 等待逐字稿';
    case 'processing': return asr ? 'ASR 转录中' : '全文分析中';
    case 'full_analyzed': return `ASR 逐字稿 · ${r.final.toFixed(1)} ${r.premium ? '≥' : '<'} 门槛 7.5`;
    case 'reconciliation': return 'ASR 结果待对账 · 对账后重试 ASR';
    case 'retry_wait': return '等待 ASR 配额 · 计划 11-04 00:05 自动重试';
    case 'failed': return `${asr ? 'ASR 转录失败' : '全文分析失败'} · ${r.err}`;
    default: return '';
  }
}

      : `<div class="ops-lofi" style="height:${b.h}px">${esc(b.name)} · ${LOFI_LABEL[b.kind] || ''}</div>`;
    return sec(b.id, body, { title: b.name, span: b.span || 12, rows: b.rows || 0, fill: true });
  });
  return pageWrap(p, out.join(''));
}

/* ══ 路由 ══ */
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] !== 'admin') return null;
  const leg = LEGACY[parts[1]];
  if (leg) {
    const to = leg[parts[2] || ''] || leg[''];
    history.replaceState(null, '', `${location.pathname}${location.search}#/admin/${to}`);
    return parseHash();
  }
  const page = PAGE[parts[1]] ? parts[1] : null;
  const block = page && parts[2] ? parts[2] : null;
  return { page, block };
}
/* 数字滚动:重绘前快照 [data-roll] 的旧值,重绘后从旧值滚到新值(≈ 400ms,三次缓出;reduce 时直落) */
let ROLL = {};
function snapRoll() { ROLL = {}; $$('[data-roll]').forEach((el) => { ROLL[el.dataset.roll] = Number(el.dataset.val); }); }
function playRoll() {
  if (S.motion) return;
  $$('[data-roll]').forEach((el) => {
    const to = Number(el.dataset.val); const from = ROLL[el.dataset.roll];
    if (from == null || Number.isNaN(from) || from === to) return;
    const f = el.dataset.fmt; const t0 = performance.now();
    const paint = (v) => { el.textContent = f === 'dec1' ? v.toFixed(1) : f === 'plus' ? `+${Math.round(v)}` : f === 'k' ? fmtK(v) : fmt(Math.round(v)); };
    const step = (now) => { const p = Math.min(1, (now - t0) / 400); const e = 1 - (1 - p) ** 3; paint(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render({ keepScroll = false } = {}) {
  const r = parseHash();
  if (!r) { history.replaceState(null, '', `${location.pathname}${location.search}#/admin`); return render(); }
  S.route = r;
  const y = window.scrollY;
  const p = r.page && PAGE[r.page];
  hideTip();
  snapRoll();
  $('#view').innerHTML = !p ? renderHome() : p.id === 'reader' ? renderReader() : p.id === 'podcast' ? renderPodcast() : p.id === 'accounts' ? renderAccounts() : renderLofi(p);
  document.title = p ? `${p.name} · 运维管理` : '运维管理';
  drawCharts();
  playRoll();
  renderDrawer();
  if (keepScroll) window.scrollTo(0, y);
  return r;
}
// 读者功能迷你柱两色(读者 / 系统):cat = v3 分类色;tint = 同色相两档;ink = 墨两档;inkTint = accent + 墨淡档
const AI_TONES = {
  cat: ['var(--chart-1)', 'var(--chart-other)'],
  tint: ['var(--dorami-accent)', 'color-mix(in oklab, var(--dorami-accent) 30%, var(--dorami-card-solid))'],
  ink: ['var(--dorami-ink-2)', 'color-mix(in oklab, var(--dorami-ink) 20%, var(--dorami-card-solid))'],
  inkTint: ['var(--dorami-accent)', 'color-mix(in oklab, var(--dorami-ink) 22%, var(--dorami-card-solid))'],
};
const CHARTS = {
  dauTile: (el) => { const d = S.days; return stackBars(el, { id: 'dauTile', days: D.lastN(D.days, d), keys: ['活跃账户'], colors: ['var(--dorami-blue)'], m: D.lastN(D.series.dau, d).map((v) => [v]), unit: '个', compact: true, home: true, label: '逐日活跃账户' }); },
  growthTile: (el) => { const g = growthWin(S.days); return stepLine(el, { id: 'growthTile', ...g, compact: true, labels: false, home: true }); },
  readTop: (el) => hbars({ id: 'readTop', rows: readTop(S.days, S.look === 'base' ? 5 : Math.max(5, Math.min(8, Math.floor((el.clientHeight + 8) / 46)))), color: 'var(--chart-1)', metric: topWindowed() ? `近 ${S.days} 天阅读` : '累计阅读', unit: '次', total: topWindowed() ? D.sumLast(D.series.reads, S.days) : D.content.reads, fill: true, home: true }),
  aiTile: (el) => { const aw = aiWin(S.days); const m = aw.calls.map((row) => { const rd = sum(aw.rj.map((j) => row[j])); return [rd, sum(row) - rd]; }); return stackBars(el, { id: 'aiTile', days: aw.days, keys: ['读者用途', '系统用途'], colors: AI_TONES[LK().ai], m, unit: '次', mini: true, home: true, label: '逐日 AI 调用' }); },
  podTile: (el) => (LK().pod === 'seg'
    ? segBar({ id: 'podTile', parts: stageParts(true, true), unit: '期', big: true, width: el.clientWidth })
    : donut({ id: 'podTile', parts: stageParts(true, S.look !== 'base'), unit: '期', total: D.podcast.total, totalUnit: '期', totalLabel: '单集', sw: LK().ring, stack: S.look !== 'base', size: Math.min(el.clientWidth, el.clientHeight, 168) })),
  histTile: (el) => { const hw = histWin(S.days); return histogram(el, { id: 'histTile', counts: hw.counts, p50: D.analysis.p50, mini: true, home: true }); },
  aiPage: (el) => { const aw = aiWin(S.days); const ser = aiSeries(aw, S.reader.metric, S.root ? S.reader.dim : 'purpose'); return stackBars(el, { id: 'aiPage', days: aw.days, keys: ser.keys, colors: ser.colors, m: ser.m, unit: S.reader.metric === 'calls' ? '次' : 'tokens', label: '每日用量' }); },
  growthPage: (el) => { const g = growthWin(S.days); return stepLine(el, { id: 'growthPage', ...g, labels: true }); },
  guestPage: (el) => { const gw = guestWin(S.days); return stackBars(el, { id: 'guestPage', days: gw.days, keys: ['访客'], colors: ['var(--dorami-blue)'], m: gw.visitors.map((v) => [v]), dots: gw.conv, unit: '人', label: '游客走势' }); },
};
function drawCharts() {
  $$('[data-chart]').forEach((el) => {
    const pin = el.querySelector(':scope > .spec-src');
    const fn = CHARTS[el.dataset.chart];
    if (!fn) return;
    el.innerHTML = fn(el) + (pin ? pin.outerHTML : '');
  });
}
function land(block) {
  const el = block && $(`[data-block="${CSS.escape(block)}"]`);
  if (!el) { window.scrollTo(0, 0); return; }
  el.scrollIntoView({ block: el.classList.contains('ops-swcell') ? 'center' : 'start', behavior: 'auto' });
  el.classList.remove('ops-flash');
  void el.offsetWidth;
  el.classList.add('ops-flash');
  el.focus({ preventScroll: true });
  setTimeout(() => el.classList.remove('ops-flash'), 1700);
}
function go(hash) {
  closePops();
  if (location.hash === hash) { const r = render({ keepScroll: true }); land(r.block); return; }
  location.hash = hash;
}
window.addEventListener('hashchange', () => { S.drawer = null; closePops(); const r = render(); land(r.block); });
function closePops() {
  $$('.ops-crumb-pop').forEach((p) => p.remove());
  $$('.ops-crumb-cur').forEach((b) => b.setAttribute('aria-expanded', 'false'));
}

/* ══ 浮层:图元贴指针(出界翻面);数字 / 页名带 data-tip-anchor 时锚在元素下方(贴底翻到上方) ══ */
let tipCur = null; let tipAnchored = false;
function hideTip() {
  const el = $('#ops-tip'); if (el) el.hidden = true;
  $$('.ops-cur.is-on, .ops-xhair.is-on, .ops-xdot.is-on').forEach((x) => x.classList.remove('is-on'));
  $$('.is-hot').forEach((x) => x.classList.remove('is-hot'));
  tipCur = null; tipAnchored = false;
}
function placeTip(x, y) {
  if (tipAnchored) return;
  const el = $('#ops-tip');
  const w = el.offsetWidth; const h = el.offsetHeight;
  let left = x + 14; if (left + w > window.innerWidth - 8) left = x - 14 - w;
  left = Math.max(8, left);
  let top = y - h / 2; top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
  el.style.left = `${left}px`; el.style.top = `${top}px`;
}
function placeAnchored(t) {
  const el = $('#ops-tip'); const r = t.getBoundingClientRect();
  const w = el.offsetWidth; const h = el.offsetHeight;
  let left = r.left; if (left + w > window.innerWidth - 8) left = window.innerWidth - 8 - w; left = Math.max(8, left);
  let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = r.top - 6 - h; top = Math.max(8, top);
  el.style.left = `${left}px`; el.style.top = `${top}px`;
}
function showTip(t, x, y) {
  const [id, i] = t.dataset.tip.split('|');
  const spec = TIPS[id]; const row = spec && spec.rows[Number(i)];
  if (!row) return;
  hideTip();
  tipCur = t; tipAnchored = 'tipAnchor' in t.dataset;
  const el = $('#ops-tip');
  el.innerHTML = tipHtml(row); el.hidden = false;
  if (tipAnchored) placeAnchored(t); else placeTip(x, y);
  if (spec.kind === 'col') {
    const cur = $(`[data-cur="${id}"]`); const g = spec.geo[Number(i)];
    if (cur && g) { cur.setAttribute('x', g.x.toFixed(1)); cur.setAttribute('width', g.w.toFixed(1)); cur.classList.add('is-on'); }
  } else if (spec.kind === 'xhair') {
    const g = spec.geo[Number(i)]; const ln = $(`[data-xhair="${id}"]`); const dot = $(`[data-xdot="${id}"]`);
    if (ln && g) { ln.setAttribute('x1', g.cx.toFixed(1)); ln.setAttribute('x2', g.cx.toFixed(1)); ln.classList.add('is-on'); }
    if (dot && g) { dot.setAttribute('cx', g.cx.toFixed(1)); dot.setAttribute('cy', g.cy.toFixed(1)); dot.classList.add('is-on'); }
  } else {
    t.classList.add('is-hot');
  }
}
document.addEventListener('pointerover', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t && t !== tipCur) showTip(t, e.clientX, e.clientY);
});
document.addEventListener('pointermove', (e) => { if (tipCur) placeTip(e.clientX, e.clientY); });
document.addEventListener('pointerout', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
  if (t && !to) hideTip();
});
window.addEventListener('scroll', () => { if (tipCur) hideTip(); }, { passive: true });

/* ══ 事件 ══ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.drawer) { S.drawer = null; renderDrawer(); $$('.acct-row.is-sel').forEach((r) => r.classList.remove('is-sel')); return; }
    closePops();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.acct-row[data-user]')) { e.preventDefault(); openUser(e.target.dataset.user); }
});
// 打开抽屉不重绘列表:筛选、排序、滚动位置原样保留(Supabase Studio 做法)
function openUser(name) {
  S.drawer = name;
  $$('.acct-row').forEach((r) => r.classList.toggle('is-sel', r.dataset.user === name));
  renderDrawer();
}
function rerender() { render({ keepScroll: true }); }

document.addEventListener('click', (e) => {
  const t = e.target;
  if (!t.closest('.ops-crumb-pop') && !t.closest('[data-act="crumb"]')) closePops();
  const spec = t.closest('[data-spec]');
  if (spec) {
    const { spec: k, v } = spec.dataset;
    if (k === 'theme') { S.theme = v; document.documentElement.dataset.theme = v; renderRail(); }
    if (k === 'root') { S.root = v === '1'; S.drawer = null; S.acct.sel.clear(); renderRail(); }
    if (k === 'agg') S.agg = v === '1';
    if (k === 'pending') S.pending = v === '1';
    if (k === 'src') S.src = v === '1';
    if (k === 'look') { S.look = v; S.palette = null; applyLook(); }
    if (k === 'pal') { S.palette = v === LOOKS[S.look].palette ? null : v; applyLook(); }
    syncQuery(); renderSpec(); rerender(); return;
  }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'spec-hide') { S.spec = false; syncQuery(); renderSpec(); drawCharts(); return; }
  if (act === 'spec-show') { S.spec = true; S.pill = true; syncQuery(); renderSpec(); drawCharts(); return; }
  if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; syncQuery(); renderSpec(); renderRail(); drawCharts(); return; }
  if (act === 'toast-x') { $('#toast').innerHTML = ''; return; }
  if (act === 'drawer-x') { S.drawer = null; renderDrawer(); $$('.acct-row.is-sel').forEach((r) => r.classList.remove('is-sel')); return; }
  if (act === 'sel-clear') { S.acct.sel.clear(); rerender(); return; }
  if (act === 'crumb') {
    const btn = t.closest('[data-act="crumb"]');
    const h1 = btn.closest('.ops-crumb');
    const open = $('.ops-crumb-pop', h1);
    if (open) { open.remove(); btn.setAttribute('aria-expanded', 'false'); return; }
    h1.insertAdjacentHTML('beforeend', crumbPop(S.route.page));
    btn.setAttribute('aria-expanded', 'true');
    return;
  }
  if (act === 'th-search') { toast('样页:实装为就地展开搜索(ThSearch)'); return; }
  const pf = t.closest('[data-podfilter]');
  if (pf) S.pod.stage = pf.dataset.podfilter;
  const goEl = t.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const a = t.closest('a[href^="#/admin"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); return; }
  const toastEl = t.closest('[data-toast]');
  if (toastEl) { e.preventDefault(); toast(toastEl.dataset.toast); return; }
  const sw = t.closest('[data-sw]');
  if (sw) {
    const k = sw.dataset.sw; S.sw[k] = !S.sw[k];
    const msg = (SWITCHES.find((s) => s[0] === k)?.[4] || SW_TOAST[k])[S.sw[k] ? 0 : 1];
    toast(msg, 'success'); rerender(); return;
  }
  const days = t.closest('[data-days]');
  if (days) { S.days = Number(days.dataset.days); S.acct.page = 1; syncQuery(); rerender(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { S.reader.metric = rm.dataset.rm; syncQuery(); rerender(); return; }
  const rd = t.closest('[data-rd]');
  if (rd) { S.reader.dim = rd.dataset.rd; syncQuery(); rerender(); return; }
  const top = t.closest('[data-top]');
  if (top) { S.acct.top = top.dataset.top; rerender(); return; }
  if (t.closest('[data-podclear]')) { S.pod = { stage: '', verdict: '', tts: '' }; rerender(); return; }
  const pv = t.closest('[data-podaxis]');
  if (pv) { const [k, v] = pv.dataset.podaxis.split(':'); S.pod[k] = S.pod[k] === v ? '' : v; rerender(); land('tasks'); return; }
  const ps = t.closest('[data-podstage]');
  if (ps) { S.pod.stage = S.pod.stage === ps.dataset.podstage ? '' : ps.dataset.podstage; rerender(); if (ps.closest('.ops-stage-legend')) land('tasks'); return; }
  const flt = t.closest('[data-filter]');
  if (flt) {
    const k = flt.dataset.filter;
    const cyc = { role: ['', 'admin', 'user'], status: ['', 'active', 'disabled'], ai: ['', 'on', 'off'], podstage: ['', 'not_processed', 'not_selected', 'awaiting_transcript', 'processing', 'full_analyzed', 'reconciliation', 'retry_wait', 'failed'], podverdict: ['', 'premium', 'below_threshold', 'unscored'], podtts: ['', 'not_started', 'active', 'retry_wait', 'ready', 'failed'] }[k];
    if (!cyc) { toast('样页:这一列的轮换筛选未接'); return; }
    if (k.startsWith('pod')) { const kk = { podstage: 'stage', podverdict: 'verdict', podtts: 'tts' }[k]; S.pod[kk] = cyc[(cyc.indexOf(S.pod[kk]) + 1) % cyc.length]; } else { S.acct[k] = cyc[(cyc.indexOf(S.acct[k]) + 1) % cyc.length]; S.acct.page = 1; S.acct.sel.clear(); }
    rerender(); return;
  }
  const fs = t.closest('[data-filterset]');
  if (fs) { const [k, v] = fs.dataset.filterset.split(':'); S.acct[k] = S.acct[k] === v ? '' : v; S.acct.page = 1; rerender(); land('table'); return; }
  const so = t.closest('[data-sort]');
  if (so && S.route.page === 'accounts') {
    const k = so.dataset.sort;
    if (S.acct.sort === k) S.acct.order = S.acct.order === 'asc' ? 'desc' : 'asc'; else { S.acct.sort = k; S.acct.order = k === 'username' ? 'asc' : 'desc'; }
    S.acct.page = 1; rerender(); return;
  }
  const pg = t.closest('[data-pg]');
  if (pg && S.route.page === 'accounts' && pg.closest('[aria-label="账户管理"]')) { S.acct.page = Number(pg.dataset.pg); rerender(); return; }
  const selall = t.closest('[data-selall]');
  if (selall) { const rows = $$('[data-sel]').map((c) => c.dataset.sel); const all = rows.every((n) => S.acct.sel.has(n)); rows.forEach((n) => (all ? S.acct.sel.delete(n) : S.acct.sel.add(n))); rerender(); return; }
  const sel = t.closest('[data-sel]');
  if (sel) { const n = sel.dataset.sel; if (S.acct.sel.has(n)) S.acct.sel.delete(n); else S.acct.sel.add(n); rerender(); return; }
  if (t.closest('[data-stop]')) return;
  const ur = t.closest('tr[data-user]');
  if (ur) { openUser(ur.dataset.user); return; }
  const ep = t.closest('tr[data-ep]');
  if (ep && !t.closest('.rowacts')) { toast('样页:实装打开单集抽屉(处理时间线 / 文本 / 音频)'); }
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { renderSpec(); drawCharts(); }); });

/* ══ 启动 ══ */
document.documentElement.dataset.theme = S.theme;
applyLook();
if (S.motion) document.documentElement.dataset.motion = 'reduce';
renderSpec();
renderRail();
const first = render();
land(first.block);
