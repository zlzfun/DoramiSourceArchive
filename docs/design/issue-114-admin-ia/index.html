<style>/* ══════════════════════════════════════════════════════════════════════
   issue #114 R2 · 第三版 · 本稿新增类
   ops-*  = 实装时会进 index.css 的产品类(运维首页三档磁贴 / 状态磁贴 / 功能页栅格 / 面包屑 / 图表件)
   spec-* = 样页辅助 chrome(spec 栏、数据来源标注),实装不要
   只用 token,不写 hex(token 定义块除外);字重 400 / 600;字号 ≥ 12px。
   动效全部挂 data-motion:reduce 时只保留不透明度变化(transform / 生长动画归零)。
   ══════════════════════════════════════════════════════════════════════ */

/* ── 样页壳:spec 栏占顶,产品整体下移 --spec-h ── */
:root { --spec-h: 0px; }
.app-rail { top: var(--spec-h); }
.spec-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 95;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px;
  min-height: 40px; padding: 6px 16px;
  background: var(--dorami-ink); color: var(--dorami-surface);
  font-size: 12px; font-weight: 400; line-height: 1.2;
}
.spec-title { font-weight: 600; margin-right: 4px; white-space: nowrap; }
.spec-group { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.spec-name { color: color-mix(in oklab, var(--dorami-surface) 72%, transparent); }
.spec-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--dorami-surface) 14%, transparent); }
.spec-btn { min-height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; color: color-mix(in oklab, var(--dorami-surface) 80%, transparent); }
.spec-btn:hover:not(.is-on) { color: var(--dorami-surface); }
.spec-btn.is-on { background: var(--dorami-surface); color: var(--dorami-ink); }
.spec-btn:focus-visible, .spec-link:focus-visible { outline: 2px solid var(--dorami-surface); outline-offset: 1px; }
.spec-link { color: var(--dorami-surface); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--dorami-surface) 45%, transparent); white-space: nowrap; border-radius: 4px; }
.spec-hide { margin-left: auto; }
.spec-pill {
  position: fixed; right: 14px; bottom: 14px; z-index: 95;
  min-height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--dorami-ink); color: var(--dorami-surface); font-size: 12px; box-shadow: var(--sh-2);
}
.spec-src {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-left: 6px;
  border: 1px dashed currentColor; border-radius: 4px;
  font-size: 12px; font-weight: 400; line-height: 1; white-space: nowrap; vertical-align: middle;
  font-variant-numeric: normal; letter-spacing: 0; cursor: help;
}
.spec-src.is-have { color: var(--state-ok); }
.spec-src.is-agg { color: var(--state-warn); }
.spec-src.is-add { color: var(--state-bad); }
.spec-src.is-pin { position: absolute; top: 0; right: 0; z-index: 2; margin: 0; background: var(--dorami-card-solid); }
.spec-bar[hidden], .spec-pill[hidden] { display: none; }

/* ── 页头:面包屑「运维管理 › 播客 ▾」(搜功能框已去掉,▾ 是唯一横切入口) ── */
@keyframes ops-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.ops-pop {
  position: absolute; z-index: 70; padding: 4px;
  border-radius: var(--r-card); background: var(--dorami-surface);
  border: 1px solid var(--dorami-border); box-shadow: var(--sh-3);
  font-size: 13px; font-weight: 400;
  animation: ops-pop-in var(--motion-fast) var(--motion-ease);
}
:root[data-motion="reduce"] .ops-pop { animation: none; }
.ops-crumb { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; }
.ops-crumb-root { color: var(--dorami-faint); font-weight: 400; border-radius: var(--r-sm); }
.ops-crumb-root:hover { color: var(--dorami-ink-2); }
.ops-crumb-sep { width: 18px; height: 18px; flex: none; color: var(--dorami-faint); }
.ops-crumb-cur {
  display: inline-flex; align-items: center; gap: 4px; margin: -2px -6px; padding: 2px 6px;
  border-radius: var(--r-control); font: inherit; color: var(--dorami-ink);
}
.ops-crumb-cur:hover, .ops-crumb-cur[aria-expanded="true"] { background: var(--dorami-hover); }
.ops-crumb-cur svg { width: 18px; height: 18px; color: var(--dorami-muted); }
.ops-crumb-pop { top: calc(100% + 8px); left: 0; display: grid; gap: 2px; min-width: 212px; padding: 6px; letter-spacing: 0; line-height: 1.4; }
.ops-crumb-item {
  display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; border-radius: 8px;
  font-size: 13px; font-weight: 400; color: var(--dorami-ink-2); white-space: nowrap;
}
.ops-crumb-item svg { width: 14px; height: 14px; flex: none; color: var(--dorami-faint); }
.ops-crumb-item:hover { background: var(--dorami-hover); color: var(--dorami-ink); }
.ops-crumb-item.is-cur { background: var(--dorami-select); color: var(--dorami-ink); font-weight: 600; }
.ops-crumb-item .ops-crumb-check { margin-left: auto; color: var(--dorami-ink-2); }

/* ══ 首页:12 列 × 3 行,16px 缝。行 1 = L(账户 7 / 阅读与榜单 5),行 2 = M(3 × 3)+ 状态(3,纵跨 2–3),行 3 = S(3 × 3,单行 56px)。
   整块高度跟视口走(行 3 固定,行 1 / 行 2 按 1.58 : 1 分余量),1920 下行 1 / 行 2 按比例放高。 ══ */
.ops-bento {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px;
  grid-template-rows: minmax(300px, 1.58fr) minmax(190px, 1fr) 56px;
  height: max(578px, calc(100vh - var(--spec-h) - 108px));
}
.t-accounts { grid-column: 1 / span 7; grid-row: 1; }
.t-reading { grid-column: 8 / span 5; grid-row: 1; }
.t-reader { grid-column: 1 / span 3; grid-row: 2; }
.t-podcast { grid-column: 4 / span 3; grid-row: 2; }
.t-analysis { grid-column: 7 / span 3; grid-row: 2; }
.t-status { grid-column: 10 / span 3; grid-row: 2 / span 2; }
.t-external { grid-column: 1 / span 3; grid-row: 3; }
.t-usrc { grid-column: 4 / span 3; grid-row: 3; }
.t-inbox { grid-column: 7 / span 3; grid-row: 3; }

/* 磁贴通则:整块是入口(页名链接的 ::after 铺满磁贴);hover 轻抬 = 阴影 + 1px 描边变色 + 1px 上移(reduce 时不上移) */
.ops-tile {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  padding: 14px 18px 12px; border-radius: var(--r-card); overflow: hidden;
  transition: box-shadow var(--motion-fast) var(--motion-ease), border-color var(--motion-fast) var(--motion-ease), transform var(--motion-fast) var(--motion-ease);
}
.ops-tile[data-tile]:hover { box-shadow: var(--sh-3), inset 0 1px 0 var(--dorami-edge); border-color: var(--dorami-border-strong); transform: translateY(-1px); }
.ops-tile:has(.ops-tile-name:focus-visible) { box-shadow: var(--sh-2), inset 0 1px 0 var(--dorami-edge), 0 0 0 2px var(--dorami-focus); }
:root[data-motion="reduce"] .ops-tile { transition-property: box-shadow, border-color; }
:root[data-motion="reduce"] .ops-tile[data-tile]:hover { transform: none; }

/* ① 单行页头:图标 + 页名居左;右侧元数据(时间窗 chip / 状态点) */
.ops-tile-head { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 22px; flex: none; }
.ops-tile-icon { width: 16px; height: 16px; flex: none; color: var(--dorami-muted); }
.ops-tile-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
.ops-tile-name::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.ops-tile-meta { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 12px; color: var(--dorami-faint); white-space: nowrap; }
.ops-win { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--r-pill); background: var(--dorami-well); color: var(--dorami-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ops-count { font-size: 12px; font-weight: 400; color: var(--dorami-faint); font-variant-numeric: tabular-nums; }
/* 磁贴有待处理:只给一个状态点(数字只在「状态」磁贴出现一次);形状 + 色双通道 */
.ops-mark { display: inline-block; width: 8px; height: 7px; flex: none; background: var(--state-warn); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.ops-mark.is-bad { width: 7px; height: 7px; clip-path: none; transform: rotate(45deg); background: var(--state-bad); }
.ops-tile-dot { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex: none; cursor: help; }

/* ② 数字 + 标签同行、基线对齐(「80 活跃账户」);主角字号 L 36 / M 28 / S 20,次级 20。
   hover 数字 → 浮层给被削掉的说明(与图表浮层同一套,锚在数字下方) */
.ops-kpi { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; cursor: default; border-radius: 4px; }
.ops-kpi[data-tip] { position: relative; z-index: 1; } /* 压过页名链接铺满磁贴的 ::after,数字才接得到 hover */
.ops-kpi-num { font-size: 20px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--dorami-ink-2); }
.ops-kpi-lbl { font-size: 12px; font-weight: 400; line-height: 16px; color: var(--dorami-faint); transition: color var(--motion-fast) var(--motion-ease); }
.ops-kpi.is-hero .ops-kpi-num { font-size: 36px; line-height: 40px; letter-spacing: -0.02em; color: var(--dorami-ink); }
.ops-kpi.is-hero .ops-kpi-lbl { font-size: 13px; }
.ops-kpis .ops-kpi:not(.is-hero) .ops-kpi-num { font-size: 18px; }
.ops-kpi-num small { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--dorami-muted); }
.ops-kpi-num.is-warn { color: var(--state-warn); }
.ops-kpi[data-tip]:hover .ops-kpi-lbl, .ops-kpi.is-hot .ops-kpi-lbl { color: var(--dorami-ink-2); text-decoration: underline dotted; text-underline-offset: 3px; }
/* L:KPI 一行横排,等距铺满整行宽 */
.ops-kpis { position: relative; z-index: 1; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 10px; flex: none; min-width: 0; }
.ops-kpis .stamp { position: relative; top: -2px; }
.ops-kpis.is-page { margin: 0 0 14px; }
.ops-kpis.is-page .ops-kpi-num { color: var(--dorami-ink); }
.ops-kpi-acts { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--dorami-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* ③ 全宽图(L)/ 同行小图(M) */
.ops-tile-chart { position: relative; z-index: 1; flex: 1; min-height: 72px; margin-top: 10px; cursor: pointer; }
.ops-mrow { display: flex; align-items: stretch; gap: 16px; flex: 1; min-height: 0; margin-top: 8px; }
.ops-mrow > .ops-kpi { align-self: center; flex: none; }
.ops-mrow > .ops-kpi.is-hero .ops-kpi-num { font-size: 28px; line-height: 32px; }
.ops-mrow > .ops-tile-chart { margin: 0; min-width: 72px; min-height: 48px; }
.ops-mrow > .ops-tile-chart.is-seg { align-self: center; flex: 1; min-height: 0; height: 10px; }
.ops-tile-chart.is-seg .ops-seg { height: 10px; }
/* 环图(播客 M,v3.1):随行高拉伸、宽高 1:1、靠右;hover 段高亮、其余段淡出;首帧只做不透明度 */
.ops-mrow > .ops-tile-chart.is-donut { flex: 1; display: flex; align-items: center; justify-content: flex-end; min-height: 0; min-width: 0; }
.ops-donut { display: block; width: 100%; height: 100%; max-height: 156px; }
.ops-donut-p { transition: opacity var(--motion-fast) var(--motion-ease); }
.ops-donut:has(.is-hot) .ops-donut-p:not(.is-hot) { opacity: 0.4; }
.ops-donut-num { font-size: 15px; font-weight: 600; fill: var(--dorami-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.ops-donut-unit { font-size: 12px; font-weight: 400; fill: var(--dorami-faint); }
.ops-home .ops-donut-p { animation: ops-donut-in var(--motion-slow) var(--motion-ease) both; animation-delay: calc(var(--i, 0) * 1ms); }
@keyframes ops-donut-in { from { opacity: 0; } }
/* ④ 底部板块链接行:v3.1 退役(用户目检「去掉左下角的说明性文本」) */

/* S:一行 = 页名居左,1 个数字(至多 1 个状态 chip)居右(v3.1:hover 链接槽退役,数字常显) */
.ops-tile.is-s { flex-direction: row; align-items: center; gap: 12px; padding: 0 16px; container-type: inline-size; }
/* 3 列 S 磁贴在 1280 下只有 278px(内容盒 246):7 字页名 + 状态点 + 「2.4 GB 媒体库」放不下图标,内容盒窄于 270px 时收起图标(≥ 1440 照常) */
@container (max-width: 270px) { .ops-tile.is-s .ops-tile-icon { display: none; } } /* 容器查询量的是内容盒:1280 下 246px、1440 下 286px */
.ops-tile.is-s .ops-tile-head { flex: none; min-width: 0; max-width: 55%; }
.ops-tile.is-s .ops-tile-meta { margin-left: 0; }
.ops-srt { position: relative; z-index: 1; flex: 1; min-width: 0; height: 24px; margin-left: auto; }
.ops-srt-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  white-space: nowrap; transition: opacity 120ms var(--motion-ease);
}
.ops-srt-num .ops-kpi.is-hero .ops-kpi-num { font-size: 20px; line-height: 24px; letter-spacing: -0.01em; }

/* 状态磁贴:页头右侧小计数;正文 = 按严重度排的待处理(名称 + 数字 + ›);底部 = 8 个开关点(关着的常显名称,其余 hover 浮出) */
.ops-status .ops-tile-head .ops-count { margin-left: auto; }
.ops-pendlist { display: flex; flex-direction: column; flex: 1; min-height: 0; margin: 6px -6px 0; padding: 0 6px; overflow: hidden; }
.ops-pend {
  display: flex; align-items: center; gap: 8px; width: calc(100% + 12px); min-height: 26px; padding: 0 6px; margin: 0 -6px;
  border-radius: var(--r-control); text-align: left; font-size: 13px; color: var(--dorami-ink-2);
  transition: background var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);
}
.ops-pend:hover { background: var(--dorami-hover); color: var(--dorami-ink); }
.ops-pend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops-pend-num { font-weight: 600; font-variant-numeric: tabular-nums; }
.ops-pend.is-bad .ops-pend-num { color: var(--state-bad); }
.ops-pend.is-warn .ops-pend-num { color: var(--state-warn); }
.ops-pend > svg { width: 14px; height: 14px; flex: none; color: var(--dorami-faint); transition: transform var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease); }
.ops-pend:hover > svg { transform: translateX(2px); color: var(--dorami-ink-2); }
:root[data-motion="reduce"] .ops-pend > svg { transition-property: color; }
:root[data-motion="reduce"] .ops-pend:hover > svg { transform: none; }
.ops-pend-none { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-top: 6px; font-size: 13px; color: var(--dorami-muted); }
.ops-dots { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; flex: none; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--dorami-border); min-height: 32px; }
.ops-dot { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 20px; padding: 0 2px; border-radius: 4px; font-size: 12px; line-height: 16px; color: var(--dorami-muted); white-space: nowrap; }
.ops-dot .ai-light { width: 8px; height: 8px; }
.ops-dot:hover .ai-light, .ops-dot:focus-visible .ai-light { box-shadow: 0 0 0 3px color-mix(in oklab, currentColor 18%, transparent); }
.ops-dot-name {
  position: absolute; left: 50%; bottom: calc(100% + 6px); z-index: 3; transform: translate(-50%, 3px);
  padding: 5px 8px; border-radius: var(--r-sm); background: var(--dorami-ink); color: var(--dorami-surface);
  font-size: 12px; line-height: 1; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity 120ms var(--motion-ease), transform 120ms var(--motion-ease);
}
.ops-dot-name::after { content: ""; position: absolute; left: 50%; top: 100%; width: 6px; height: 6px; margin-left: -3px; margin-top: -3px; transform: rotate(45deg); background: var(--dorami-ink); }
.ops-dot:hover .ops-dot-name, .ops-dot:focus-visible .ops-dot-name { opacity: 1; transform: translate(-50%, 0); }
.ops-dot.is-off .ops-dot-name { position: static; transform: none; opacity: 1; padding: 0; background: none; color: var(--dorami-ink-2); pointer-events: auto; transition: none; } /* 关着的常显名称;琥珀点即「关」 */
.ops-dot.is-off .ops-dot-name::after { display: none; }
.ops-dot.is-off:hover .ops-dot-name { text-decoration: underline; text-underline-offset: 3px; }
:root[data-motion="reduce"] .ops-dot-name { transform: translate(-50%, 0); transition-property: opacity; }
.ops-status.is-calm .ops-pendlist { flex: none; }

/* 图表容器(功能页沿用 v2):随卡片拉伸,SVG 按实测宽高重画;点图 = 进到对应板块 */
.ops-chart-box { position: relative; z-index: 1; flex: 1; min-height: 56px; cursor: pointer; }
.ops-chart-box.is-static { cursor: default; }
.ops-chart { display: block; overflow: visible; }
.ops-chart text { font-size: 12px; fill: var(--dorami-faint); font-variant-numeric: tabular-nums; }
.ops-chart .is-ink { fill: var(--dorami-ink-2); }
.ops-gl { stroke: var(--dorami-border); stroke-width: 1; }
.ops-mark-line { stroke: var(--dorami-ink-2); stroke-width: 1; }
.ops-hit { fill: transparent; }
.ops-cur { fill: var(--dorami-hover); visibility: hidden; }
.ops-cur.is-on { visibility: visible; }
.ops-xhair { stroke: var(--dorami-border-strong); stroke-width: 1; visibility: hidden; }
.ops-xdot { visibility: hidden; }
.ops-xhair.is-on, .ops-xdot.is-on { visibility: visible; }
.ops-cell { transition: opacity var(--motion-fast) var(--motion-ease); }
.ops-cell.is-hot { stroke: var(--dorami-ink-2); stroke-width: 1; }

/* 首页图表首帧生长:柱自底、横条自左、分段自左;错峰 ≤ 150ms(--i 由脚本按序写入);只在首页,功能页不做入场编排 */
@keyframes ops-grow-y { from { transform: scaleY(0); } }
@keyframes ops-grow-x { from { transform: scaleX(0); } }
.ops-home .ops-chart .ops-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: ops-grow-y var(--motion-slow) var(--motion-ease) both; animation-delay: calc(var(--i, 0) * 1ms); }
.ops-home .ops-hb-bar { transform-origin: 0 50%; animation: ops-grow-x var(--motion-slow) var(--motion-ease) both; animation-delay: calc(var(--i, 0) * 1ms); }
.ops-home .ops-seg-p { transform-origin: 0 50%; animation: ops-grow-x var(--motion-slow) var(--motion-ease) both; animation-delay: calc(var(--i, 0) * 1ms); }
:root[data-motion="reduce"] .ops-home .ops-chart .ops-bar, :root[data-motion="reduce"] .ops-home .ops-hb-bar, :root[data-motion="reduce"] .ops-home .ops-seg-p, :root[data-motion="reduce"] .ops-home .ops-donut-p { animation: none; }

/* 图例(功能页;首页磁贴不画图例,名称进浮层) */
.ops-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; line-height: 16px; color: var(--dorami-muted); }
.ops-lg { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ops-lg i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.ops-lg b { font-weight: 600; color: var(--dorami-ink-2); font-variant-numeric: tabular-nums; }
.ops-lg .ops-mark { width: 8px; }
button.ops-lg { border-radius: 4px; }
button.ops-lg:hover { color: var(--dorami-ink); }
button.ops-lg.is-on { color: var(--dorami-ink); text-decoration: underline; text-underline-offset: 3px; }

/* 横向排行条(单系列直标数值;名在左、值在右) */
.ops-hb { display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.ops-hb-row { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 20px; padding: 0 4px; margin: 0 -4px; border-radius: 4px; font-size: 12px; }
.ops-hb.is-dense .ops-hb-row { min-height: 18px; }
.ops-hb.is-loose .ops-hb-row { min-height: 26px; }
.ops-hb.is-fill { height: 100%; justify-content: space-evenly; gap: 0; }
.ops-hb.is-fill .ops-hb-row { min-height: 24px; grid-template-columns: minmax(0, 32%) minmax(0, 1fr) auto; }
.ops-hb.is-fill .ops-hb-track, .ops-hb.is-fill .ops-hb-bar { height: 8px; }
.ops-hb-row.is-hot { background: var(--dorami-hover); }
.ops-hb-name { color: var(--dorami-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops-hb-track { display: block; height: 6px; }
.ops-hb-bar { display: block; height: 6px; border-radius: 0 3px 3px 0; }
.ops-hb-val { min-width: 36px; text-align: right; color: var(--dorami-ink-2); font-variant-numeric: tabular-nums; }

/* 分段条:细(首页 10px)/ 高 24px(功能页);段间 2px 表面缝 */
.ops-seg { display: flex; gap: 2px; height: 8px; border-radius: var(--r-pill); overflow: hidden; }
.ops-seg-p { flex-basis: 3px; flex-shrink: 0; min-width: 3px; transition: opacity var(--motion-fast) var(--motion-ease); }
.ops-seg-p.is-hot { opacity: 0.78; }
.ops-seg.is-tall { height: 24px; border-radius: 0; }
.ops-seg.is-tall .ops-seg-p { border-radius: 4px; }

/* 计量条 */
.ops-meter { display: flex; gap: 2px; height: 6px; border-radius: var(--r-pill); overflow: hidden; background: color-mix(in oklab, var(--dorami-accent) 12%, transparent); }
.ops-meter > span { display: block; height: 100%; }
.ops-meter > span:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }

/* 浮层(全图 + 数字说明共用):头 → 行(图例顺序)→ 单位;数值在右、等宽 */
.ops-tip {
  position: fixed; z-index: 90; min-width: 168px; max-width: 300px; padding: 8px 10px 7px;
  border-radius: var(--r-card); border: 1px solid var(--dorami-border); background: var(--dorami-card-solid);
  box-shadow: var(--sh-2); font-size: 12px; line-height: 18px; pointer-events: none;
}
.ops-tip[hidden] { display: none; }
.ops-tip-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 3px; font-weight: 600; color: var(--dorami-ink-2); white-space: nowrap; }
.ops-tip-unit { margin-left: auto; font-weight: 400; color: var(--dorami-faint); }
.ops-tip-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; white-space: nowrap; }
.ops-tip-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--dorami-muted); overflow: hidden; text-overflow: ellipsis; }
.ops-tip-name i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.ops-tip-name i.is-none { background: transparent; }
.ops-tip-name .spec-src { margin-left: 2px; }
.ops-tip-val { font-weight: 600; color: var(--dorami-ink); font-variant-numeric: tabular-nums; }
.ops-tip-row.is-zero .ops-tip-val, .ops-tip-row.is-zero .ops-tip-name { color: var(--dorami-faint); font-weight: 400; }
.ops-tip-row.is-warn .ops-tip-val { color: var(--state-warn); }
.ops-tip-row.is-total { margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--dorami-border); }

/* ══ 功能页:满幅 12 列栅格(去卡片);顶部主角区,其下并排块,宽表铺满 ══ */
.ops-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 26px 20px; align-items: stretch; }
.ops-sec { position: relative; display: flex; flex-direction: column; min-width: 0; scroll-margin-top: calc(var(--spec-h) + 18px); }
.ops-sec:focus, .ops-swcell:focus, .ops-kpis:focus { outline: none; }
.ops-sec > .zone-head { margin: 0 2px 12px; min-height: 26px; align-items: center; }
.ops-sec-body { display: grid; gap: 12px; flex: 1; align-content: start; }
.ops-sec-body.is-fill { grid-template-rows: 1fr; align-content: stretch; }
.ops-span-12 { grid-column: span 12; }
.ops-span-8 { grid-column: span 8; }
.ops-span-7 { grid-column: span 7; }
.ops-span-6 { grid-column: span 6; }
.ops-span-5 { grid-column: span 5; }
.ops-span-4 { grid-column: span 4; }
.ops-rows-2 { grid-row: span 2; }

.ops-flash::before {
  content: ""; position: absolute; inset: -10px -12px; z-index: -1; border-radius: var(--r-card);
  background: var(--dorami-wash); pointer-events: none;
  animation: ops-flash 1.6s var(--motion-ease) forwards;
}
.ops-kpis.ops-flash::before { inset: -8px -10px; }
@keyframes ops-flash { 0%, 35% { opacity: 1; } 100% { opacity: 0; } }
:root[data-motion="reduce"] .ops-flash::before { animation-duration: 1ms; animation-delay: 900ms; }

/* 主角区:图表头 = 主角数字 + 图例;KPI 竖排与之等高(读者功能 / 播客页沿用 v2;账户页改横排 KPI 在主图上方) */
.ops-hero { display: flex; flex-direction: column; min-width: 0; }
.ops-hero-lbl { font-size: 12px; line-height: 16px; color: var(--dorami-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ops-hero-num {
  display: inline-flex; align-items: baseline; gap: 4px; margin-top: 2px;
  font-size: 28px; font-weight: 600; line-height: 32px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; color: var(--dorami-ink); white-space: nowrap;
}
.ops-hero-num.is-lg { font-size: 36px; line-height: 40px; }
.ops-hero-num small { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--dorami-faint); }
.ops-hero-sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--dorami-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ops-hero-card { display: flex; flex-direction: column; gap: 12px; height: 100%; }
.ops-ch-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ops-ch-head .ops-legend { justify-content: flex-end; max-width: 62%; }
.ops-kcol { display: flex; flex-direction: column; height: 100%; border-radius: var(--r-card); overflow: hidden; }
.ops-kcol > .kpi { flex: 1; justify-content: center; min-width: 0; padding: 12px 20px; }
.ops-kcol > .kpi + .kpi { border-left: none; border-top: 1px solid var(--dorami-border-soft); }
.ops-kpi-ring { display: flex; align-items: center; gap: 14px; }
.ops-kpi-ring .kpi-num, .ops-kpi-ring .kpi-sub { display: block; }
.ops-stamp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* 开关网格(3 列;每格 = 状态灯 + 名称 + 控件,说明进 title) */
.ops-swgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: var(--r-card); overflow: hidden; }
.ops-swcell { position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 56px; padding: 10px 18px; }
.ops-swcell:nth-child(3n + 2), .ops-swcell:nth-child(3n + 3) { border-left: 1px solid var(--dorami-border-soft); }
.ops-swcell:nth-child(n + 4) { border-top: 1px solid var(--dorami-border-soft); }
.ops-swcell .ai-switch-lbl { white-space: nowrap; }
.ops-swcell-end { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.ops-swcell .tiny-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ops-swcell .form-input { width: 120px; min-height: 32px; }
.ops-swcell.ops-flash::before { inset: 0; border-radius: 0; }

/* 并排块里的小卡头 */
.ops-subhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ops-subhead .card-title { font-size: 13px; }
.ops-sub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ops-hb.is-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; }

/* 默认订阅竖排(名单 + 加入) */
.ops-chiplist { display: flex; flex-direction: column; gap: 2px; }
.ops-chiprow { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 6px; margin: 0 -6px; border-radius: var(--r-control); font-size: 13px; color: var(--dorami-ink-2); }
.ops-chiprow:hover { background: var(--dorami-hover); }
.ops-chiprow .interest-chip-dot { margin: 0 2px; }
.ops-chiprow .rowact-btn { margin-left: auto; visibility: hidden; }
.ops-chiprow:hover .rowact-btn, .ops-chiprow:focus-within .rowact-btn { visibility: visible; }
.ops-chip-add { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--dorami-border); }
.ops-chip-add .rdef-select { flex: 1; }

/* 播客:三条构成(阶段 / 判定 / TTS,同一份 breakdown);图例计数可点,即筛下方单集表 */
.ops-comp { display: flex; flex-direction: column; justify-content: space-around; gap: 16px; flex: 1; }
.ops-comp-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
.ops-comp-lbl { padding-top: 3px; font-size: 12px; font-weight: 600; color: var(--dorami-faint); }
.ops-comp-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ops-comp .ops-seg.is-tall { height: 20px; }
.ops-stage-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12px; line-height: 18px; color: var(--dorami-muted); }
.ops-stage-legend .ops-lg { gap: 6px; }
.ops-stage-legend .kpi-sub-link { font-size: 12px; }
.ops-stage-legend .ops-lg-sub { color: var(--dorami-faint); }
.ops-asr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.ops-asr-grid .sett-field { min-width: 0; }
.ops-meter-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--dorami-faint); font-variant-numeric: tabular-nums; }
.ops-meter-legend .ops-lg i { border-radius: 2px; }

/* 去卡片(功能页定为去卡片;首页磁贴保留卡):板块之间一条细线,卡片退成平面,表格铺满内容宽 */
.ops-flat .ops-grid { row-gap: 22px; column-gap: 28px; }
.ops-flat .ops-sec { border-top: 1px solid var(--dorami-border); padding-top: 16px; }
.ops-flat .surface-card { background: transparent; box-shadow: none; border-color: transparent; backdrop-filter: none; border-radius: 0; }
.ops-flat .knob-cards .surface-card, .ops-flat .ops-subcard { border: 1px solid var(--dorami-border); border-radius: var(--r-card); }
.ops-flat .kpi-strip .kpi { padding-top: 4px; padding-bottom: 4px; }
.ops-flat .kpi-strip .kpi:first-child { padding-left: 2px; }
.ops-flat .ops-kcol > .kpi { padding-left: 2px; }
.ops-flat .ops-swgrid .ops-swcell:nth-child(3n + 1) { padding-left: 2px; }
.ops-flat .ai-switchboard { padding: 2px; }
.ops-flat .card-pad { padding: 4px 2px; }
.ops-flat .knob-cards .card-pad, .ops-flat .ops-subcard.card-pad { padding: 14px 16px; }
.ops-flat .acct-scroll { margin: 0 -12px; }
.ops-flat .acct-table .acct-th:first-child, .ops-flat .acct-row td:first-child { padding-left: 14px; }
.ops-flat .acct-table .acct-th:last-child, .ops-flat .acct-row td:last-child { padding-right: 14px; }
.ops-flat .acct-row:first-child td { border-top-color: var(--dorami-border); }
.ops-flat .table-foot, .ops-flat .ledger-batchbar, .ops-flat .ops-acct-foot { padding-left: 2px; padding-right: 2px; }

/* 旋钮卡三栏时标签不折行(现行 3 字段卡在窄列里会把「内容价值门槛」折成两行、输入框上下错位) */
.ops-page .knob-field > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 现行 PodcastZone 的 <strong> 在 600 的 .knob 里按 bolder 落成 900(现网同病,实装顺手修) */
.knob.is-fixed strong { font-weight: 600; }

/* 低保真骨架(静态,不闪烁——它是示意,不是加载态) */
.ops-lofi {
  display: flex; align-items: center; justify-content: center; text-align: center;
  border-radius: var(--r-card); background: var(--dorami-well);
  color: var(--dorami-faint); font-size: 12px; padding: 0 12px;
}
.ops-lofi-stack { display: flex; flex-direction: column; gap: 8px; height: 100%; }
.ops-lofi-stack > .ops-lofi { flex: 1; }

/* 账户抽屉(摘要 → 明细 → 操作) */
.ops-drawer-sec { display: flex; flex-direction: column; gap: 10px; }
.ops-drawer-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding: 12px 22px; border-top: 1px solid var(--dorami-border); }
.ops-drawer-foot .ai-divider { height: 18px; margin: 0 4px; }

/* 窄屏退化(< 1180):bento 改两列流式,功能页并排块改整行 */
@media (max-width: 1180px) {
  .ops-bento { height: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: auto; }
  .ops-bento > .ops-tile { grid-column: auto !important; grid-row: auto !important; min-height: 200px; }
  .ops-bento > .ops-tile.is-s { min-height: 56px; }
  .ops-bento > .t-accounts, .ops-bento > .t-reading { grid-column: 1 / -1 !important; min-height: 300px; }
  .ops-grid > .ops-sec { grid-column: 1 / -1; grid-row: auto; }
  .ops-swgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ══════════════════════════════════════════════════════════════════════
   第四版 · 首页风格方向(只动卡片内部排版、字体、图表画风;栅格与磁贴大小沿用 v3.1)
   :root[data-look] = 基线(v3.1 原样)/ a 精修 / b 仪表 / c 刊物 / d 大字;规则全部收在 .ops-home 作用域,功能页不受影响。
   字体只用产品已有的三套:界面黑体(--font-sans)、等宽(--font-mono)、自托管西文衬线 Dorami Latin Serif + 思源宋体 Dorami Serif。
   ══════════════════════════════════════════════════════════════════════ */
.ops-spec-div, .spec-div { width: 1px; height: 16px; background: color-mix(in oklab, var(--dorami-surface) 24%, transparent); }
.ops-okdot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--state-ok); vertical-align: 0.18em; }
.ops-gl.is-base { stroke: var(--dorami-border-strong); }

/* 横条第二套骨架(list / line / rank / big 共用,靠 grid 区域换排法) */
.ops-hb2 .ops-hb-row { position: relative; display: grid; align-items: center; column-gap: 10px; margin: 0; padding: 0; border-radius: 6px; font-size: 13px; }
.ops-hb2 .ops-hb-rank { display: none; color: var(--dorami-faint); font-variant-numeric: tabular-nums; }
.ops-hb2 .ops-hb-name { color: var(--dorami-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ops-hb2 .ops-hb-val { color: var(--dorami-ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.ops-hb2 .ops-hb-track { display: block; position: relative; height: 100%; min-width: 0; }
.ops-hb2 .ops-hb-bar { display: block; height: 100%; border-radius: 4px; }
.ops-hb2.is-fill { display: flex; flex-direction: column; justify-content: space-between; height: 100%; gap: 8px; }
.ops-hb.ops-hb2.is-fill .ops-hb-row { min-height: 0; }
.ops-hb.ops-hb2.is-fill .ops-hb-track { height: auto; }
.ops-hb.ops-hb2.is-fill .ops-hb-bar { height: 100%; }
/* list(A):名字压在淡色条上,值在右 —— Tremor BarList 做法 */
.ops-hb.ops-hb2.is-list .ops-hb-row, .ops-hb.ops-hb2.is-big .ops-hb-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "bar val"; height: 34px; min-height: 34px; flex: none; }
.ops-hb2.is-list .ops-hb-track, .ops-hb2.is-big .ops-hb-track { grid-area: bar; align-self: stretch; }
.ops-hb2.is-list .ops-hb-bar, .ops-hb2.is-big .ops-hb-bar { background: color-mix(in oklab, var(--dorami-accent) 14%, transparent); transition: background var(--motion-fast) var(--motion-ease); }
.ops-hb2.is-list .ops-hb-name, .ops-hb2.is-big .ops-hb-name { grid-area: bar; padding-left: 10px; z-index: 1; pointer-events: none; }
.ops-hb2.is-list .ops-hb-val, .ops-hb2.is-big .ops-hb-val { grid-area: val; min-width: 44px; }
.ops-hb2.is-list .ops-hb-row.is-hot .ops-hb-bar, .ops-hb2.is-big .ops-hb-row.is-hot .ops-hb-bar { background: color-mix(in oklab, var(--dorami-accent) 26%, transparent); }
.ops-hb2.is-list .ops-hb-row.is-hot, .ops-hb2.is-big .ops-hb-row.is-hot { background: none; }
.ops-hb2.is-big .ops-hb-val { font-size: 15px; letter-spacing: -0.01em; }
/* line(B):名值一行,3px 细条贴在下方整宽 */
.ops-hb.ops-hb2.is-line .ops-hb-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name val" "bar bar"; row-gap: 7px; flex: none; align-content: center; }
.ops-hb2.is-line .ops-hb-name { grid-area: name; }
.ops-hb2.is-line .ops-hb-val { grid-area: val; }
.ops-hb.ops-hb2.is-line .ops-hb-track { grid-area: bar; height: 3px; background: var(--dorami-border-soft); border-radius: 0; }
.ops-hb2.is-line .ops-hb-bar { background: var(--dorami-ink-2); border-radius: 0; }
.ops-hb2.is-line .ops-hb-row.is-hot { background: none; }
.ops-hb2.is-line .ops-hb-row.is-hot .ops-hb-bar { background: var(--dorami-ink); }
/* rank(C):序号 + 名值 + 2px 细条 */
.ops-hb.ops-hb2.is-rank .ops-hb-row { grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "rank name val" ". bar bar"; row-gap: 6px; flex: none; align-content: center; border-bottom: 1px solid var(--dorami-border-soft); border-radius: 0; padding-bottom: 7px; }
.ops-hb2.is-rank .ops-hb-row:last-child { border-bottom: 0; }
.ops-hb2.is-rank .ops-hb-rank { display: block; grid-area: rank; }
.ops-hb2.is-rank .ops-hb-name { grid-area: name; }
.ops-hb2.is-rank .ops-hb-val { grid-area: val; }
.ops-hb.ops-hb2.is-rank .ops-hb-track { grid-area: bar; height: 2px; }
.ops-hb2.is-rank .ops-hb-bar { background: color-mix(in oklab, var(--dorami-ink) 55%, transparent); border-radius: 0; }
.ops-hb2.is-rank .ops-hb-row.is-hot { background: none; }
.ops-hb2.is-rank .ops-hb-row.is-hot .ops-hb-bar { background: var(--dorami-accent); }
.ops-home .ops-hb2 .ops-hb-bar { transform-origin: 0 50%; animation: ops-grow-x var(--motion-slow) var(--motion-ease) both; animation-delay: calc(var(--i, 0) * 1ms); }
:root[data-motion="reduce"] .ops-home .ops-hb2 .ops-hb-bar { animation: none; }

/* 高分段条(B 播客):28px,块内印占比(放得下才印),块序图例只列名 */
.ops-segbig { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; height: 100%; }
.ops-seg.is-big { height: 28px; border-radius: 0; gap: 2px; }
.ops-seg.is-big .ops-seg-p { display: flex; align-items: center; min-width: 3px; border-radius: 3px; overflow: visible; }
.ops-seg.is-big .ops-seg-p b { padding-left: 7px; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.ops-segbig .ops-legend { gap: 4px 10px; }

.ops-donut-wrap { position: relative; flex: none; }
.ops-donut-wrap .ops-donut { width: 100%; height: 100%; max-height: none; }
.ops-donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; }
.ops-donut-cn { font-size: 17px; font-weight: 600; line-height: 20px; letter-spacing: -0.02em; color: var(--dorami-ink); }
.ops-donut-cl { font-size: 12px; line-height: 14px; color: var(--dorami-faint); }

/* ── 共用:非基线风格的数字一律比例数字(大号独立数字用 tabular 会显松,dataviz 规范);标签不带解释 ── */
:root:not([data-look="base"]) .ops-home .ops-kpi-num { font-variant-numeric: proportional-nums lining-nums; }
:root:not([data-look="base"]) .ops-home .ops-kpi { cursor: default; }
:root:not([data-look="base"]) .ops-home .ops-mrow > .ops-tile-chart.is-donut,
:root:not([data-look="base"]) .ops-home .ops-mrow > .ops-tile-chart.is-segbig { flex: 1; display: flex; align-items: center; justify-content: flex-end; min-height: 0; min-width: 0; }
:root:not([data-look="base"]) .ops-home .ops-mrow > .ops-tile-chart.is-segbig { display: block; }

/* ══ A · 精修 —— shadcn / Tremor 口径:标签在上、数字在下的 KPI 列(细分隔线),单系列强调末柱,BarList ══ */
:root[data-look="a"] .ops-home .ops-tile:not(.is-s) { padding: 18px 20px 16px; }
:root[data-look="a"] .ops-home :is(.ops-tile-name, .ops-status .card-title) { font-size: 14px; font-weight: 600; color: var(--dorami-ink-2); }
:root[data-look="a"] .ops-home .ops-tile-icon { width: 15px; height: 15px; color: var(--dorami-faint); }
:root[data-look="a"] .ops-home .ops-win { height: auto; padding: 0; background: none; color: var(--dorami-faint); }
:root[data-look="a"] .ops-home .ops-kpis { display: grid; grid-template-columns: minmax(0, 1.55fr) repeat(3, minmax(0, 1fr)); align-items: start; gap: 0; margin-top: 16px; }
:root[data-look="a"] .ops-home .ops-kpis .ops-kpi { flex-direction: column; align-items: flex-start; gap: 4px; padding-left: 16px; border-left: 1px solid var(--dorami-border-soft); }
:root[data-look="a"] .ops-home .ops-kpis .ops-kpi:first-child { padding-left: 0; border-left: 0; }
:root[data-look="a"] .ops-home .ops-kpi-lbl { order: -1; font-size: 12px; line-height: 16px; color: var(--dorami-muted); }
:root[data-look="a"] .ops-home .ops-kpi.is-hero .ops-kpi-lbl { font-size: 12px; }
:root[data-look="a"] .ops-home .ops-kpis .ops-kpi.is-hero .ops-kpi-num { font-size: 40px; line-height: 44px; letter-spacing: -0.03em; }
:root[data-look="a"] .ops-home .ops-kpis .ops-kpi:not(.is-hero) .ops-kpi-num { font-size: 22px; line-height: 28px; letter-spacing: -0.02em; color: var(--dorami-ink); padding-bottom: 2px; }
:root[data-look="a"] .ops-home .ops-tile-chart { margin-top: 18px; }
:root[data-look="a"] .ops-home .ops-mrow { align-items: stretch; margin-top: 10px; }
:root[data-look="a"] .ops-home .ops-mrow > .ops-kpi { flex-direction: column; align-items: flex-start; align-self: flex-end; gap: 4px; }
:root[data-look="a"] .ops-home .ops-mrow > .ops-kpi.is-hero .ops-kpi-num { font-size: 32px; line-height: 36px; letter-spacing: -0.025em; }
:root[data-look="a"] .ops-home .ops-srt-num .ops-kpi.is-hero .ops-kpi-num { font-size: 20px; letter-spacing: -0.02em; }
:root[data-look="a"] .ops-home .ops-chart text { fill: var(--dorami-faint); }


/* ══ B · 仪表 —— Geist / Grafana 口径:平卡细边、标题是小号标签、等宽数字、墨色单色图、细线排行 ══ */
:root[data-look="b"] .ops-home .ops-tile { border: 1px solid var(--dorami-border); box-shadow: none; border-radius: 10px; background: var(--dorami-card-solid); }
:root[data-look="b"] .ops-home .ops-tile[data-tile]:hover { box-shadow: none; border-color: color-mix(in oklab, var(--dorami-ink) 38%, transparent); }
:root[data-look="b"] .ops-home .ops-tile:not(.is-s) { padding: 14px 16px 14px; }
:root[data-look="b"] .ops-home .ops-tile-icon { display: none; }
:root[data-look="b"] .ops-home :is(.ops-tile-name, .ops-status .card-title) { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--dorami-muted); }
:root[data-look="b"] .ops-home .ops-tile.is-s .ops-tile-name { font-size: 12px; }
:root[data-look="b"] .ops-home .ops-win { height: auto; padding: 0; background: none; color: var(--dorami-faint); }
:root[data-look="b"] .ops-home .ops-donut-cn { font-family: var(--font-mono); }
:root[data-look="b"] .ops-home .ops-kpi-num, :root[data-look="b"] .ops-home .ops-pend-num, :root[data-look="b"] .ops-home .ops-count,
:root[data-look="b"] .ops-home .ops-hb-val, :root[data-look="b"] .ops-home .ops-chart text, :root[data-look="b"] .ops-home .ops-donut-num { font-family: var(--font-mono); letter-spacing: -0.03em; }
:root[data-look="b"] .ops-home .ops-chart text { letter-spacing: 0; }
:root[data-look="b"] .ops-home .ops-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch; gap: 0; margin: 14px -16px 0; border-top: 1px solid var(--dorami-border); border-bottom: 1px solid var(--dorami-border); }
:root[data-look="b"] .ops-home .ops-kpis .ops-kpi { flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; padding: 12px 16px; border-left: 1px solid var(--dorami-border); }
:root[data-look="b"] .ops-home .ops-kpis .ops-kpi:first-child { border-left: 0; }
:root[data-look="b"] .ops-home .ops-kpi-lbl { order: -1; font-size: 12px; color: var(--dorami-faint); }
:root[data-look="b"] .ops-home .ops-kpis .ops-kpi.is-hero .ops-kpi-num { font-size: 32px; line-height: 36px; }
:root[data-look="b"] .ops-home .ops-kpis .ops-kpi:not(.is-hero) .ops-kpi-num { font-size: 32px; line-height: 36px; font-weight: 400; color: var(--dorami-ink); }
:root[data-look="b"] .ops-home .ops-kpi.is-stamp .ops-kpi-num { font-size: 32px; }
:root[data-look="b"] .ops-home .ops-tile-chart { margin-top: 14px; }
:root[data-look="b"] .ops-home .ops-mrow { flex-direction: column; gap: 12px; margin-top: 12px; }
:root[data-look="b"] .ops-home .ops-mrow > .ops-kpi { flex-direction: column; align-items: flex-start; align-self: flex-start; gap: 4px; }
:root[data-look="b"] .ops-home .ops-mrow > .ops-kpi.is-hero .ops-kpi-num { font-size: 28px; line-height: 32px; }
:root[data-look="b"] .ops-home .ops-mrow > .ops-tile-chart { flex: 1; width: 100%; min-height: 40px; }
:root[data-look="b"] .ops-home .ops-srt-num .ops-kpi.is-hero .ops-kpi-num { font-size: 18px; }
:root[data-look="b"] .ops-home .ops-dots { border-top-style: solid; }

/* ══ C · 刊物 —— 哆啦美读者面的编辑部气质:衬线数字与宋体标题、顶部墨线分栏、无阴影、选择性直标 ══ */
/* 开放式版面(借 Tremor 模板 / Plausible):不画卡框、不用阴影、圆角 0;每块只留顶部墨线,块间距放宽到 28px 让白来分隔 */
:root[data-look="c"] .ops-home .ops-bento { column-gap: 28px; row-gap: 22px; }
:root[data-look="c"] .ops-home .ops-tile { border-radius: 0; box-shadow: none; border: 0; border-top: 2px solid var(--dorami-ink); background: transparent; }
:root[data-look="c"] .ops-home .ops-tile[data-tile]:hover { box-shadow: none; transform: none; border-top-color: var(--dorami-accent); }
:root[data-look="c"] .ops-home .ops-tile[data-tile]:hover .ops-tile-name { color: var(--dorami-accent-ink); }
:root[data-look="c"] .ops-home .ops-tile:not(.is-s) { padding: 12px 0 4px; }
:root[data-look="c"] .ops-home .ops-tile.is-s { padding: 0; border-top-width: 1px; border-top-color: var(--dorami-border-strong); }
:root[data-look="c"] .ops-home .ops-tile.is-s[data-tile]:hover { border-top-color: var(--dorami-accent); }
:root[data-look="c"] .ops-home .ops-tile-icon { display: none; }
:root[data-look="c"] .ops-home :is(.ops-tile-name, .ops-status .card-title) { font-family: var(--font-serif); font-size: 17px; font-weight: 600; letter-spacing: 0.02em; color: var(--dorami-ink); }
:root[data-look="c"] .ops-home .ops-tile.is-s .ops-tile-name { font-size: 15px; }
:root[data-look="c"] .ops-home .ops-win { height: auto; padding: 0; background: none; color: var(--dorami-faint); }
:root[data-look="c"] .ops-home .ops-kpi-num, :root[data-look="c"] .ops-home .ops-donut-num, :root[data-look="c"] .ops-home .ops-hb-val, :root[data-look="c"] .ops-home .ops-hb-rank, :root[data-look="c"] .ops-home .ops-pend-num { font-family: var(--font-serif-latin); letter-spacing: -0.005em; }
:root[data-look="c"] .ops-home .ops-kpis { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); align-items: end; gap: 0; margin-top: 12px; }
:root[data-look="c"] .ops-home .ops-kpis .ops-kpi { flex-direction: column; align-items: flex-start; gap: 2px; padding-left: 16px; border-left: 1px solid var(--dorami-border); }
:root[data-look="c"] .ops-home .ops-kpis .ops-kpi:first-child { padding-left: 0; border-left: 0; }
:root[data-look="c"] .ops-home .ops-kpi-lbl { font-size: 12px; color: var(--dorami-muted); }
:root[data-look="c"] .ops-home .ops-kpis .ops-kpi.is-hero .ops-kpi-num { font-size: 54px; line-height: 54px; }
:root[data-look="c"] .ops-home .ops-kpis .ops-kpi:not(.is-hero) .ops-kpi-num { font-size: 26px; line-height: 30px; color: var(--dorami-ink); }
:root[data-look="c"] .ops-home .ops-tile-chart { margin-top: 16px; }
:root[data-look="c"] .ops-home .ops-mrow { align-items: stretch; }
:root[data-look="c"] .ops-home .ops-mrow > .ops-kpi { flex-direction: column; align-items: flex-start; align-self: flex-end; gap: 2px; }
:root[data-look="c"] .ops-home .ops-mrow > .ops-kpi.is-hero .ops-kpi-num { font-size: 40px; line-height: 42px; }
:root[data-look="c"] .ops-home .ops-srt-num .ops-kpi.is-hero .ops-kpi-num { font-size: 24px; }
:root[data-look="c"] .ops-home .ops-donut-cn { font-family: var(--font-serif-latin); font-size: 20px; letter-spacing: 0; }
:root[data-look="c"] .ops-home .ops-hb-rank { font-size: 15px; }
:root[data-look="c"] .ops-home .ops-hb-val { font-size: 15px; }

/* ══ D · 大字 —— Stripe / Plausible 口径:超大主角数字、安静页头、图表无坐标贴卡底、次级数字收成右侧小表 ══ */
:root[data-look="d"] .ops-home .ops-tile { border-radius: 18px; }
:root[data-look="d"] .ops-home .ops-tile:not(.is-s) { padding: 18px 22px 0; }
:root[data-look="d"] .ops-home .ops-tile.ops-status { padding-bottom: 14px; }
:root[data-look="d"] .ops-home .ops-tile-icon { display: none; }

const TODAY = '2026-11-03';

function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function isoDay(offset) {
  const d = new Date(Date.UTC(2026, 10, 3));
  d.setUTCDate(d.getUTCDate() - offset);
  return d.toISOString().slice(0, 10);
}
function weekday(iso) { return new Date(`${iso}T00:00:00Z`).getUTCDay(); }

  const days = Array.from({ length: N }, (_, i) => isoDay(N - 1 - i));
  const isWknd = days.map((d) => [0, 6].includes(weekday(d)));
  const wk = isWknd.map((w) => (w ? 0.55 : 1));
  const today = N - 1;
  const partial = 0.62; // 今天只过了大半天
  const scale = (i) => (i === today ? partial : 1);

  const dau = days.map((_, i) => Math.round((18 + r() * 9) * wk[i] * scale(i)));
  const logins = dau.map((v) => Math.round(v * (1.25 + r() * 0.2)));
  const reads = days.map((_, i) => Math.round((150 + r() * 70) * wk[i] * scale(i)));
  const guestVisitors = days.map((_, i) => Math.round((3 + r() * 6) * (0.8 + 0.2 * wk[i]) * scale(i)));
  const guestVisits = guestVisitors.map((v) => v + Math.round(v * r() * 0.9));
  const guestConv = guestVisitors.map((v) => (r() < 0.16 && v > 3 ? 1 : 0));
  const newAccounts = days.map(() => { const x = r(); return x < 0.05 ? 2 : x < 0.27 ? 1 : 0; });

  // AI:日 × 用途(calls / tokens),只含有调用的格(与 by_day_purpose 同形;前端补零)
  const aiCalls = days.map((_, i) => AI_PURPOSES.map((p) => {
    const f = isWknd[i] ? p.wk : 1;
    const jitter = 0.78 + r() * 0.44;
    const raw = p.base * f * jitter * scale(i);
    return p.base < 2 ? (r() < raw / Math.max(1, Math.ceil(p.base)) ? Math.max(1, Math.round(raw)) : 0) : Math.round(raw);
  }));
  const aiTokens = aiCalls.map((row) => row.map((c, j) => Math.round(c * AI_PURPOSES[j].tok * (0.85 + r() * 0.3))));

  const HIST_P = [0.009, 0.028, 0.061, 0.122, 0.196, 0.255, 0.2, 0.101, 0.026, 0.002];

  const media = Array.from({ length: 140 }, (_, k) => {
    const day = isoDay(139 - k);
    const w = [0, 6].includes(weekday(day)) ? 0.6 : 1;
    const articles = Math.round((128 + r() * 46) * w * (k === 139 ? partial : 1));
    const images = Math.round(articles * (1.1 + r() * 0.35));
    const x = r();
    const rate = x < 0.05 ? 0.35 + r() * 0.2 : x < 0.16 ? 0.62 + r() * 0.25 : 0.92 + r() * 0.08;
    const cached = Math.min(images, Math.round(images * rate));
    const failed = x < 0.16 ? Math.round((images - cached) * (0.3 + r() * 0.4)) : (r() < 0.22 ? Math.ceil(r() * 3) : 0);
    const failedC = Math.min(images - cached, failed);
    return { date: day, articles, images_total: images, cached, failed: failedC, pending: images - cached - failedC };
  });

/* ── 样页图表(内联 SVG / HTML;实装映射见 README「图表映射」):
   逐日计数 = 离散柱(MultiSeriesBars)· 账户增长 = 阶梯线(AccountGrowth)· 排行 = 横条(RankBars / BarList)
   · 分布 = 整数档直方图(ScoreHistogram)· 覆盖率 = 热点格(MediaHeatmap,功能页)· 构成 = 分段条 · 进度 = 环 / 计量条。
   所有图共用一个悬停浮层(#ops-tip):日期 → 按图例固定顺序的系列 → 单位,数字右对齐等宽。
   mini = 首页 M 磁贴的同行小图(无坐标轴文字,只留基线);柱 / 条带 .ops-bar + --i(首帧自底生长,错峰 ≤ 150ms)。 ── */
const TIPS = {};
const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const md = (iso) => iso.slice(5);
const dayHead = (iso) => `${md(iso)} ${WEEK[new Date(`${iso}T00:00:00Z`).getUTCDay()]}${iso === TODAY ? ' · 今天' : ''}`;
const stag = (i, n) => Math.round((n > 1 ? i / (n - 1) : 0) * 150);
function niceCeil(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 3 ? 3 : f <= 4 ? 4 : f <= 5 ? 5 : 10) * p;
}
const axisFmt = (v) => (v >= 1e6 ? `${+(v / 1e6).toFixed(1)}M` : v >= 1e4 ? `${Math.round(v / 1e3)}k` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(+v.toFixed(1)));
function tickIdx(n, iw, minGap = 58) {
  if (n <= 1) return [0];
  const fit = Math.max(2, Math.floor(iw / minGap));
  if (n <= fit) return Array.from({ length: n }, (_, i) => i);
  const k = Math.min(fit, 4);
  return Array.from({ length: k }, (_, j) => Math.round((j * (n - 1)) / (k - 1)));
}
/* 第四版:画风参数随首页风格(LK())走;功能页图表不跟(仍是 v3 画法,实装时随选定方向统一) */
const mixc = (c, p, base = 'var(--dorami-card-solid)') => `color-mix(in oklab, ${c} ${p}%, ${base})`;
const ACC = 'var(--dorami-accent)'; const INKC = 'var(--dorami-ink)';
const GEO = { base: { cap: 8, rad: 0, ratio: 0.62 }, a: { cap: 10, rad: 3, ratio: 0.6 }, b: { cap: 7, rad: 1, ratio: 0.55 }, c: { cap: 5, rad: 1.5, ratio: 0.5 }, d: { cap: 14, rad: 4, ratio: 0.66 } };
const geoOf = (home) => (home ? GEO[S.look] : GEO.base);
// 单系列柱的逐柱色:强调型风格 = 末根(今天)用强色、其余退一档;solid = 原色
function barTone(kind, i, n, fallback) {
  const last = i === n - 1;
  if (kind === 'emph') return last ? ACC : mixc(ACC, 42);
  if (kind === 'ink') return last ? 'var(--dorami-ink-2)' : mixc(INKC, 26);
  if (kind === 'inkEmph') return last ? ACC : mixc(INKC, 30);
  if (kind === 'wash') return last ? ACC : mixc(ACC, 28);
  return fallback;
}
// 柱:顶端圆角、基线方角
function colPath(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  if (!rr) return `M${x.toFixed(1)},${(y + h).toFixed(1)}V${y.toFixed(1)}H${(x + w).toFixed(1)}V${(y + h).toFixed(1)}Z`;
  return `M${x.toFixed(1)},${(y + h).toFixed(1)}V${(y + rr).toFixed(1)}q0,-${rr.toFixed(1)} ${rr.toFixed(1)},-${rr.toFixed(1)}H${(x + w - rr).toFixed(1)}q${rr.toFixed(1)},0 ${rr.toFixed(1)},${rr.toFixed(1)}V${(y + h).toFixed(1)}Z`;
}
// 纵轴:left = 左侧刻度 3 线(v3);right = 右侧刻度 半 / 满 + 基线;right4 = 右侧 5 线;base = 只留基线;none = 不画
function yGutters(mode, compact) {
  if (mode === 'left') return { L: compact ? 30 : 42, R: 2 };
  if (mode === 'right' || mode === 'right4') return { L: 0, R: 34 };
  return { L: 0, R: 0 };
}
function yGrid(mode, { L, R, w, Y, max, fmtv = axisFmt }) {
  const line = (v) => `<line class="ops-gl" x1="${L}" x2="${w - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
  if (mode === 'left') return [0, max / 2, max].map((v) => `${line(v)}<text x="${L - 7}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtv(v)}</text>`).join('');
  if (mode === 'right' || mode === 'right4') {
    let vs = [0, max / 2, max];
    if (mode === 'right4') { const step = niceCeil(max / 4); vs = []; for (let v = 0; v <= max + 1e-9; v += step) vs.push(v); }
    return vs.map((v) => `${line(v)}${v ? `<text x="${w - R + 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="start">${fmtv(v)}</text>` : ''}`).join('');
  }
  if (mode === 'base') return `<line class="ops-gl is-base" x1="${L}" x2="${w - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
  return '';
}
function xTicks(mode, { n, iw, L, R, w, h, X, label }) {
  if (mode === 'none') return '';
  if (mode === 'ends') return n > 1 ? `<text x="${L}" y="${h - 4}" text-anchor="start">${label(0)}</text><text x="${w - R}" y="${h - 4}" text-anchor="end">${label(n - 1)}</text>` : '';
  return tickIdx(n, iw).map((i) => `<text x="${X(i).toFixed(1)}" y="${h - 4}" text-anchor="middle">${label(i)}</text>`).join('');
}
function cursorRect(id, T, ih) { return `<rect class="ops-cur" data-cur="${id}" x="0" y="${T}" width="0" height="${ih}"/>`; }

/* 逐日堆叠离散柱:o = { id, days[], keys[], colors[], m[day][series], unit, compact, mini, total } */
function stackBars(el, o) {
  const w = Math.max(72, el.clientWidth); const h = Math.max(40, el.clientHeight);
  const mini = Boolean(o.mini); const home = Boolean(o.home);
  const lk = home ? LK() : LOOKS.base; const gm = geoOf(home);
  const axis = mini ? 'mini' : lk.axis;
  const gut = mini ? { L: 0, R: 0 } : yGutters(axis, o.compact);
  const L = gut.L; const R = gut.R;
  const xt = mini ? 'none' : lk.xt;
  const T = mini ? 3 : axis === 'base' ? 18 : axis === 'none' ? 4 : 8; const B = mini ? 1 : xt === 'none' ? 2 : 20;
  const iw = w - L - R; const ih = h - T - B; const n = o.days.length;
  const sums = o.m.map((row) => row.reduce((a, b) => a + b, 0));
  const max = mini || axis === 'base' || axis === 'none' ? Math.max(1, ...sums) : niceCeil(Math.max(1, ...sums));
  const Y = (v) => T + ih - (v / max) * ih;
  const slot = iw / n; const bw = Math.max(1, Math.min(mini ? Math.min(gm.cap, 6) : gm.cap, slot * gm.ratio));
  const rad = mini ? Math.min(gm.rad, 1.5) : gm.rad;
  const single = o.keys.length === 1;
  const grid = mini
    ? `<line class="ops-gl" x1="${L}" x2="${w - R}" y1="${(T + ih).toFixed(1)}" y2="${(T + ih).toFixed(1)}"/>`
    : yGrid(axis, { L, R, w, Y, max });
  let bars = ''; let hits = '';
  const geo = [];
  o.days.forEach((day, i) => {
    const x = L + i * slot + (slot - bw) / 2;
    let acc = 0;
    let col = '';
    const topJ = o.m[i].reduce((t, v, j) => (v ? j : t), -1);
    o.m[i].forEach((v, j) => {
      if (!v) return;
      const y0 = Y(acc); const y1 = Y(acc + v);
      const hh = Math.max(0.8, y0 - y1 - (acc > 0 ? 1 : 0));
      const fill = single ? barTone(lk.bars, i, n, o.colors[j]) : o.colors[j];
      col += j === topJ && rad ? `<path d="${colPath(x, y1, bw, hh, rad)}" fill="${fill}"/>` : `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${fill}"/>`;
      acc += v;
    });
    // 一天一组:整组一起自底生长(堆叠段不各自错峰)
    if (col) bars += `<g class="ops-bar" style="--i:${stag(i, n)}">${col}</g>`;
    if (!sums[i]) bars += `<rect x="${(x + bw / 2 - 1).toFixed(1)}" y="${(T + ih - 2).toFixed(1)}" width="2" height="2" rx="1" fill="var(--dorami-border-strong)"/>`;
    if (o.dots && o.dots[i]) bars += `<circle cx="${(x + bw / 2).toFixed(1)}" cy="${(Y(sums[i]) - 8).toFixed(1)}" r="4" fill="var(--state-ok)" stroke="var(--dorami-surface)" stroke-width="2"/>`;
    hits += `<rect class="ops-hit" x="${(L + i * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${o.id}|${i}"/>`;
    geo.push({ x: L + i * slot, w: slot });
  });
  const ticks = xTicks(xt, { n, iw, L, R, w, h, X: (i) => L + (i + 0.5) * slot, label: (i) => md(o.days[i]) });
  // base 轴(刊物):不画刻度,改为选择性直标——峰值与末值各标一次
  let direct = '';
  if (axis === 'base' && single) {
    const iMax = sums.indexOf(Math.max(...sums));
    const lab = (i, cls = '') => `<text class="is-ink${cls}" x="${(L + (i + 0.5) * slot).toFixed(1)}" y="${(Y(sums[i]) - 6).toFixed(1)}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${fmt(sums[i])}</text>`;
    direct = lab(iMax) + (iMax !== n - 1 ? lab(n - 1) : '');
  }
  TIPS[o.id] = {
    kind: 'col', geo,
    rows: o.days.map((day, i) => ({
      head: dayHead(day), unit: o.unit,
      items: [...o.keys.map((k, j) => ({ name: k, color: o.colors[j], value: o.m[i][j] })), ...(o.dots ? [{ name: '当日登录(转化)', color: 'var(--state-ok)', value: o.dots[i] }] : [])],
      total: o.keys.length > 1 ? sums[i] : null,
    })),
  };
  return `<svg class="ops-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || '')}">${grid}${cursorRect(o.id, T, ih)}${bars}${direct}${ticks}${hits}</svg>`;
}

/* 阶梯线(累计账户,只在有人加入的那天抬一阶):o = { id, days[], news[], start, labels, compact } */
function stepLine(el, o) {
  const w = Math.max(160, el.clientWidth); const h = Math.max(64, el.clientHeight);
  const lk = o.home ? LK() : LOOKS.base;
  const axis = lk.axis; const xt = lk.xt;
  const gut = axis === 'left' ? { L: o.compact ? 34 : 44, R: o.labels ? 24 : 8 } : yGutters(axis, o.compact);
  const L = gut.L; const R = axis === 'none' || axis === 'base' ? 6 : gut.R; const T = o.labels ? 22 : axis === 'base' ? 18 : 10; const B = xt === 'none' ? 4 : 20;
  const stroke = lk.step === 'ink' ? 'var(--dorami-ink-2)' : 'var(--dorami-blue)';
  const iw = w - L - R; const ih = h - T - B; const n = o.days.length;
  let t = o.start; const tot = o.news.map((v) => (t += v));
  const lo = Math.max(0, o.start - 1); const hi = tot[n - 1] + 1;
  const Y = (v) => T + ih - ((v - lo) / Math.max(1, hi - lo)) * ih;
  const slot = iw / n; const X = (i) => L + (i + 0.5) * slot;
  let d = `M${L},${Y(o.start).toFixed(1)}`;
  tot.forEach((v, i) => { d += `H${X(i).toFixed(1)}V${Y(v).toFixed(1)}`; });
  d += `H${(L + iw).toFixed(1)}`;
  const mid = Math.round((lo + hi) / 2);
  const line = (v) => `<line class="ops-gl" x1="${L}" x2="${w - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
  const grid = axis === 'left' ? [...new Set([lo, mid, hi])].map((v) => `${line(v)}<text x="${L - 7}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join('')
    : axis === 'right' || axis === 'right4' ? [...new Set([lo, mid, hi])].map((v) => `${line(v)}<text x="${w - R + 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="start">${v}</text>`).join('')
      : axis === 'base' ? `<line class="ops-gl is-base" x1="${L}" x2="${w - R}" y1="${(T + ih).toFixed(1)}" y2="${(T + ih).toFixed(1)}"/><text class="is-ink" x="${(w - R).toFixed(1)}" y="${(Y(tot[n - 1]) - 8).toFixed(1)}" text-anchor="end">${tot[n - 1]}</text>` : '';
  const joins = o.news.map((v, i) => [v, i]).filter(([v]) => v > 0);
  const showLbl = o.labels && joins.length <= Math.floor(iw / 30);
  const dots = joins.map(([v, i]) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(tot[i]).toFixed(1)}" r="3.5" fill="var(--dorami-surface)" stroke="${stroke}" stroke-width="1.6"/>${showLbl ? `<text class="is-ink" x="${(X(i) + 6).toFixed(1)}" y="${(Y(tot[i]) - 8).toFixed(1)}">+${v}</text>` : ''}`).join('');
  const ticks = xTicks(xt, { n, iw, L, R, w, h, X, label: (i) => md(o.days[i]) });
  const area = lk.step === 'wash' ? `<path d="${d}V${(T + ih).toFixed(1)}H${L}Z" fill="color-mix(in oklab, var(--dorami-accent) 12%, transparent)" stroke="none"/>` : '';
  const hits = o.days.map((_, i) => `<rect class="ops-hit" x="${(L + i * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${o.id}|${i}"/>`).join('');
  TIPS[o.id] = {
    kind: 'xhair', geo: o.days.map((_, i) => ({ cx: X(i), cy: Y(tot[i]) })),
    rows: o.days.map((day, i) => ({ head: dayHead(day), unit: '个', items: [{ name: '累计账户', color: stroke, value: tot[i], line: true }, { name: '当日新增', value: o.news[i] }] })),
  };
  return `<svg class="ops-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || '账户增长')}">${grid}${area}<line class="ops-xhair" data-xhair="${o.id}" x1="0" x2="0" y1="${T}" y2="${T + ih}"/><path d="${d}" fill="none" stroke="${stroke}" stroke-width="${o.home && S.look !== 'base' ? 2 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>${dots}<circle class="ops-xdot" data-xdot="${o.id}" r="4" cx="0" cy="0" fill="${stroke}" stroke="var(--dorami-surface)" stroke-width="2"/>${ticks}${hits}</svg>`;
}

/* 新闻价值分整数档直方图:o = { id, counts[10], p50, compact, mini } —— 柱色复用分数分档(灰线 6.0 以下 faint,其上按档向 accent-ink 混);P50 标线常在 */
const TIER_MIX = [100, 100, 100, 100, 100, 85, 60, 30, 0, 0];
const tierColor = (b) => (TIER_MIX[b] === 100 ? 'var(--chart-other)' : `color-mix(in oklab, var(--chart-other) ${TIER_MIX[b]}%, var(--dorami-accent-ink))`);
function histTone(kind, b, p50b) {
  if (kind === 'emph') return mixc(ACC, [18, 18, 20, 24, 30, 40, 55, 72, 88, 100][b]);
  if (kind === 'ink') return b === p50b ? 'var(--dorami-ink-2)' : mixc(INKC, 26);
  if (kind === 'inkEmph') return b === p50b ? ACC : mixc(INKC, 30);
  if (kind === 'wash') return b === p50b ? ACC : mixc(ACC, 28);
  return tierColor(b);
}
function histogram(el, o) {
  const w = Math.max(72, el.clientWidth); const h = Math.max(40, el.clientHeight);
  const mini = Boolean(o.mini);
  const kind = o.home ? LK().hist : 'tier'; const p50b = Math.min(9, Math.max(0, Math.floor(o.p50) - 1)); const gm = geoOf(o.home);
  const L = mini || o.compact ? 2 : 42; const R = 2; const T = mini ? (w >= 150 ? 16 : 6) : 18; const B = mini ? 1 : 20;
  const iw = w - L - R; const ih = h - T - B;
  const total = o.counts.reduce((a, b) => a + b, 0);
  const max = mini || o.compact ? Math.max(1, ...o.counts) : niceCeil(Math.max(1, ...o.counts));
  const Y = (v) => T + ih - (v / max) * ih;
  const slot = iw / 10; const bw = Math.min(mini || o.compact ? (o.home && S.look !== 'base' ? 14 : 16) : 24, slot * (o.home && S.look !== 'base' ? 0.6 : 0.66));
  const grid = mini || o.compact ? `<line class="ops-gl" x1="${L}" x2="${w - R}" y1="${T + ih}" y2="${T + ih}"/>`
    : [0, max / 2, max].map((v) => `<line class="ops-gl" x1="${L}" x2="${w - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L - 7}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${axisFmt(v)}</text>`).join('');
  let bars = ''; let hits = ''; const geo = [];
  o.counts.forEach((v, b) => {
    const x = L + b * slot + (slot - bw) / 2;
    const y = Y(v); const hh = Math.max(v ? 1.5 : 0, T + ih - y);
    const rr = Math.min(o.home && S.look !== 'base' ? Math.max(1, gm.rad) : 3, hh, bw / 2);
    // 柱顶圆角、基线方角
    if (hh > 0) bars += `<path class="ops-bar" style="--i:${stag(b, 10)}" d="M${x.toFixed(1)},${(T + ih).toFixed(1)}V${(y + rr).toFixed(1)}q0,-${rr.toFixed(1)} ${rr.toFixed(1)},-${rr.toFixed(1)}H${(x + bw - rr).toFixed(1)}q${rr.toFixed(1)},0 ${rr.toFixed(1)},${rr.toFixed(1)}V${(T + ih).toFixed(1)}Z" fill="${histTone(kind, b, p50b)}"/>`;
    hits += `<rect class="ops-hit" x="${(L + b * slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih + B}" data-tip="${o.id}|${b}"/>`;
    geo.push({ x: L + b * slot, w: slot });
  });
  const lbls = mini ? '' : o.counts.map((_, b) => `<text x="${(L + (b + 0.5) * slot).toFixed(1)}" y="${h - 4}" text-anchor="middle">${b + 1}</text>`).join('');
  const px = L + (o.p50 - 1) * slot;
  const p50 = `<line class="ops-mark-line" x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${T - 3}" y2="${T + ih}"/>${!mini || w >= 150 ? `<text class="is-ink" x="${(px - 4).toFixed(1)}" y="${T - 5}" text-anchor="end">P50</text>` : ''}`;
  TIPS[o.id] = {
    kind: 'col', geo,
    rows: o.counts.map((v, b) => ({ head: `${b + 1} 分档`, unit: '篇', items: [{ name: '文章', color: histTone(kind, b, p50b), value: v }, { name: '占比', value: total ? `${((v / total) * 100).toFixed(1)}%` : '0%', raw: true }] })),
  };
  return `<svg class="ops-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="新闻价值分布">${grid}${cursorRect(o.id, T, ih)}${bars}${p50}${lbls}${hits}</svg>`;
}

/* 媒体热点格(功能页;近 N 周,一格一天;深浅 = 缓存覆盖率四档,右上切角 = 当日有下载失败,两条通道正交) */
function heatLevel(day) {
  if (!day || !day.articles) return null;
  if (!day.images_total) return 0;
  const rate = day.cached / day.images_total;
  return rate === 0 ? 1 : rate < 0.5 ? 2 : rate < 0.9 ? 3 : 4;
}
function heatGrid(el, o) {
  const w = Math.max(120, el.clientWidth); const h = Math.max(48, el.clientHeight);
  const gap = 2; const T = o.compact ? 0 : 16;
  const cell = Math.max(6, Math.min(12, Math.floor((h - T - gap * 6) / 7)));
  const weeksFit = Math.floor((w + gap) / (cell + gap));
  const byDate = new Map(o.days.map((d) => [d.date, d]));
  const today = new Date(`${TODAY}T00:00:00Z`);
  const end = new Date(today); end.setUTCDate(end.getUTCDate() + (6 - today.getUTCDay()));
  const weeks = Math.min(weeksFit, Math.ceil(o.days.length / 7));
  const gridW = weeks * (cell + gap) - gap;
  const x0 = Math.max(0, w - gridW);
  let cells = ''; const rows = []; let k = 0; let months = ''; let lastM = -1;
  for (let wi = 0; wi < weeks; wi += 1) {
    for (let dow = 0; dow < 7; dow += 1) {
      const dt = new Date(end); dt.setUTCDate(end.getUTCDate() - ((weeks - 1 - wi) * 7 + (6 - dow)));
      if (dt > today) continue;
      const iso = dt.toISOString().slice(0, 10);
      const day = byDate.get(iso);
      const lvl = heatLevel(day);
      const x = x0 + wi * (cell + gap); const y = T + dow * (cell + gap);
      if (dow === 0 && !o.compact && dt.getUTCMonth() !== lastM) { lastM = dt.getUTCMonth(); months += `<text x="${x}" y="11">${lastM + 1}月</text>`; }
      cells += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="${lvl == null ? 'var(--heat-empty)' : `var(--heat-${lvl})`}" data-tip="${o.id}|${k}" class="ops-cell"/>`;
      if (day && day.failed) cells += `<path d="M${x + cell - 5},${y}H${x + cell - 2}q2,0 2,2V${y + 5}Z" fill="var(--state-warn)" pointer-events="none"/>`;
      rows.push(day ? { head: dayHead(iso), unit: '', items: [{ name: '文章', value: day.articles }, { name: '图片', value: day.images_total }, { name: '已缓存', value: day.cached, color: 'var(--heat-4)' }, { name: '下载失败', value: day.failed, color: day.failed ? 'var(--state-warn)' : '' }, { name: '未抓取', value: day.pending }] } : { head: dayHead(iso), unit: '', items: [{ name: '当日无文章入库', value: '', raw: true }] });
      k += 1;
    }
  }
  TIPS[o.id] = { kind: 'self', rows };
  return `<svg class="ops-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="媒体热点图">${months}${cells}</svg>`;
}

/* 横向排行条(HTML):o = { id, rows: [[name, value]], color, unit, total, fill | dense | loose } */
function hbars(o) {
  const max = Math.max(1, ...o.rows.map((r) => r[1]));
  const n = o.rows.length;
  TIPS[o.id] = { kind: 'self', rows: o.rows.map(([name, v, color]) => ({ head: name, unit: o.unit, items: [{ name: o.metric, color: color || o.color, value: v }, ...(o.total ? [{ name: '占比', value: `${((v / o.total) * 100).toFixed(1)}%`, raw: true }] : [])] })) };
  const cls = o.fill ? ' is-fill' : o.dense ? ' is-dense' : o.loose ? ' is-loose' : '';
  const mode = o.home ? LK().hb : 'classic';
  if (mode === 'classic') return `<div class="ops-hb${cls}" role="list">${o.rows.map(([name, v, color], i) => `<div class="ops-hb-row" role="listitem" data-tip="${o.id}|${i}"><span class="ops-hb-name" title="${esc(name)}">${esc(name)}</span><span class="ops-hb-track"><span class="ops-hb-bar" style="width:${Math.max(1.5, (v / max) * 100).toFixed(1)}%; background:${color || o.color}; --i:${stag(i, n)}"></span></span><span class="ops-hb-val">${o.fmt ? o.fmt(v) : fmt(v)}</span></div>`).join('')}</div>`;
  return `<div class="ops-hb${cls} ops-hb2 is-${mode}" role="list">${o.rows.map(([name, v], i) => `<div class="ops-hb-row" role="listitem" data-tip="${o.id}|${i}"><span class="ops-hb-rank">${i + 1}</span><span class="ops-hb-track"><span class="ops-hb-bar" style="width:${Math.max(2, (v / max) * 100).toFixed(1)}%; --i:${stag(i, n)}"></span></span><span class="ops-hb-name" title="${esc(name)}">${esc(name)}</span><span class="ops-hb-val">${o.fmt ? o.fmt(v) : fmt(v)}</span></div>`).join('')}</div>`;
}

/* 分段条(一个整体分成几份;极小段按 3px 下限画,数值以浮层为准;首页不画图例,hover 段显示名称与数) */
function segBar(o) {
  const total = o.parts.reduce((a, p) => a + p.value, 0);
  TIPS[o.id] = { kind: 'self', rows: o.parts.map((p) => ({ head: p.name, unit: o.unit, items: [{ name: '数量', color: p.color, value: p.value }, { name: '占比', value: `${((p.value / total) * 100).toFixed(1)}%`, raw: true }, ...(p.detail || [])] })) };
  const shown = o.parts.filter((p) => p.value > 0);
  if (o.big) {
    const w = o.width || 240;
    const blocks = shown.map((p, i) => { const share = p.value / total; const fits = share * w >= 40; return `<span class="ops-seg-p" style="flex-grow:${p.value}; background:${p.color}; --i:${stag(i, shown.length)}" data-tip="${o.id}|${o.parts.indexOf(p)}">${fits ? `<b style="color:${p.ink || '#fff'}">${Math.round(share * 100)}%</b>` : ''}</span>`; }).join('');
    const lg = shown.map((p) => `<span class="ops-lg">${p.key === 'failed' ? '<i class="ops-mark is-bad"></i>' : `<i style="background:${p.color}"></i>`}${esc(p.name)}</span>`).join('');
    return `<div class="ops-segbig"><div class="ops-seg is-big" role="img" aria-label="${esc(o.parts.map((p) => `${p.name} ${p.value}`).join(','))}">${blocks}</div><div class="ops-legend">${lg}</div></div>`;
  }
  return `<div class="ops-seg ${o.tall ? 'is-tall' : ''}" role="img" aria-label="${esc(o.parts.map((p) => `${p.name} ${p.value}`).join(','))}">${shown.map((p, i) => `<span class="ops-seg-p" style="flex-grow:${p.value}; background:${p.color}; --i:${stag(i, shown.length)}" data-tip="${o.id}|${o.parts.indexOf(p)}"></span>`).join('')}</div>`;
}

/* 环图(首页播客 M,v3.1 由分段条改):外径 100 / 环宽 14 的 SVG,段间 2.2° 缝、极小段 2.4° 下限(数值以浮层为准);
   中心标总数;不画图例,hover 段高亮(其余段淡出)+ 浮层 */
function donut(o) {
  const total = o.parts.reduce((a, p) => a + p.value, 0) || 1;
  TIPS[o.id] = { kind: 'self', rows: o.parts.map((p) => ({ head: p.name, unit: o.unit, items: [{ name: '数量', color: p.color, value: p.value }, { name: '占比', value: `${((p.value / total) * 100).toFixed(1)}%`, raw: true }, ...(p.detail || [])] })) };
  const SW = o.sw || 14; const R = 50 - SW / 2 - 1; const C = 2 * Math.PI * R; const GAP = SW <= 6 ? 3 : 2.2; const MIN = 2.4;
  const shown = o.parts.filter((p) => p.value > 0);
  const angs = shown.map((p) => Math.max(MIN, (p.value / total) * 360));
  const over = angs.reduce((a, b) => a + b, 0) - 360;
  if (over > 0) angs[angs.indexOf(Math.max(...angs))] -= over;
  let start = 0;
  const segs = shown.map((p, i) => {
    const a = angs[i]; const len = Math.max(0.6, ((a - GAP) / 360) * C); const off = -((start + GAP / 2) / 360) * C;
    start += a;
    return `<circle class="ops-donut-p" cx="50" cy="50" r="${R}" fill="none" stroke="${p.color}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--i:${stag(i, shown.length)}" data-tip="${o.id}|${o.parts.indexOf(p)}"/>`;
  }).join('');
  const aria = esc(o.parts.map((p) => `${p.name} ${p.value}`).join(','));
  if (o.stack) {
    const size = Math.max(72, Math.round(o.size || 140));
    return `<div class="ops-donut-wrap" style="width:${size}px; height:${size}px"><svg class="ops-donut" viewBox="0 0 100 100" role="img" aria-label="${aria}"><g transform="rotate(-90 50 50)">${segs}</g></svg>${o.total != null ? `<div class="ops-donut-c"><span class="ops-donut-cn">${fmt(o.total)}</span><span class="ops-donut-cl">${esc(o.totalLabel || '')}</span></div>` : ''}</div>`;
  }
  const center = o.total == null ? '' : `<text class="ops-donut-num" x="50" y="50" text-anchor="middle" dominant-baseline="central">${fmt(o.total)}${o.totalUnit ? `<tspan class="ops-donut-unit" dx="2">${esc(o.totalUnit)}</tspan>` : ''}</text>`;
  return `<svg class="ops-donut" viewBox="0 0 100 100" preserveAspectRatio="xMaxYMid meet" role="img" aria-label="${esc(o.parts.map((p) => `${p.name} ${p.value}`).join(','))}"><g transform="rotate(-90 50 50)">${segs}</g>${center}</svg>`;
}

/* 进度环(功能页:今日读者预算) */
function ring(ratio, { size = 56, stroke = 6, tone = '' } = {}) {
  const r = (size - stroke) / 2; const c = 2 * Math.PI * r; const f = Math.min(1, ratio);
  return `<svg class="ops-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="color-mix(in oklab, var(--dorami-accent) 14%, transparent)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${tone === 'warn' ? 'var(--state-warn)' : 'var(--dorami-accent)'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

/* 计量条:parts = [[ratio, color, name]] 依次铺开,其余为轨 */
function meter(parts, label = '') {
  return `<div class="ops-meter" role="img" aria-label="${esc(label)}">${parts.map(([ratio, color]) => `<span style="width:${Math.max(0, Math.min(100, ratio * 100)).toFixed(1)}%; background:${color}"></span>`).join('')}</div>`;
}

/* 浮层:悬停 [data-tip] 的图元 / 数字时出现;图元贴指针、出界翻面;数字锚在其下方(data-tip-anchor)。
   行可带 s(数据来源键,spec「数据来源 显」时出小标)与 tone(warn) */
function tipHtml(row) {
  const items = row.items.map((it) => `<div class="ops-tip-row${it.value === 0 ? ' is-zero' : ''}${it.tone ? ` is-${it.tone}` : ''}"><span class="ops-tip-name">${it.color ? `<i style="background:${it.color}"></i>` : '<i class="is-none"></i>'}${esc(it.name)}${it.s ? src(it.s) : ''}</span><span class="ops-tip-val">${it.raw ? esc(it.value) : fmt(it.value)}</span></div>`).join('');
  const total = row.total != null ? `<div class="ops-tip-row is-total"><span class="ops-tip-name"><i class="is-none"></i>合计</span><span class="ops-tip-val">${fmt(row.total)}</span></div>` : '';
  return `<div class="ops-tip-head"><span>${esc(row.head)}</span>${row.unit ? `<span class="ops-tip-unit">${esc(row.unit)}</span>` : ''}</div>${items}${total}`;
}

/* ══ 第四版:首页风格方向(只换卡片内部排版、字体与图表画风;栅格、磁贴大小、信息取舍全部沿用 v3.1) ══
   每个方向 = 一组 CSS(:root[data-look] 下的 ops-home 作用域)+ 下面这组图表参数;中性色是产品现有设置,切风格时跟随推荐。 */
const LOOKS = {
  base: { label: '基线', palette: 'porcelain', bars: 'solid', axis: 'left', xt: 'auto', hb: 'classic', ai: 'cat', pod: 'donut', ring: 14, hist: 'tier', step: 'accent' },

const Q = new URLSearchParams(location.search);

  root: Q.get('view') !== 'admin',

  pending: Q.get('pending') !== '0',
  src: Q.get('src') === '1',
  motion: Q.get('motion') === 'reduce', // 应用内「减少动效」开关(<html data-motion="reduce">)
  spec: Q.get('spec') !== '0' && Q.get('spec') !== 'none',
  pill: Q.get('spec') !== 'none',
  days: [7, 14, 30, 90].includes(Number(Q.get('days'))) ? Number(Q.get('days')) : 30,
  look: LOOKS[Q.get('look')] ? Q.get('look') : 'a',   // 第四版:首页风格方向(基线 = v3.1 原样)
  palette: ['porcelain', 'graphite', 'paper'].includes(Q.get('pal')) ? Q.get('pal') : null, // 产品现有「设置 → 外观 → 中性色」;null = 跟随风格的推荐
  sw: { ai: true, newdefault: true, ondemand: true, share: true, usrc: true, guest: true, guestAi: false, analysis: true, digest: true },
  reader: { metric: Q.get('rm') === 'tokens' ? 'tokens' : 'calls', dim: Q.get('rd') === 'user' ? 'user' : 'purpose' },
  acct: { q: '', role: '', status: '', ai: '', sort: 'username', order: 'asc', page: 1, sel: new Set(), top: 'reads' },
  pod: { stage: '', verdict: '', tts: '' },
  drawer: null,
  route: { page: null, block: null },
};
function syncQuery() {
  const q = new URLSearchParams();
  if (S.theme === 'dark') q.set('theme', 'dark');
  if (!S.root) q.set('view', 'admin');
  if (!S.agg) q.set('agg', '0');
  if (!S.pending) q.set('pending', '0');
  if (S.src) q.set('src', '1');
  if (S.motion) q.set('motion', 'reduce');
  if (S.days !== 30) q.set('days', String(S.days));
  if (S.look !== 'a') q.set('look', S.look);
  if (S.palette) q.set('pal', S.palette);
  if (S.reader.metric !== 'calls') q.set('rm', S.reader.metric);
  if (S.reader.dim !== 'purpose') q.set('rd', S.reader.dim);
  if (!S.spec) q.set('spec', S.pill ? '0' : 'none');
  const qs = q.toString();
  history.replaceState(null, '', `${location.pathname}${qs ? `?${qs}` : ''}${location.hash}`);
}

/* ── 示意数据按时间窗切片 ── */
function aiWin(d) {
  const calls = D.series.aiCalls.slice(-d).map((r) => r.slice());
  const tokens = D.series.aiTokens.slice(-d).map((r) => r.slice());
  // 今天读者用途按「今日已用」对齐(同一份数据喂预算与柱)
  const li = d - 1;
  const rj = AI_PURPOSES.map((p, j) => (p.reader ? j : -1)).filter((j) => j >= 0);
  const f = A().aiUsed / Math.max(1, sum(rj.map((j) => tokens[li][j])));
  rj.forEach((j) => { tokens[li][j] = Math.round(tokens[li][j] * f); calls[li][j] = Math.round(calls[li][j] * f); });
  const tot = (m) => sum(m.map(sum));
  const readerOf = (m) => sum(m.map((r) => sum(rj.map((j) => r[j]))));
  const totalTokens = tot(tokens);
  return { days: D.lastN(D.days, d), calls, tokens, rj, totalCalls: tot(calls), totalTokens, readerCalls: readerOf(calls), readerTokens: readerOf(tokens), prompt: Math.round(totalTokens * 0.78), completion: totalTokens - Math.round(totalTokens * 0.78) };
}
const SLOT_MEM = new Map();
function colorFor(ns, name) {
  if (name === '其它') return 'var(--chart-other)';
  let m = SLOT_MEM.get(ns);
  if (!m) { m = new Map(); SLOT_MEM.set(ns, m); }
  if (!m.has(name)) m.set(name, m.size % 6);
  return `var(--chart-${m.get(name) + 1})`;
}
// 按用途:Top 6 + 其它(同 pivotDaily);按用户:后端已裁成 Top 6 + 其它(BY_DAY_USER_TOP_N)
function aiSeries(aw, metric, dim) {
  const M = metric === 'calls' ? aw.calls : aw.tokens;
  if (dim === 'user') {
    const names = D.aiUserShare.map(([n]) => n);
    const r = mulberry(metric === 'calls' ? 7 : 8);
    const m = M.map((row) => {
      const t = sum(row);
      const parts = D.aiUserShare.map(([, s]) => Math.round(t * s * (0.8 + r() * 0.4)));
      return [...parts, Math.max(0, t - sum(parts))];
    });
    const keys = [...names, '其它'];
    return { keys, colors: keys.map((k) => colorFor(`ai-${metric}:user`, k)), m, totals: keys.map((_, j) => sum(m.map((row) => row[j]))) };
  }
  const totals = AI_PURPOSES.map((_, j) => sum(M.map((row) => row[j])));
  const ranked = totals.map((v, j) => [v, j]).filter(([v]) => v > 0).sort((a, b) => b[0] - a[0]);
  const top = ranked.slice(0, 6).map(([, j]) => j);
  const hasOther = ranked.length > 6;
  const keys = [...top.map((j) => AI_PURPOSES[j].name), ...(hasOther ? ['其它'] : [])];
  const m = M.map((row) => [...top.map((j) => row[j]), ...(hasOther ? [sum(row) - sum(top.map((j) => row[j]))] : [])]);
  return { keys, colors: keys.map((k) => colorFor(`ai-${metric}:purpose`, k)), m, ranked, totals: keys.map((_, j) => sum(m.map((row) => row[j]))) };
}
function growthWin(d) {
  const news = D.lastN(D.series.newAccounts, d);
  return { days: D.lastN(D.days, d), news, start: D.accounts.total - sum(news), added: sum(news) };
}
function histWin(d) {
  const total = D.sumLast(D.series.analysed, d);
  return { total, counts: D.HIST_P.map((p) => Math.round(total * p)) };
}
function guestWin(d) {
  const sr = D.series;
  const visitors = D.lastN(sr.guestVisitors, d);
  return { days: D.lastN(D.days, d), visitors, conv: D.lastN(sr.guestConv, d), uniq: sum(visitors) - Math.round(d * 0.4), visits: D.sumLast(sr.guestVisits, d) };
}
// 窗口内各源阅读 Top 5(需聚合,仅根;非根或无聚合端点时退回累计 Top 5,与主角同窗)
const topWindowed = () => S.agg && S.root;
function readTop(d, k = 5) {
  if (!topWindowed()) return D.content.top.slice(0, k).map(([n, v]) => [n, v]);
  const share = D.sumLast(D.series.reads, d) / D.content.reads;
  const r = mulberry(200 + d);
  return D.content.top.slice(0, Math.min(D.content.top.length, k + 1)).map(([n, v]) => [n, Math.round(v * share * (0.75 + r() * 0.5))]).sort((a, b) => b[1] - a[1]).slice(0, k);
}

let toastTimer = 0;
function toast(msg, type = 'info') {
  const bg = type === 'success' ? 'bg-emerald-600' : 'bg-slate-800 dark:bg-slate-900';
  const ic = type === 'success' ? 'circle-check' : 'info';
  const el = $('#toast');
  el.innerHTML = `<div class="toast-pop fixed left-1/2 z-[200] flex w-max max-w-[90vw] items-center gap-3 rounded-[var(--r-card)] py-3.5 pl-5 pr-3 text-white shadow-2xl ${bg}" role="status">${icon(ic, 'h-5 w-5 shrink-0')}<span class="text-sm font-semibold">${esc(msg)}</span><button type="button" class="shrink-0 rounded-[var(--r-sm)] p-1 text-white/70 transition-colors hover:bg-white/15 hover:text-white" aria-label="关闭" data-act="toast-x">${icon('x', 'h-4 w-4')}</button></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, 2600);
}
