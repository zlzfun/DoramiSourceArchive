<!doctype html>
<html lang="zh-CN" class="ui-pre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>哆啦美 · 登录 — 方向 D 透镜</title>
<meta name="description" content="登录页重设计样页 · 方向 D「透镜」:失焦的文字场上,一枚液态玻璃透镜替你看清。">
<meta name="theme-color" content="#eceef1">
<script src="../shared/sample-kit.js"></script>
<link rel="stylesheet" href="../../../../frontend/public/fonts/dorami-serif-v1/dorami-serif.css">
<link rel="stylesheet" href="../../../../frontend/public/fonts/dorami-latin-v1/dorami-latin.css">
<style>
  :root {
    /* 珍珠 / 银灰:底色与阅读器「瓷」中性色同族(#f4f6f9),只压暗半档、带一点珠母虹彩 */
    --pearl: #eceef1;
    --reader: #f4f6f9;
    --ink: #161922;
    --ink-2: #3c4048;
    --muted: #555a64;          /* 珍珠底 6.2:1 */
    --faint: #686c76;          /* 占位文字,白底 5.3:1 */
    --hair: rgba(22, 25, 34, .10);
    --indigo: #5252c5;         /* 品牌墨靛:只给 CTA、焦点环、「看清」两个字 */
    --indigo-hi: #6f6bd7;
    --indigo-ink: #4745b3;
    --err: #b42330;            /* 珍珠底 5.6:1 */
    --focus: rgba(82, 82, 197, .32);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --serif: "Dorami Serif", "Songti SC", "Microsoft YaHei UI", "Microsoft YaHei", serif;
    --latin: "Dorami Latin Serif", "Dorami Serif", Georgia, serif;
    --out: cubic-bezier(.22, 1, .36, 1);
    --gut: clamp(28px, 3.4vw, 56px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--pearl) radial-gradient(120% 90% at 12% 0%, #f3f2f2 0%, rgba(243, 242, 242, 0) 55%);
    color: var(--ink);
    font: 400 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ── 舞台:WebGL 全屏画布(文字场 + 题词 + 透镜) ── */
  .stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; visibility: hidden; }
  #gl.ready { visibility: visible; }

  /* ── 降级路径(无 WebGL):DOM 透镜 = 圆形裁切 + 放大的清晰副本 + CSS 玻璃边 ── */
  .fb { position: absolute; inset: 0; overflow: hidden; }
  .fb canvas { position: absolute; left: 0; top: 0; }
  .fb-blur { filter: blur(3.4px); transform: scale(1.01); }
  .fb-shadow { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform;
    background: radial-gradient(closest-side, rgba(22, 25, 34, .16), rgba(22, 25, 34, .07) 60%, rgba(22, 25, 34, 0)); }
  .fb-lens { position: absolute; left: 0; top: 0; overflow: hidden; will-change: transform, width, height;
    box-shadow: 0 2px 4px rgba(22, 25, 34, .08), 0 22px 44px -18px rgba(22, 25, 34, .32); }
  .fb-lens canvas { transform-origin: 0 0; }
  .fb-sharp { transition: filter .45s var(--out); }
  .fb-lens.fog .fb-sharp { filter: blur(9px); }
  .fb-glass, .fb-fog, .fb-caus { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .fb-glass {
    background:
      radial-gradient(70% 45% at 30% 14%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%),
      radial-gradient(closest-side, rgba(255, 255, 255, 0) 80%, rgba(255, 255, 255, .22) 92%, rgba(255, 255, 255, .6) 100%);
    box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .95), inset 0 -1px 2px rgba(22, 25, 34, .22),
      inset 3px 0 6px -2px rgba(63, 123, 246, .28), inset -3px 0 6px -2px rgba(139, 82, 244, .26),
      inset 0 0 22px rgba(255, 255, 255, .35);
  }
  .fb-fog { background: rgba(244, 245, 248, .62); opacity: 0; transition: opacity .45s var(--out); }
  .fb-lens.fog .fb-fog { opacity: 1; }
  .fb-caus { opacity: 0; transition: opacity .3s; mix-blend-mode: soft-light;
    background: conic-gradient(from 0deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .9), rgba(139, 82, 244, .4), rgba(63, 123, 246, .4), rgba(255, 255, 255, 0) 60%); }
  .fb-lens.caus .fb-caus { opacity: 1; animation: fb-spin 1.6s linear infinite; }
  @keyframes fb-spin { to { transform: rotate(1turn); } }

  /* ── 品牌角标 ── */
  .brand { position: fixed; left: var(--gut); top: clamp(22px, 3.4vh, 34px); z-index: 2; display: flex; align-items: center; gap: 12px; }
  .brand-mark { position: relative; width: 34px; height: 34px; flex: none; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 1.5px rgba(22, 25, 34, .22), 0 8px 18px -8px rgba(47, 34, 120, .55), inset 0 0 0 .5px rgba(255, 255, 255, .3); }
  .brand-mark img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .32s ease; }
  .mark-shy { opacity: 0; }
  html.shy .mark-shy { opacity: 1; }
  html.shy .mark-open { opacity: 0; }
  .brand-cn { font: 600 19px/1 var(--serif); letter-spacing: .06em; color: var(--ink); }
  .brand-sep { width: 1px; height: 14px; background: rgba(22, 25, 34, .22); }
  .brand-en { font: italic 400 16px/1 var(--latin); color: var(--muted); letter-spacing: .01em; }

  /* ── 题词槽:位置由 CSS 决定,字由画布画(好让透镜折射它),这里只留无障碍文本 ── */
  .hero { position: fixed; z-index: 1; margin: 0; pointer-events: none;
    left: var(--gut); top: 50%; width: min(46vw, 640px); height: 300px; transform: translateY(-56%); }

  /* ── 登录表单:静止时没有卡片,直接排在纸面上;聚焦时透镜吸附到它身后,像嵌在玻璃里 ── */
  .auth { position: fixed; z-index: 3; right: calc(var(--gut) + clamp(0px, 4vw, 72px)); top: 50%; width: 348px; transform: translateY(-50%); }
  .form { margin: 0; position: relative; will-change: transform; }
  .greet { margin: 0 0 10px; font: 600 13px/1.2 var(--sans); letter-spacing: .08em; color: var(--muted); }
  .greet b { font-weight: 600; color: var(--indigo-ink); }
  .title { margin: 0; font: 600 34px/1.18 var(--serif); letter-spacing: .02em; color: var(--ink); }
  .sub { margin: 8px 0 26px; font: 400 14px/1.6 var(--sans); color: var(--muted); }
  .field { display: grid; gap: 8px; margin-bottom: 14px; }
  .field label { font: 600 13px/1 var(--sans); letter-spacing: .06em; color: var(--ink-2); }
  .field input {
    width: 100%; height: 48px; padding: 0 16px; margin: 0;
    font: 400 15px/1 var(--sans); color: var(--ink);
    background: rgba(255, 255, 255, .80);
    border: 1px solid rgba(22, 25, 34, .11); border-radius: 14px;
    box-shadow: inset 0 1px 2px rgba(22, 25, 34, .06), 0 1px 0 rgba(255, 255, 255, .8);
    outline: none; -webkit-appearance: none; appearance: none;
    transition: border-color .2s ease, box-shadow .25s ease, background-color .25s ease;
  }
  .field input::placeholder { color: var(--faint); opacity: 1; }
  .field input:hover { border-color: rgba(22, 25, 34, .2); }
  .field input:focus-visible, .field input:focus {
    background: #fff; border-color: rgba(82, 82, 197, .7);
    box-shadow: 0 0 0 4px var(--focus), inset 0 1px 2px rgba(22, 25, 34, .05);
  }
  .field input[aria-invalid="true"] { border-color: rgba(180, 35, 48, .55); }
  .err { height: 20px; margin: 0 0 12px; font: 400 13px/20px var(--sans); color: var(--err); }
  .submit {
    position: relative; width: 100%; height: 50px; margin: 0; padding: 0; border: 0; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 600 15px/1 var(--sans); letter-spacing: .18em; text-indent: .18em; color: #fff;
    background: var(--indigo);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(30, 28, 100, .25),
      0 1px 2px rgba(40, 38, 120, .28), 0 12px 26px -12px rgba(71, 69, 179, .7);
    transition: transform .18s ease, background-color .18s ease, box-shadow .25s ease;
    overflow: hidden;
  }
  .submit::after { /* 玻璃反光:只在悬停时掠过一次 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .26) 48%, rgba(255, 255, 255, 0) 64%);
    transform: translateX(-110%);
  }
  .submit:hover { background: #4b4bbe; transform: translateY(-1px); }
  .submit:hover::after { transform: translateX(110%); transition: transform .9s var(--out); }
  .submit:active { transform: translateY(0); background: var(--indigo-ink); }
  .submit:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
  .submit[disabled] { cursor: progress; }
  .spin { display: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; }
  html.loading .spin { display: block; }
  @keyframes spin { to { transform: rotate(1turn); } }

  /* ── 角落一行:真实的本地日期 / 时间 / 时区 ── */
  .meta { position: fixed; z-index: 2; right: var(--gut); bottom: clamp(18px, 3vh, 28px); margin: 0;
    font: 400 12px/1.4 var(--sans); letter-spacing: .08em; color: var(--muted); display: flex; gap: 14px; }
  .meta span + span::before { content: "·"; margin-right: 14px; color: rgba(22, 25, 34, .3); }

  /* ── 成功落幅 ── */
  .landing { position: fixed; inset: 0; z-index: 40; background: var(--reader); opacity: 0; visibility: hidden; pointer-events: none;
    display: flex; align-items: flex-end; padding: 0 var(--gut) clamp(20px, 4vh, 36px); transition: opacity .6s ease, visibility 0s linear .6s; }
  .landing.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .6s ease; }
  .landing p { margin: 0; font: 400 12px/1.4 var(--sans); letter-spacing: .1em; color: var(--muted); }

  /* ── 开场:界面元素从「失焦」对上焦(同一隐喻) ── */
  html.ui-pre [data-ui] { opacity: 0; transform: translateY(10px); filter: blur(7px); }
  html.ui-in [data-ui] { opacity: 1; transform: none; filter: blur(0);
    transition: opacity .9s var(--out), transform 1.1s var(--out), filter .9s var(--out);
    transition-delay: calc(var(--i, 0) * 70ms); }
  html.ui-instant [data-ui] { transition: none !important; }
  html[data-motion="reduce"] [data-ui] { transition: none !important; }
  html[data-motion="reduce"] .submit::after { display: none; }
  html[data-motion="reduce"] .spin { animation-duration: 2.4s; }
  html[data-motion="reduce"] .fb-lens.caus .fb-caus { animation: none; }

  /* ── 成功离场:界面先失焦淡出(写在开场规则之后,优先级更高) ── */
  html.leaving [data-ui], html.leaving .auth { opacity: 0; filter: blur(6px);
    transition: opacity .38s ease, filter .38s ease, transform .5s var(--out); transition-delay: 0s; }
  html.leaving .auth { transform: translateY(-50%) scale(.97); }
  html[data-motion="reduce"].leaving [data-ui], html[data-motion="reduce"].leaving .auth { filter: none; transform: translateY(-50%); transition: opacity .2s ease; }

  /* ── 手机:单列;透镜在题词区缓慢自走,聚焦时吸附到表单 ── */
  @media (max-width: 720px) {
    body { overflow: auto; }
    .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom)); }
    .brand { position: relative; left: auto; top: auto; }
    .hero { position: relative; left: auto; top: auto; transform: none; width: 100%; height: auto; flex: 1 1 auto; min-height: 210px; margin: 6px 0 4px; }
    .auth { position: relative; right: auto; top: auto; width: 100%; transform: none; }
    html.leaving .auth { transform: scale(.97); }
    html[data-motion="reduce"].leaving .auth { transform: none; }
    .title { font-size: 28px; }
    .sub { margin-bottom: 20px; }
    .meta { position: relative; right: auto; bottom: auto; margin-top: 26px; justify-content: center; }
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <canvas id="gl"></canvas>
  <div id="fb" class="fb" hidden></div>
</div>

<div class="page">
  <header class="brand" data-ui style="--i:0">
    <span class="brand-mark">
      <img class="mark-open" src="../../../../frontend/public/brand/dorami-logo-128.png" alt="" width="34" height="34">
      <img class="mark-shy" src="../../../../frontend/public/brand/dorami-logo-cover-eyes-128.png" alt="" width="34" height="34">
    </span>
    <span class="brand-cn">哆啦美</span>
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-en" lang="en">Dorami</span>
  </header>

  <h1 id="hero" class="hero"><span class="vh">信息如潮，替你看清。Everything worth reading, brought into focus.</span></h1>

  <main class="auth">
    <form id="form" class="form" novalidate>
      <p class="greet" data-ui style="--i:1"><span id="greet">你好</span></p>
      <h2 class="title" data-ui style="--i:2">欢迎回来</h2>
      <p class="sub" data-ui style="--i:3">登录哆啦美，继续今天的阅读。</p>
      <div class="field" data-ui style="--i:4">
        <label for="u">账号</label>
        <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入账号" required>
      </div>
      <div class="field" data-ui style="--i:5">
        <label for="p">密码</label>
        <input id="p" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
      </div>
      <p id="err" class="err" role="alert" aria-live="assertive"></p>
      <button id="submit" class="submit" type="submit" data-ui style="--i:6"><span class="spin" aria-hidden="true"></span><span id="submit-label">登录</span></button>
    </form>
  </main>

  <p class="meta" data-ui style="--i:7" aria-label="本地日期与时间"><span id="meta-date"></span><span id="meta-time"></span><span id="meta-tz"></span></p>
</div>

<div id="landing" class="landing" aria-live="polite"><p>样页到此 · 实际会进入阅读器</p></div>

<script src="lens.js"></script>
</body>
</html>
