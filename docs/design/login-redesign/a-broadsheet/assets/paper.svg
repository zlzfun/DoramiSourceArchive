<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- 新闻纸纹理:细颗粒 + 横向纤维,stitchTiles 保证平铺无缝 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.30  0 0 0 0 0.25  0 0 0 0 0.17  0 0 0 0.11 -0.02"/>
  </filter>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.16" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0.16 -0.06"/>
  </filter>
  <rect width="360" height="360" filter="url(#fiber)"/>
  <rect width="360" height="360" filter="url(#grain)"/>
</svg>
