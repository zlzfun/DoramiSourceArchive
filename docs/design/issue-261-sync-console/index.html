@layer components {
  .ops-bento {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
    grid-template-rows: minmax(300px, 1.58fr) minmax(190px, 1fr) 56px;
    height: max(578px, calc(100vh - 130px));
    height: max(578px, calc(100dvh - 130px));
  }
  .ops-bento > .t-accounts {
    grid-column: 1 / span 7;
    grid-row: 1;
  }
  .ops-bento > .t-reading {
    grid-column: 8 / span 5;
    grid-row: 1;
  }
  .ops-bento > .t-reader {
    grid-column: 1 / span 3;
    grid-row: 2;
  }
  .ops-bento > .t-podcast {
    grid-column: 4 / span 3;
    grid-row: 2;
  }
  .ops-bento > .t-analysis {
    grid-column: 7 / span 3;
    grid-row: 2;
  }
  .ops-bento > .t-status {
    grid-column: 10 / span 3;
    grid-row: 2 / span 2;
  }
  .ops-bento > .t-external {
    grid-column: 1 / span 3;
    grid-row: 3;
  }
  .ops-bento > .t-usrc {
    grid-column: 4 / span 3;
    grid-row: 3;
  }
  .ops-bento > .t-inbox {
    grid-column: 7 / span 3;
    grid-row: 3;
  }
  .ops-tile {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: 18px 20px 16px;
    border-radius: var(--r-card);
    transition: box-shadow var(--motion-fast) var(--motion-ease), transform var(--motion-fast) var(--motion-ease);
  }
  .ops-tile:has(.ops-tile-name:focus-visible) {
    box-shadow: var(--sh-2), 0 0 0 2px var(--dorami-focus);
  }
  .ops-tile-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    min-height: 22px;
    flex: none;
  }
  .ops-tile-icon {
    width: 15px;
    height: 15px;
    flex: none;
    color: var(--dorami-faint);
  }
  .ops-tile-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    outline: none;
    font-size: 14px;
    color: var(--dorami-ink-2);
  }
  .ops-tile-name::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }
  .ops-status-title {
    font-size: 14px;
    color: var(--dorami-ink-2);
  }
  .ops-tile-meta {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .ops-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--dorami-faint);
    font-variant-numeric: tabular-nums;
  }
  .ops-tile-dot {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    flex: none;
    cursor: help;
  }
  .ops-mark {
    display: inline-block;
    width: 8px;
    height: 7px;
    flex: none;
    background: var(--state-warn);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .ops-mark.is-bad {
    width: 7px;
    height: 7px;
    clip-path: none;
    transform: rotate(45deg);
    background: var(--state-bad);
  }
  .ops-kpi {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    min-width: 0;
    white-space: nowrap;
    border-radius: 4px;
  }
  .ops-kpi-lbl {
    font-size: 12px;
    line-height: 16px;
    color: var(--dorami-muted);
    transition: color var(--motion-fast) var(--motion-ease);
  }
  .ops-kpi-num {
    font-size: 22px;
    line-height: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--dorami-ink);
    font-variant-numeric: tabular-nums;
  }
  .ops-kpi-num small {
    margin-left: 3px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--dorami-muted);
  }
  .ops-kpi-num.is-warn {
    color: var(--state-warn);
  }
  .ops-kpi.is-hero .ops-kpi-num {
    font-size: 40px;
    line-height: 44px;
    letter-spacing: -0.03em;
  }
  .ops-okdot {
    display: inline-block;
    width: 7px;
    height: 7px;

    border-radius: var(--r-pill);

    vertical-align: 0.2em;

  .ops-okdot.is-warn {
    background: var(--state-warn);
  }
  .ops-okdot.is-run {
    background: var(--state-run);

  .ops-tile.is-s {

    gap: 12px;
    padding: 0 16px;

    min-height: 0;

    overflow-y: auto;

    padding: 0 6px;
    margin: 0 -6px;
    border-radius: var(--r-control);

    overflow: hidden;

    white-space: nowrap;
  }
  .ops-pend-num {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ops-pend.is-bad .ops-pend-num {
    color: var(--state-bad);
  }
  .ops-pend.is-warn .ops-pend-num {
    color: var(--state-warn);
  }
  .ops-pend > svg {
    width: 14px;
    height: 14px;
    flex: none;
    color: var(--dorami-faint);
    transition: transform var(--motion-fast) var(--motion-ease), color var(--motion-fast) var(--motion-ease);
  }
  .ops-crumb {

    align-items: center;
    gap: 6px;
    min-width: 0;

  .ops-crumb-root {
    font: inherit;
    color: var(--dorami-faint);

  .ops-crumb-sep {
    width: 18px;
    height: 18px;
    flex: none;
    color: var(--dorami-faint);
  }
  .ops-crumb-cur {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: -2px -6px;
    padding: 2px 6px;
    border-radius: var(--r-control);
    font: inherit;
    color: var(--dorami-ink);
  }
  .ops-crumb-cur svg {
    width: 18px;
    height: 18px;
    color: var(--dorami-muted);
  }
  .ops-pop {
    position: absolute;
    z-index: 70;
    padding: 6px;
    border-radius: var(--r-card);
    background: var(--dorami-surface);
    border: 1px solid var(--dorami-border);
    box-shadow: var(--sh-3);
    animation: ops-pop-in var(--motion-fast) var(--motion-ease);

  @keyframes ops-pop-in {

    .ops-crumb-cur:hover {

    }

<style>/* ══════════════════════════════════════════════════════════════════════
   issue #261 节点同步 · 样页新增类
   sync-* / pl-* / lg-* / cmp-* / rs-* = 实装时会进 index.css 的产品类
   spec-* = 样页辅助 chrome(spec 栏、数据来源角标),实装不要
   只用 token,不写 hex;字重 400 / 600;字号 ≥ 12px;不做首帧生长动画。
   ══════════════════════════════════════════════════════════════════════ */

/* ── 样页壳:spec 栏占顶,产品整体下移 --spec-h ── */
:root { --spec-h: 0px; }
body { background: var(--dorami-canvas); }
.app-rail { top: var(--spec-h); }
.spec-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 95;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  min-height: 40px; padding: 6px 14px;
  background: var(--dorami-ink); color: var(--dorami-surface);
  font-size: 12px; font-weight: 400; line-height: 1.2;
}
.spec-title { font-weight: 600; margin-right: 4px; white-space: nowrap; }
.spec-group { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.spec-name { color: color-mix(in oklab, var(--dorami-surface) 72%, transparent); }
.spec-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--dorami-surface) 14%, transparent); }
.spec-btn { min-height: 22px; padding: 0 7px; border-radius: 4px; font-size: 12px; color: color-mix(in oklab, var(--dorami-surface) 80%, transparent); }
.spec-btn:hover:not(.is-on) { color: var(--dorami-surface); }
.spec-btn.is-on { background: var(--dorami-surface); color: var(--dorami-ink); }
.spec-btn:focus-visible { outline: 2px solid var(--dorami-surface); outline-offset: 1px; }
.spec-hide { margin-left: auto; }
.spec-pill {
  position: fixed; right: 14px; bottom: 14px; z-index: 95;
  min-height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--dorami-ink); color: var(--dorami-surface); font-size: 12px; box-shadow: var(--sh-2);
}
.spec-bar[hidden], .spec-pill[hidden] { display: none; }
/* 数据来源角标:只标「需聚合 / 需新增」;关掉即最终观感 */
.spec-src {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-left: 6px;
  border: 1px dashed currentColor; border-radius: 4px;
  font-size: 12px; font-weight: 400; line-height: 1; white-space: nowrap; vertical-align: middle;
  font-family: var(--font-sans); font-variant-numeric: normal; letter-spacing: 0; text-transform: none; cursor: help;
}
.spec-src.is-agg { color: var(--state-warn); }
.spec-src.is-add { color: var(--state-bad); }
.spec-cap { margin-top: 8px; font-size: 12px; color: var(--dorami-faint); text-align: center; }

/* ── 页头(节点同步变体):左 = 面包屑 + 对端身份一行;右 = 动作 + 定时,各两行,顶对齐 ── */
.sync-head { align-items: flex-start; gap: 24px; }
.sync-head-l { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.sync-head-l > .page-title { min-height: 32px; }
.sync-head-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.sync-acts { display: flex; align-items: center; gap: 8px; }
.sync-acts .icon-button svg { width: 16px; height: 16px; }
.sync-acts .icon-button[aria-expanded="true"] { background: var(--dorami-soft); color: var(--dorami-ink); }
.sync-peer { display: flex; align-items: center; min-width: 0; min-height: 32px; font-size: 12px; line-height: 16px; color: var(--dorami-muted); white-space: nowrap; }
.sync-peer-i { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; }
.sync-peer-i + .sync-peer-i { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--dorami-border); }
.sync-role + .sync-peer-i { margin-left: 12px; }
.sync-peer-k { color: var(--dorami-faint); }
.sync-peer-v { color: var(--dorami-ink-2); font-variant-numeric: tabular-nums; }
.sync-peer-v.is-mono, .is-mono { font-family: var(--font-mono); }
.sync-peer-i[title] { cursor: help; }
@media (hover: hover) { .sync-peer-i[title]:hover .sync-peer-v { text-decoration: underline dotted; text-underline-offset: 3px; } }
.sync-role {
  display: inline-flex; align-items: center; gap: 5px; align-self: center; height: 22px; padding: 0 8px 0 6px;
  border-radius: var(--r-pill); background: var(--dorami-well); color: var(--dorami-ink-2); font-size: 12px; font-weight: 600;
}
.sync-role svg { width: 13px; height: 13px; color: var(--dorami-muted); }
.sync-role.is-none { color: var(--dorami-muted); font-weight: 400; }
.sync-sched { gap: 8px; color: var(--dorami-muted); font-weight: 400; transition: background var(--motion-fast) var(--motion-ease); }
.sync-sched svg { width: 14px; height: 14px; color: var(--dorami-faint); }
.sync-sched b { font-family: var(--font-sans); font-weight: 600; color: var(--dorami-ink-2); }
.sync-sched .tabular-nums { font-variant-numeric: tabular-nums; }
@media (hover: hover) { .sync-sched:hover { background: var(--dorami-soft); color: var(--dorami-ink-2); } }
.sync-sched[aria-expanded="true"] { background: var(--dorami-soft); }
.sync-spin { animation: sync-spin 1s linear infinite; }
@keyframes sync-spin { to { transform: rotate(360deg); } }
.action-button-primary:disabled { opacity: 0.55; cursor: default; }
.action-button-secondary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.action-button-primary.is-busy:disabled { opacity: 1; background: color-mix(in oklab, var(--dorami-blue) 78%, var(--dorami-surface)); }

/* 通用小件 */
.sync-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--r-pill); background: var(--dorami-well); color: var(--dorami-muted); font-size: 12px; white-space: nowrap; }
.sync-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stamp.is-hollow { background: transparent; box-shadow: inset 0 0 0 1px var(--dorami-border-strong); color: var(--dorami-faint); }
.stamp.is-hollow::before { background: transparent; box-shadow: inset 0 0 0 1px var(--dorami-faint); border-radius: 50%; }
.stamp.is-dashed { background: transparent; outline: 1px dashed var(--dorami-border-strong); outline-offset: -1px; color: var(--dorami-faint); }
.stamp.is-dashed::before { background: transparent; border: 1px dashed var(--dorami-faint); border-radius: 50%; width: 7px; height: 7px; }
.sync-sum { display: flex; align-items: baseline; flex-wrap: nowrap; margin-left: auto; font-size: 12px; color: var(--dorami-faint); white-space: nowrap; }
.sync-sum-i { display: inline-flex; align-items: baseline; gap: 6px; }
.sync-sum-i + .sync-sum-i { margin-left: 14px; padding-left: 14px; border-left: 1px solid var(--dorami-border); }
.sync-sum-i b { font-size: 13px; font-weight: 600; color: var(--dorami-ink); font-variant-numeric: tabular-nums; }
.sync-meta { font-size: 12px; color: var(--dorami-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync-indet { position: relative; display: block; flex: none; width: 140px; height: 3px; border-radius: var(--r-pill); background: var(--dorami-well); overflow: hidden; }
.sync-indet > i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--dorami-accent); }
.sync-indet.is-det > i { left: 0; transition: width var(--motion-slow) var(--motion-ease); }
.ops-page-body > .ops-block + .ops-block { margin-top: 0; }
.sync-card-head { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.sync-card-head .card-title { white-space: nowrap; }

/* ══ A 流水线 ══ */
.pl {
  position: relative; display: grid; margin: 20px -8px 0;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr)) 25px minmax(158px, 0.92fr);
  grid-template-rows: auto repeat(7, auto);
}
.pl-grp { grid-row: 1; display: flex; align-items: center; gap: 4px; padding: 0 8px 2px; font-size: 12px; line-height: 16px; color: var(--dorami-faint); white-space: nowrap; }
.pl-grp svg { width: 12px; height: 12px; }
.pl-gap { grid-row: 1 / span 8; position: relative; }
.pl-gap::before { content: ""; position: absolute; top: 4px; bottom: 12px; left: 12px; border-left: 1px dashed var(--dorami-border-strong); }
.pl-st {
  grid-row: 2 / span 7; position: relative; display: grid; grid-template-rows: subgrid; justify-items: start; align-content: start; min-width: 0;
  padding: 0 8px 12px; border-radius: var(--r-control); text-align: left; color: inherit; cursor: pointer;
  transition: background var(--motion-fast) var(--motion-ease);
}
@media (hover: hover) { .pl-st:hover { background: var(--dorami-hover); } }
.pl-st:focus-visible { outline: 2px solid var(--dorami-focus); outline-offset: -2px; }
.pl-st.is-sel { background: var(--dorami-select); }
/* 轨道:每站画「到下一站」那一段;段的样式由本站状态决定 */
.pl-st::after { content: ""; position: absolute; z-index: 1; top: 16px; left: 22px; right: -8px; height: 0; border-top: 2px solid var(--dorami-muted); }
.pl-st.is-last::after { display: none; }
.pl-st.seg-todo::after { border-top: 2px dashed var(--dorami-border-strong); }
.pl-st.seg-run::after { border-top: 2px dashed var(--dorami-accent); }
.pl-st.seg-bad::after { border-top: 2px dashed color-mix(in oklab, var(--state-bad) 45%, transparent); }
.pl-mk {
  position: relative; z-index: 2; display: grid; place-items: center; flex: none;
  width: 16px; height: 16px; margin: 9px 0 12px; border-radius: 50%;
  background: var(--dorami-surface); border: 2px solid var(--dorami-border-strong); color: var(--dorami-surface);
}
.pl-mk svg { width: 10px; height: 10px; stroke-width: 3; }
.pl-mk.is-done { background: var(--dorami-ink-2); border-color: var(--dorami-ink-2); }
.pl-mk.is-run { border-color: color-mix(in oklab, var(--dorami-accent) 28%, transparent); }
.pl-mk.is-run::before { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--dorami-accent); border-right-color: var(--dorami-accent); animation: sync-spin 1s linear infinite; }
.pl-mk.is-run::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dorami-accent); }
.pl-mk.is-bad { width: 13px; height: 13px; margin: 10px 0 13px 1px; border-radius: 2px; transform: rotate(45deg); background: var(--state-bad); border-color: var(--state-bad); }
.pl-mk.is-skip { border-style: dashed; border-color: var(--dorami-faint); }
.pl-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--dorami-ink); }
.pl-id { max-width: 100%; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--dorami-faint); }
.pl-num { margin-top: 10px; display: flex; align-items: baseline; gap: 3px; min-height: 24px; font-size: 18px; line-height: 24px; font-weight: 600; color: var(--dorami-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl-num small { font-size: 12px; font-weight: 400; color: var(--dorami-muted); }
.pl-num.is-faint { font-size: 13px; font-weight: 400; color: var(--dorami-faint); }
.pl-num.is-bad { color: var(--state-bad); }
.pl-num.is-run { color: var(--dorami-accent-ink); }
.pl-sub { min-height: 16px; font-size: 12px; line-height: 16px; color: var(--dorami-muted); font-variant-numeric: tabular-nums; max-width: 100%; }
.pl-sub > span { white-space: nowrap; }
.pl-what { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--dorami-muted); }
.pl-what-i { white-space: nowrap; }
.pl-dur { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--dorami-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl-st.is-todo .pl-name, .pl-st.is-skip .pl-name { color: var(--dorami-muted); }
.pl-st.is-todo .pl-what, .pl-st.is-skip .pl-what { color: var(--dorami-faint); }
.pl-note { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 6px; padding: 10px 14px; border-radius: var(--r-control); background: var(--dorami-soft); font-size: 12px; line-height: 18px; color: var(--dorami-muted); font-variant-numeric: tabular-nums; }
.pl-note > svg { width: 14px; height: 14px; flex: none; }
.pl-note b { font-weight: 600; color: var(--dorami-ink); }

/* 关系件:一条带箭头的线 + 线中间的标签(标签底色压住线) */

  position: fixed; left: 50%; bottom: 28px; z-index: 99; transform: translateX(-50%);

<body>
<div id="spec" class="spec-bar" role="region" aria-label="样页控制"></div>
<button type="button" id="spec-pill" class="spec-pill" data-act="spec-show" hidden>样页控制</button>

</div>
<div id="drawer"></div>

function addSecs(start, secs) {
  const [h, m, s2] = start.slice(6).split(':').map(Number);
  const t = h * 3600 + m * 60 + s2 + secs;

}
function histRun(id, start, trig, k, opts = {}) {
  const r = { id, start, trig, status: 'succeeded', streams: {}, evidence: { status: 'success', pages: 1, inserted: Math.round(18 * k), skipped: 196 } };
  let secs = 0;
  for (const s of STREAMS) {

    if (opts.failAt && s.id === opts.failAt) break;
    const c = Math.round(b.count * k);

    if (b.dl != null) Object.assign(x, { dl: Math.round(b.dl * k), reuse: Math.round(b.reuse * k), dlMB: b.dlMB * k, reMB: b.reMB * k });
    r.streams[s.id] = x; secs += x.secs;
  }
  if (opts.failAt) {
    r.status = 'failed'; r.cur = opts.failAt; r.error = opts.error; r.evidence = null;
    r.progress = { stream: opts.failAt, page: opts.page, stream_processed: opts.sp };
    secs += opts.extra || 30;
  } else secs += 2;
  r.secs = secs;
  r.end = addSecs(start, secs);

function crumb(name) {
  return `<h1 class="page-title ops-crumb">
      <a class="ops-crumb-root" href="#/admin">运维管理</a>
      ${icon('chevron-right', 'ops-crumb-sep')}
      <button type="button" class="ops-crumb-cur" data-act="crumb" aria-haspopup="menu" aria-expanded="false" aria-label="${name} · 切换功能页">${name}${icon('chevron-down')}</button>
    </h1>`;
}
function peerItem(k, v, { mono = false, title = '', badge = '' } = {}) {
  return `<span class="sync-peer-i"${title ? ` title="${esc(title)}"` : ''}><span class="sync-peer-k">${k}</span><span class="sync-peer-v${mono ? ' is-mono' : ''}">${v}</span>${badge}</span>`;
}
function syncHead() {
  const n = negotiated().length;
  const ver = S.peer === 'new' ? PEER.version : PEER.oldVersion;
  let role; let peer; let acts; let sched = '';
  if (S.st === 'prod') {
    role = `<span class="sync-role">${icon('arrow-up-from-line')}生产端</span>`;
    peer = [peerItem('authority', AUTH.short, { mono: true, title: AUTH.id }),
      peerItem('当前修订', `r${fmt(PEER.rev)}`, { mono: true }),
      peerItem('Taxonomy', `v${PEER.taxonomy}`),
      peerItem('本机', PEER.version),
      peerItem('协议', `v3 · 导出 ${STREAMS.length} 流`, { title: CAPS.join('\n') })].join('');
    acts = `<button type="button" class="icon-button signal-refresh" data-act="danger" title="高危操作与兼容导出" aria-label="高危操作与兼容导出">${icon('ellipsis')}</button>`;
    sched = `<button type="button" class="model-chip sync-sched" data-go="#/admin/sync/recv"><i></i>${icon('house')}接收端 <b>1</b> <span class="is-mono">· ${REPLICA.short}</span>${src('whoPulled')}</button>`;
  } else if (S.st === 'none') {
    role = `<span class="sync-role is-none">${icon('circle-dashed')}未接入</span>`;
    peer = peerItem('远端', '—');
    acts = `<button type="button" class="icon-button signal-refresh" data-act="danger" title="高危操作与兼容导入导出" aria-label="高危操作与兼容导入导出">${icon('ellipsis')}</button>
      <button type="button" class="action-button action-button-primary min-h-[32px] px-3 text-xs" disabled title="先在下方接入生产端">${icon('refresh-cw')}立即同步</button>`;
    sched = `<button type="button" class="model-chip sync-sched" data-act="sched" aria-haspopup="dialog" aria-expanded="${S.pop === 'sched'}"><i class="is-off"></i>${icon('calendar-clock')}定时 <b>关</b></button>`;
  } else {
    role = `<span class="sync-role">${icon('arrow-down-to-line')}接收端</span>`;
    peer = [peerItem('拉取自', PEER.host, { mono: true, title: PEER.url }),
      peerItem('authority', AUTH.short, { mono: true, title: AUTH.id }),
      peerItem('远端', ver, { badge: src('remoteVersion') }),
      peerItem('协议', `v3 · ${n} / ${STREAMS.length} 流`, { title: `协商到的能力:\n${caps().join('\n')}` })].join('');
    const busy = S.st === 'running';
    acts = `<button type="button" class="icon-button signal-refresh" data-act="probe" title="测试连接" aria-label="测试连接" aria-expanded="${S.pop === 'probe'}">${icon('plug-zap')}</button>
      <button type="button" class="icon-button signal-refresh" data-act="danger" title="高危操作与兼容导入导出" aria-label="高危操作与兼容导入导出">${icon('ellipsis')}</button>
      <button type="button" class="action-button action-button-primary min-h-[32px] px-3 text-xs${busy ? ' is-busy' : ''}" ${busy ? 'disabled' : 'data-act="sync-now"'}>${busy ? icon('loader-circle', 'sync-spin') : icon('refresh-cw')}${busy ? `同步中 ${negIdx(RUNNING_RUN.cur)} / ${n}` : '立即同步'}</button>`;
    sched = `<button type="button" class="model-chip sync-sched" data-act="sched" aria-haspopup="dialog" aria-expanded="${S.pop === 'sched'}"><i></i>${icon('calendar-clock')}定时 <b>${SCHED.label}</b> <span class="tabular-nums">· 下次 ${SCHED.next}</span></button>`;
  }
  return `<div class="page-head sync-head">
    <div class="sync-head-l">${crumb('节点同步')}<div class="sync-peer">${role}${peer}</div></div>
    <div class="sync-head-r"><div class="sync-acts">${acts}</div>${sched}</div>
  </div>`;
}

/* ══ 共有块:运行记录 / 连接与定时 / 接入卡 / 生产端的接收端 ══ */
function zone(title, extra = '', first = false) {
  return `<div class="zone-head${first ? ' zone-head-first' : ''}"><span class="zone-title">${title}</span>${extra}</div>`;
}
function runStrip(run) {
  const cells = negotiated().map((s) => {
    const k = streamState(run, s.id);
    return `<i class="${k === 'done' ? '' : `is-${k}`}" title="${s.name} · ${{ done: '完成', run: '进行中', bad: '失败', todo: '未跑', skip: '未协商' }[k]}"></i>`;
  }).join('');
  const ek = streamState(run, 'candidate_evidence');
  return `<span class="rs" aria-label="逐流结果">${cells}<i class="rs-gap"></i><i class="${ek === 'done' ? '' : `is-${ek}`}" title="候选证据回传 · ${ek === 'done' ? '完成' : '未跑'}"></i></span>`;
}
function resultStamp(run) {
  if (run.status === 'running') return '<span class="stamp stamp-run">运行中</span>';
  if (run.status === 'failed') return '<span class="stamp stamp-bad">失败</span>';
  return '<span class="stamp stamp-ok">成功</span>';
}
function thSort(label, k, w, { num = false } = {}) {
  const on = S.runSort === k;
  return `<th class="acct-th ${num ? 'is-num' : ''} ${on ? 'is-sorted' : ''}" style="width:${w}px" aria-sort="${on ? (S.runOrder === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" class="acct-sortbtn" data-runsort="${k}" title="按${label}排序">${label}<span class="acct-sort-arrow" aria-hidden="true">${on ? (S.runOrder === 'asc' ? '▲' : '▼') : ''}</span></button></th>`;
}
function thFilter(label, key, opts, w, badge = '') {
  const v = S[key];
  const idx = Math.max(0, opts.findIndex(([x]) => x === v));
  const widest = [label, ...opts.slice(1).map(([, l]) => l)].reduce((a, b) => (b.length > a.length ? b : a));
  return `<th class="acct-th ${v ? 'is-filtered' : ''}" style="width:${w}px"><button type="button" class="acct-sortbtn" data-widest="${widest}" data-filter="${key}" title="点击轮换筛选:${[label, ...opts.slice(1).map(([, l]) => l)].join(' → ')}">${v ? opts[idx][1] : label}</button>${badge}</th>`;
}
function runsBlock() {
  let rows = runList().slice();
  if (S.runRes) rows = rows.filter((r) => (S.runRes === 'bad' ? r.status === 'failed' : r.status !== 'failed'));
  if (S.runTrig) rows = rows.filter((r) => (S.runTrig === 'system' ? r.trig === 'system' : r.trig !== 'system'));
  const key = (r) => (S.runSort === 'count' ? runStats(r).count : S.runSort === 'secs' ? r.secs : r.start);
  rows.sort((a, b) => { const x = key(a); const y = key(b); const c = x < y ? -1 : x > y ? 1 : 0; return S.runOrder === 'asc' ? c : -c; });
  const body = rows.length ? rows.map((r) => {
    const t = runStats(r);
    const files = t.dlMB + t.reMB + (r.progress && r.progress.dlMB || 0);
    const n = (v, main = false) => `<span class="run-n${main ? ' is-main' : ''}${v ? '' : ' is-zero'}">${v ? fmt(v) : '–'}</span>`;

/* ══ A 流水线 ══ */
function pipeStation(s, run, i, n, last) {
  const k = S.st === 'prod' ? 'done' : S.st === 'none' ? 'todo' : streamState(run, s.id);
  const x = run && run.streams[s.id];
  const isEv = s.id === 'candidate_evidence';
  let num; let sub = ''; let durTxt = '';
  if (S.st === 'prod') {
    num = isEv ? `${fmt(214)}<small>收到</small>` : s.id === 'taxonomy' ? `v12<small>312 标签</small>` : `${fmt(s.remote)}<small>${s.unit}</small>`;
    sub = isEv ? `来自 ${REPLICA.short}` : s.id === 'taxonomy' ? '已发布' : `修订 r${fmt(PEER.rev - [0, 0, 312, 140, 3021, 88, 9801, 12, 2][i] * 7)}`;
    durTxt = isEv ? '11-05 12:03' : '';
  } else if (S.st === 'none') {
    num = '—'; sub = '首次整流';
  } else if (k === 'skip') {
    num = '未协商'; sub = '对端未广播';
  } else if (isEv) {
    if (k === 'done') { num = `${run.evidence.inserted}<small>新增</small>`; sub = `跳过 ${run.evidence.skipped}`; durTxt = durShort(run.evidence.secs); } else { num = '—'; sub = '运行末尾'; }
  } else if (k === 'done') {
    if (x.same) { num = '未变'; sub = `v${PEER.taxonomy}`; } else if (!x.count) { num = '0'; sub = '无变化'; } else {
      num = `${fmt(x.count)}<small>条</small>`;
      sub = x.dl != null ? `下载 ${fmt(x.dl)} · 复用 ${fmt(x.reuse)}` : `+${fmt(x.inserted)} · ${fmt(x.updated)} 更新${x.deleted ? ` · −${x.deleted}` : ''}`;
    }
    durTxt = durShort(x.secs);
  } else if (k === 'run') {
    const p = run.progress;
    num = `${fmt(p.stream_processed)}<small>/ ${fmt(p.total)}</small>`;
    sub = `下载 ${fmt(p.downloaded)} · 复用 ${fmt(p.reused)}`;
    durTxt = `${durShort(p.secs)} · 进行中`;
  } else if (k === 'bad') {
    const p = run.progress;
    num = `第 ${p.page} 页`; sub = `前 ${p.page - 1} 页已提交`; durTxt = durShort(p.secs);
  } else {
    num = '—'; sub = run && run.status === 'failed' ? '未跑' : '待跑';
  }
  const numCls = k === 'bad' ? ' is-bad' : k === 'run' ? ' is-run' : (num === '—' || num === '未协商' || num === '未变' || num === '0') ? ' is-faint' : '';
  const seg = (S.st === 'prod' || k === 'done') ? '' : k === 'run' ? ' seg-run' : k === 'bad' ? ' seg-bad' : ' seg-todo';
  const mk = k === 'done' ? `<span class="pl-mk is-done">${icon('check')}</span>` : `<span class="pl-mk is-${k}"></span>`;
  const firstDur = i === 0 && S.st !== 'prod' && S.st !== 'none' ? src('streamDur') : '';
  const firstNum = (k === 'run') ? src('denom') : (k === 'bad') ? src('failPage') : (S.st === 'prod' && i === 0) ? src('prodExport') : '';
  return `<button type="button" class="pl-st is-${k}${seg}${last ? ' is-last' : ''}${S.drawer === `stream:${s.id}` ? ' is-sel' : ''}" style="grid-column:${isEv ? n + 2 : i + 1}" data-open="stream:${s.id}" aria-label="${s.name} · 详情">
    ${mk}
    <span class="pl-name">${s.name}</span>
    <span class="pl-id">${s.id.replace(/_/g, '_<wbr>')}</span>
    <span class="pl-num${numCls}">${num}${firstNum}</span>
    <span class="pl-sub">${String(sub).split(' · ').map((w) => `<span>${w}</span>`).join(' · ')}</span>
    <span class="pl-what">${s.what.split(' · ').map((w) => `<span class="pl-what-i">${w}</span>`).join('<span class="pl-what-sep"> · </span>')}</span>
    <span class="pl-dur">${durTxt}${firstDur}</span>

}
function pipeline(run) {

  const lastIdx = list.length - 1;

  if (st === 'failed') return { dot: '<span class="ops-tile-dot" title="上次同步失败 · AI 分析 第 37 页" aria-label="上次同步失败"><i class="ops-mark is-bad"></i></span>', lbl: '上次成功', num: HISTORY[0].end.slice(0, 5), tone: '' };

  if (st === 'prod') return { dot: '<span class="ops-tile-dot" title="本机是生产端" aria-label="生产端"><span class="ai-light"></span></span>', lbl: '角色', num: '生产端', tone: '' };
  return { dot: '<span class="ops-tile-dot" title="上次同步成功 · 11-05 12:03" aria-label="上次同步成功"><span class="ai-light"></span></span>', lbl: '上次同步', num: '12:03', tone: '' };
}
function sTile(cls, ic, name, num, lbl, meta = '', tone = '', page = '') {
  return `<section class="surface-card ops-tile is-s ${cls}" aria-label="${name}">
    <div class="ops-tile-head">${icon(ic, 'ops-tile-icon')}<a class="card-title ops-tile-name" href="#/admin/${page || 'x'}" ${page === 'sync' ? '' : `data-toast="样页只做节点同步"`}>${name}</a><span class="ops-tile-meta">${meta}</span></div>
    <div class="ops-srt"><span class="ops-kpi is-hero"><span class="ops-kpi-lbl">${lbl}</span><span class="ops-kpi-num${tone ? ` ${tone}` : ''}">${num}</span></span></div>
  </section>`;
}
function syncTile(st, cls = 't-sync') {
  const b = syncTileBody(st);
  return sTile(cls, 'waypoints', '节点同步', b.num, b.lbl, b.dot, b.tone, 'sync');
}
function lofi(cls, ic, name, size) {
  return `<section class="surface-card ops-tile is-${size} ${cls}" aria-label="${name}"><div class="ops-tile-head">${icon(ic, 'ops-tile-icon')}<span class="card-title ops-tile-name">${name}</span></div><div class="sync-lofi"></div></section>`;
}
function renderHome() {
  const pend = [
    ...(S.st === 'failed' ? [['bad', '节点同步失败', 'AI 分析']] : []),
    ['bad', '播客失败', '3'], ['warn', '分析待处理', '142'], ['warn', '反馈待处理', '5'], ['warn', 'ASR 配额', '86%'],
  ];
  const status = `<section class="surface-card ops-tile ops-status t-status" aria-label="状态">
    <div class="ops-tile-head">${icon('activity', 'ops-tile-icon')}<h2 class="card-title ops-status-title">状态</h2><span class="ops-count" title="待处理">${pend.length}</span></div>
    <div class="ops-pendlist">${pend.map(([tone, n, v]) => `<button type="button" class="ops-pend is-${tone}" ${n.startsWith('节点') ? 'data-go="#/admin/sync/runs"' : 'data-toast="样页只做节点同步"'}><i class="ops-mark${tone === 'bad' ? ' is-bad' : ''}" aria-hidden="true"></i><span class="ops-pend-name">${n}</span><span class="ops-pend-num">${v}</span>${icon('chevron-right')}</button>`).join('')}</div>
  </section>`;
  return `<div class="admin-page ops-home">
    <div class="page-head"><h1 class="page-title">运维管理</h1><div class="page-head-actions"><span class="win-label">时间窗</span><div class="mini-seg" role="group" aria-label="时间窗">${[7, 14, 30, 90].map((d) => `<button type="button" class="mini-seg-btn ${d === 7 ? 'is-on' : ''}" aria-pressed="${d === 7}">${d} 天</button>`).join('')}</div></div></div>
    <nav class="ops-bento is-261" aria-label="运维功能页">
      ${lofi('t-accounts', 'users', '账户', 'l')}${lofi('t-reading', 'chart-column', '阅读与榜单', 'l')}
      ${lofi('t-reader', 'brain', '读者功能', 'm')}${lofi('t-podcast', 'podcast', '播客', 'm')}${lofi('t-analysis', 'tags', '分析与标签', 'm')}
      ${status}
      ${sTile('t-external', 'hard-drive', '存储与外部资源', '2.4<small>GB</small>', '媒体库', '<span class="ops-tile-dot" title="自动备份正常"><span class="ai-light"></span></span>')}
      ${sTile('t-usrc', 'rss', '自定源', '37', '源')}
      ${sTile('t-inbox', 'message-square', '反馈与公告', '5', '待处理', '', 'is-warn')}
      ${syncTile(S.st)}
    </nav>
    <div class="sync-zone-cap">样页注:节点同步磁贴的五种状态(与首页 S 磁贴同宽)</div>
    <div class="sync-variants">${['idle', 'running', 'failed', 'none', 'prod'].map((x) => `<div>${syncTile(x, '')}<div class="spec-cap">${{ idle: '空闲', running: '运行中', failed: '失败(告警进「状态」)', none: '未配置', prod: '生产端' }[x]}</div></div>`).join('')}</div>
  </div>`;
}

/* ══ spec 栏 ══ */
function renderSpec() {
  const groups = [
    ['方向', 'dir', [['a', 'A 流水线'], ['b', 'B 台账'], ['c', 'C 两端对照']], S.dir],
    ['状态', 'st', [['idle', '空闲'], ['running', '运行中'], ['failed', '失败'], ['none', '未配置'], ['prod', '生产端']], S.st],
    ['页面', 'view', [['page', '节点同步'], ['home', '首页磁贴']], S.view],
    ['对端', 'peer', [['new', '新版'], ['old', '旧版']], S.peer],
    ['主题', 'theme', [['light', '亮'], ['dark', '暗']], S.theme],
    ['中性色', 'pal', [['porcelain', '瓷'], ['graphite', '墨'], ['paper', '宣']], S.pal],
    ['数据来源', 'src', [['0', '隐'], ['1', '显']], S.src ? '1' : '0'],
  ];
  const bar = $('#spec');
  bar.hidden = !S.spec;
  bar.innerHTML = `<span class="spec-title" title="数字为示意">样页 · #261 节点同步</span>${groups.map(([name, key, opts, cur]) => `
    <span class="spec-group"><span class="spec-name">${name}</span><span class="spec-seg" role="group" aria-label="${name}">${opts.map(([v, l]) => `<button type="button" class="spec-btn ${cur === v ? 'is-on' : ''}" data-spec="${key}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</span></span>`).join('')}
    <button type="button" class="spec-btn spec-hide" data-act="spec-hide" title="收起样页控制(右下角可再展开)">收起</button>`;
  $('#spec-pill').hidden = S.spec;
  const h = S.spec ? bar.offsetHeight : 0;
  document.documentElement.style.setProperty('--spec-h', `${h}px`);
  $('#main').style.paddingTop = `calc(22px + ${h}px)`;
}
function syncQuery() {
  const q = new URLSearchParams();
  if (S.dir !== 'a') q.set('dir', S.dir);
  if (S.st !== 'idle') q.set('st', S.st);
  if (S.theme !== 'light') q.set('theme', S.theme);
  if (S.pal !== 'porcelain') q.set('pal', S.pal);
  if (S.src) q.set('src', '1');
  if (S.peer !== 'new') q.set('peer', S.peer);
  const s = q.toString();
  history.replaceState(null, '', `${location.pathname}${s ? `?${s}` : ''}${location.hash}`);
}

/* ══ 路由与渲染 ══ */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] !== 'admin') return { view: 'page', block: '' };
  if (!parts[1]) return { view: 'home', block: '' };
  return { view: 'page', block: parts[2] || '' };
}
function render() {
  const r = route();
  S.view = r.view;
  document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.setAttribute('data-palette', S.pal);
  renderSpec();
  renderRail();
  if (S.view === 'home') $('#view').innerHTML = renderHome();
  else {
    const body = S.dir === 'b' ? bodyB() : S.dir === 'c' ? bodyC() : bodyA();
    $('#view').innerHTML = `<div class="admin-page ops-page">${syncHead()}<div class="ops-page-body">${body}</div></div>`;
  }
  renderDrawer();
  renderPop();
  renderModal();
}
function land(block) {
  const el = document.getElementById(`ops-sync-${block}`);
  if (!el) return;
  el.scrollIntoView({ block: 'start' });
  el.classList.remove('ops-flash'); void el.offsetWidth; el.classList.add('ops-flash');
  setTimeout(() => el.classList.remove('ops-flash'), 1600);
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-spec],[data-act],[data-open],[data-go],[data-toast],[data-runsort],[data-filter],[data-pick],[data-freq]');
  if (!t) { if (S.pop && !e.target.closest('.ops-pop')) { S.pop = ''; renderPop(); } return; }
  if (t.dataset.spec) {
    const k = t.dataset.spec; const v = t.dataset.v;
    if (k === 'view') { location.hash = v === 'home' ? '#/admin' : '#/admin/sync'; return; }
    if (k === 'src') S.src = v === '1'; else S[k] = v;
    S.drawer = ''; S.pop = '';
    syncQuery(); render(); return;
  }
  if (t.dataset.pick && !t.dataset.act) { S.pick = t.dataset.pick; renderDrawer(); return; }
  if (t.dataset.freq) { S.freq = t.dataset.freq; renderPop(); return; }
  if (t.dataset.runsort) {
    const k = t.dataset.runsort;
    if (S.runSort === k) S.runOrder = S.runOrder === 'asc' ? 'desc' : 'asc'; else { S.runSort = k; S.runOrder = 'desc'; }
    render(); return;
  }
  if (t.dataset.filter) {
    const key = t.dataset.filter;
    const cycles = { runTrig: ['', 'system', 'admin'], runRes: ['', 'ok', 'bad'], lgStat: ['', 'chg', 'bad'] }[key];
    S[key] = cycles[(cycles.indexOf(S[key]) + 1) % cycles.length];
    render(); return;
  }
  const act = t.dataset.act;
  if (act) {
    e.preventDefault();
    if (act === 'spec-hide') { S.spec = false; render(); return; }
    if (act === 'spec-show') { S.spec = true; render(); return; }
    if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; syncQuery(); render(); return; }
    if (act === 'crumb') { S.pop = S.pop === 'crumb' ? '' : 'crumb'; renderPop(); return; }
    if (act === 'sched') { S.drawer = ''; renderDrawer(); S.pop = S.pop === 'sched' ? '' : 'sched'; render(); return; }
    if (act === 'probe') {
      if (S.pop === 'probe') { S.pop = ''; render(); return; }
      t.innerHTML = icon('loader-circle', 'sync-spin');
      setTimeout(() => { S.pop = 'probe'; render(); }, 550);
      return;
    }
    if (act === 'pop-x') { S.pop = ''; render(); return; }
    if (act === 'sched-on') { S.schedOn = !S.schedOn; renderPop(); return; }
    if (act === 'sched-save') { S.pop = ''; render(); toast(`已保存定时同步 · ${{ daily: '每天 03:00', six: '每 6 小时', hourly: '每小时', custom: '30 */4 * * *' }[S.freq]}`); return; }
    if (act === 'danger') { S.pop = ''; if (t.dataset.pick) S.pick = t.dataset.pick; S.drawer = 'danger'; render(); return; }
    if (act === 'drawer-x') { S.drawer = ''; render(); return; }
    if (act === 'confirm') { S.modal = t.dataset.what; renderModal(); return; }
    if (act === 'modal-x') { if (e.target === t || t.tagName === 'BUTTON') { S.modal = ''; renderModal(); } return; }
    if (act === 'modal-ok') { const m = S.modal; S.modal = ''; renderModal(); toast({ reset: `已重置 ${SBY[S.pick].name} checkpoint`, replay: '已清空分析流 checkpoint,下次同步整流重拉', rebase: '已更换远端,等待首个快照' }[m]); return; }
    if (act === 'sync-now') { S.st = 'running'; S.drawer = ''; syncQuery(); render(); toast('已开始同步'); return; }
    if (act === 'first-sync') { S.st = 'running'; syncQuery(); render(); toast('已开始首次同步'); return; }
    if (act === 'fold') { S.fold = !S.fold; render(); return; }
    if (act === 'lgq') { S.lgQ = ' '; render(); const i = $('[data-lgq]'); if (i) { i.value = ''; i.focus(); } S.lgQ = ''; return; }
    if (act === 'runs-clear') { S.runRes = ''; S.runTrig = ''; render(); return; }
  }
  if (t.dataset.open) { S.pop = ''; S.drawer = t.dataset.open; render(); return; }
  if (t.dataset.go) { e.preventDefault(); location.hash = t.dataset.go; return; }
  if (t.dataset.toast) { e.preventDefault(); toast(t.dataset.toast); }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-lgq]')) {
    const pos = e.target.selectionStart;
    S.lgQ = e.target.value;
    render();
    const i = $('[data-lgq]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('focusout', (e) => {
  if (e.target.matches && e.target.matches('[data-lgq]') && !e.target.value.trim()) { S.lgQ = ''; setTimeout(render, 0); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.modal) { S.modal = ''; renderModal(); return; }
    if (S.pop) { S.pop = ''; renderPop(); return; }
    if (S.drawer) { S.drawer = ''; render(); }
    return;
  }
  if (e.key === 'Enter' && e.target.matches('[data-open],[data-act="fold"]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => { S.drawer = ''; S.pop = ''; render(); const r = route(); if (r.block) land(r.block); else window.scrollTo(0, 0); });
window.addEventListener('resize', () => { if (S.pop) renderPop(); });
if (!location.hash) history.replaceState(null, '', `${location.pathname}${location.search}#/admin/sync`);
render();
{ const r = route(); if (r.block) land(r.block); }
</script>
