[server]
host = 127.0.0.1
port = 8088
reload = true

[runtime]
# Deployment role. Keep the default `all` for single-node setups.
# Only change for split deployments: collector (collect/archive only) / reader (distribution only).
role = all

[taxonomy]
# Independent of [runtime] role. Choose explicitly for each deployment:
# authority = install the repository-approved catalog before API/workers start
# replica   = never install a local catalog; receive taxonomy through Archive Sync
# manual    = no startup action (safe default for standalone/dev databases)
deployment = manual
catalog = config/taxonomy-v1-approved-catalog.json

[network]
disable_ca_bundle = true
hf_endpoint = https://hf-mirror.com

[proxy]
http_proxy =
https_proxy =
no_proxy = 127.0.0.1,localhost

[auth]
cookie_name = dorami_admin_session
session_seconds = 604800
# 账户全部数据库托管（users 表）：ini 不再配置账户名单。首启 users 表为空时
# 自动生成根管理员 admin/admin，请登录后立即修改密码，并按需新建管理员/读者账户。
secret = change-me-to-a-long-random-string
cookie_secure = false

[storage]
database_url = sqlite:///data/cms_data.db

[cors]
allow_origins = *
allow_credentials = true
allow_methods = *
allow_headers = *

[x_api]
# Prefer the environment variable DORAMI_X_BEARER_TOKEN. Never commit a real token.
bearer_token =
base_url = https://api.x.com/2
timeout_seconds = 30
max_results = 25
monthly_budget_usd = 5.0
