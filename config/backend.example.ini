[server]
host = 127.0.0.1
port = 8088
reload = true

[runtime]
# Deployment role. Keep the default `all` for single-node setups.
# Only change for split deployments: collector (collect/archive only) / reader (distribution only).
role = all

[taxonomy]
# Independent of [runtime] role. Choose explicitly for each deployment:
# authority = install the repository-approved catalog before API/workers start
# replica   = never install a local catalog; receive taxonomy through Archive Sync
# manual    = no startup action (safe default for standalone/dev databases)
deployment = manual
catalog = config/taxonomy-v1-approved-catalog.json

[network]
disable_ca_bundle = true
hf_endpoint = https://hf-mirror.com

[proxy]
http_proxy =
https_proxy =
no_proxy = 127.0.0.1,localhost

[auth]
cookie_name = dorami_admin_session
session_seconds = 604800
# 账户全部数据库托管（users 表）：ini 不再配置账户名单。首启 users 表为空时
# 自动生成根管理员 admin/admin，请登录后立即修改密码，并按需新建管理员/读者账户。
secret = change-me-to-a-long-random-string
cookie_secure = false

[storage]
database_url = sqlite:///data/cms_data.db

[podcast]
# Development-safe posture: network metadata + local artifact management only;
# no ASR/LLM/TTS provider stage is enabled implicitly.
installation = development
authority_id = dev-local
allowed_stages = fetch,local_publish
# Feed safety limits. Environment overrides:
# DORAMI_PODCAST_* overrides every value in this section.
feed_max_bytes = 20971520
feed_timeout_seconds = 30
# Publisher transcript safety limits (all support DORAMI_PODCAST_TRANSCRIPT_*).
transcript_max_bytes = 8388608
transcript_timeout_seconds = 30
transcript_max_segments = 100000
transcript_max_text_chars = 4000000
transcript_duration_tolerance_seconds = 5
# Canonical stored-text ceiling, enforced for publisher/derived writes, sync,
# and legacy Reader projection (DORAMI_PODCAST_TEXT_ARTIFACT_MAX_*).
text_artifact_max_bytes = 8388608
text_artifact_max_chars = 4000000
# Aggregate Archive Sync Podcast-text page limits.
text_sync_page_max_bytes = 16777216
text_sync_page_max_rows = 1000
# Reader plain-text pagination/search limits (DORAMI_PODCAST_READER_TEXT_*).
reader_text_default_chars = 12000
reader_text_max_chars = 50000
reader_text_query_max_chars = 200
# Optional dedicated HMAC secret (>=32 chars). When empty, a purpose-separated
# key is derived from [auth] secret; production therefore must set auth.secret.
# reader_cursor_secret =
# Paid processing is fail-closed until a concrete provider integration also
# registers every stage executor + a CNY cost estimator at runtime.
processing_enabled = false
provider_ready_targets =
text_pipeline_version = podcast-text-v1
audio_pipeline_version = podcast-audio-v1
processing_policy_version = podcast-processing-policy-v1
monthly_budget_cny_minor = 0
per_run_budget_cny_minor = 0
budget_scope = podcast-paid-processing
budget_timezone = Asia/Shanghai
# Logical aliases only; never put provider voice IDs or credentials here.
voice_profiles =
default_voice_profile =
# Prototype premium guide: only episodes strictly longer than 20 minutes enter
# ASR; the reader-facing mode is a single-speaker overview capped at 15 minutes.
premium_score_threshold = 8.5
premium_min_duration_seconds = 1200
premium_guide_mode = solo_preview
premium_max_audio_minutes = 15
premium_transcript_max_chars = 120000
premium_blog_max_chars = 6000
premium_narration_max_chars = 4200

[podcast_worker]
# Scheduler registration is still gated by [podcast] stage policy and the
# runtime ASR stage-worker registry. Starting the app never executes an immediate tick.
# A concrete provider bundle must pass its pre-claim poll-readiness check.
tick_seconds = 10
lease_seconds = 120
# Renew the fenced processing lease during long TTS downloads and ffprobe.
heartbeat_seconds = 30
fallback_retry_seconds = 30
# Keep bounded: each step may perform at most one provider request.
max_steps_per_tick = 1

[podcast_artifacts]
# Local content-addressed audio storage; do not place provider credentials here.
# Every option also supports DORAMI_PODCAST_ARTIFACT_* environment overrides.
root_dir = data/podcast-artifacts
max_audio_mb = 512
# 0 disables the fixed business quota; the per-file cap and disk reserve still apply.
total_quota_mb = 0
minimum_free_mb = 1024
allowed_mime_types = audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/webm
upload_timeout_seconds = 120
download_timeout_seconds = 120
# Redirects are followed manually to enforce the hop and timeout limits.
download_max_redirects = 5
ffprobe_binary = ffprobe
probe_timeout_seconds = 15
# Orphaned CAS files are only reclaimed after this safety window.
orphan_grace_seconds = 3600
# Incomplete uploads older than this are removed by startup/admin reconciliation.
staging_ttl_seconds = 3600

[aliyun_isi]
# Secrets are environment-only in checked-in examples:
# ALIYUN_AK_ID, ALIYUN_AK_SECRET, optional ALIYUN_SECURITY_TOKEN,
# NLS_APP_KEY, NLS_ACCESS_TOKEN and NLS_TOKEN_EXPIRES_AT.
# Protocol constants remain overridable for regional/test endpoints.
region_id = cn-shanghai
asr_domain = filetrans.cn-shanghai.aliyuncs.com
asr_product = nls-filetrans
asr_api_version = 2018-08-17
asr_task_version = 4.0
asr_enable_words = true
asr_auto_split = true
asr_enable_sample_rate_adaptive = true
# Optional one-shot relay after Aliyun reports an RSS file download failure.
# Keep empty to disable. The internal endpoint must match the ASR region.
asr_oss_endpoint =
asr_oss_internal_endpoint =
asr_oss_bucket =
asr_oss_prefix = asr-relay
asr_oss_signed_url_ttl_seconds = 86400
token_url = https://nls-meta.cn-shanghai.aliyuncs.com/
tts_url = https://nls-gateway-cn-shanghai.aliyuncs.com/rest/v1/tts/async
tts_device_id = dorami-source-archive
# Map the Podcast logical voice alias to provider settings; keep empty until a
# tested, licensed voice is selected. Example (one line, no real secret):
# tts_voice_profiles_json = {"narrator_zh":{"voice":"aixia","format":"wav","sample_rate":16000,"volume":50,"speech_rate":0,"pitch_rate":0,"enable_subtitle":true}}
tts_voice_profiles_json =
tts_result_allowed_host_suffixes = aliyuncs.com
tts_max_chars = 100000
request_timeout_seconds = 30
asr_poll_interval_seconds = 10
tts_poll_interval_seconds = 10
token_refresh_skew_seconds = 300
# Provider usage accounting is independent from credentials. Empty scopes,
# windows/revisions and zero limits intentionally keep paid calls fail-closed.
# Fill every ASR field from the active entitlement before enabling ASR.
asr_quota_scope =
asr_quota_timezone = Asia/Shanghai
asr_daily_audio_seconds_limit = 0
# Independent per-episode provider boundary (12 hours by default).
asr_max_audio_seconds_per_file = 43200
asr_entitlement_ends_at =
asr_provider_deadline_seconds = 0
asr_price_cny_minor_per_hour = 0
asr_pricing_revision =
# Use a new campaign_id for each bounded TTS approval window. The limit is a
# campaign-wide character ceiling, not a per-request allowance.
tts_quota_scope =
tts_campaign_id =
tts_campaign_starts_at =
tts_campaign_ends_at =
tts_campaign_character_limit = 0
tts_provider_deadline_seconds = 0
tts_price_cny_minor_per_10000_chars = 0
tts_pricing_revision =
# manual parks terminal tasks for billing reconciliation. Set
# submitted_characters only after accepting the frozen request character count
# as the conservative local settlement basis (not provider-reported usage).
tts_usage_settlement_mode = manual

[cors]
allow_origins = *
allow_credentials = true
allow_methods = *
allow_headers = *

[x_api]
# Prefer the environment variable DORAMI_X_BEARER_TOKEN. Never commit a real token.
bearer_token =
base_url = https://api.x.com/2
timeout_seconds = 30
max_results = 25
monthly_budget_usd = 5.0
