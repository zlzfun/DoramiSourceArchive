# ── 部署路径与本文件 ──────────────────────────────────────────────────
# 两条官方部署路径共用这份配置,只有 [server]/[nginx] 两节的语义随路径而异:
#   - Docker(./deploy-docker.sh):这两节**不生效**——入口固定监听 0.0.0.0:8088,
#     站点配置在 docker/nginx.conf,对外端口由 compose 端口映射决定;
#   - 裸机(./deploy.sh):这两节是 PM2 后端监听地址与 Nginx 站点生成的输入。
# 详见 docs/deploy-docker.md / docs/deploy-baremetal.md。

[server]
# 裸机路径:PM2 托管的后端监听地址(Nginx 反代到这里,不要暴露到 0.0.0.0)。
# reload 生产必须 false;ecosystem.config.js 的 NODE_ENV=production 另有守卫兜底。
host = 127.0.0.1
port = 8088
reload = false

[runtime]
# Deployment role. Keep the default `all` for single-node setups.
# Only change for split deployments: collector (collect/archive only) / reader (distribution only).
role = all

[taxonomy]
# This is deliberately not inferred from role=all. Set authority on the external
# producer and replica on the internal Archive Sync receiver before deployment.
# This placeholder intentionally fails startup until the operator chooses.
deployment = CHANGE_ME_authority_or_replica
catalog = config/taxonomy-v1-approved-catalog.json

[media]
# 媒体库(图床):正文外链图片的本地缓存。抓取入库后自动预取,阅读器经
# /api/media/proxy 取图,失败 302 回源降级;归档正文原链从不改写。
# 关闭后整体退回外链直连。Override via env DORAMI_MEDIA_ENABLED.
enabled = true
# media_dir = data/media
# max_file_mb = 20
# timeout_seconds = 20
# prefetch_concurrency = 4

[network]
disable_ca_bundle = true
hf_endpoint = https://hf-mirror.com

[proxy]
# If your company proxy requires credentials, put them only in production.ini.
# Example: http://user:password@proxy.company.com:8080
http_proxy =
https_proxy =
no_proxy = 127.0.0.1,localhost

[auth]
cookie_name = dorami_admin_session
session_seconds = 604800
# 账户全部数据库托管（users 表）：ini 不再配置账户名单。首启 users 表为空时
# 自动生成根管理员 admin/admin，请登录后立即修改密码，并按需新建管理员/读者账户。
# secret 必须改为长随机串（如 `python -c "import secrets;print(secrets.token_urlsafe(48))"`）。
# 启动安全校验在生产姿态（cookie_secure=true）下会拒绝未改的占位符/空值。
secret = change-me-to-a-long-random-string
# 生产走 HTTPS 时置 true：既让 Cookie 带 Secure，也开启启动期安全校验的「生产姿态」。
cookie_secure = false

[storage]
database_url = sqlite:///data/cms_data.db

[podcast]
# Both hosts keep [runtime] role=all. Copy this file per host and choose exactly
# one processing posture (never commit the real authority ID):
# This copy is the external template. External defaults to the complete Podcast
# processing chain; internal defaults to sync-only. Switching hosts therefore
# only requires changing installation + the stable authority ID. Operators can
# still override allowed_stages, processing_enabled and provider_ready_targets.
installation = external
authority_id = CHANGE_ME_podcast_external
# External derived default:
# allowed_stages = fetch,asr,translate,analyze,digest,script,tts,audio_qa,local_publish
# Internal derived default:
# allowed_stages =
# Override with DORAMI_PODCAST_* environment variables.
feed_max_bytes = 20971520
feed_timeout_seconds = 30
# Publisher transcript safety limits (all support DORAMI_PODCAST_TRANSCRIPT_*).
transcript_max_bytes = 8388608
transcript_timeout_seconds = 30
transcript_max_segments = 100000
transcript_max_text_chars = 4000000
transcript_duration_tolerance_seconds = 5
text_artifact_max_bytes = 8388608
text_artifact_max_chars = 4000000
# Aggregate Archive Sync Podcast-text page limits.
text_sync_page_max_bytes = 16777216
text_sync_page_max_rows = 1000
# Reader plain-text pagination/search limits (DORAMI_PODCAST_READER_TEXT_*).
reader_text_default_chars = 12000
reader_text_max_chars = 50000
reader_text_query_max_chars = 200
# Optional DORAMI_PODCAST_READER_CURSOR_SECRET (>=32 chars); when omitted,
# signed cursors use a purpose-separated key derived from required auth.secret.
# External defaults to enabled with all targets. Internal defaults to disabled
# with no targets. Missing provider credentials/accounting still fail closed at
# runtime; no paid call is made merely because this switch is enabled.
# processing_enabled = true
# provider_ready_targets = transcript,digest_blog,digest_audio
text_pipeline_version = podcast-text-v1
audio_pipeline_version = podcast-audio-v1
processing_policy_version = podcast-processing-policy-v1
# External derived prototype guardrails (CNY minor units); internal derives 0.
# Override them for the purchased provider plan.
# monthly_budget_cny_minor = 100000
# per_run_budget_cny_minor = 5000
budget_scope = podcast-paid-processing
budget_timezone = Asia/Shanghai
# Logical alias only. The provider voice ID remains in the host-only
# tts_voice_profiles_json / credential registry.
# External derived defaults; internal derives empty values.
# voice_profiles = narrator_zh
# default_voice_profile = narrator_zh
premium_score_threshold = 8.5
premium_min_duration_seconds = 1200
premium_guide_mode = solo_preview
premium_max_audio_minutes = 15
premium_transcript_max_chars = 120000
premium_blog_max_chars = 6000
premium_narration_max_chars = 4200

[podcast_worker]
# Both role=all hosts may load these values; only Podcast stage policy plus a
# registered runtime ASR stage worker can register the ASR job.
# Runtime provider readiness is checked again before any database claim.
tick_seconds = 10
lease_seconds = 120
# Must be comfortably shorter than lease_seconds for long ASR work.
heartbeat_seconds = 30
fallback_retry_seconds = 30
max_steps_per_tick = 1

[podcast_artifacts]
# Keep this on persistent local storage. No ASR/TTS secret belongs in this section.
root_dir = data/podcast-artifacts
max_audio_mb = 512
total_quota_mb = 10240
minimum_free_mb = 1024
allowed_mime_types = audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/webm
upload_timeout_seconds = 120
download_timeout_seconds = 120
download_max_redirects = 5
# External-only temporary cache for publisher audio used by ASR.
source_audio_ttl_seconds = 604800
source_audio_quota_mb = 2048
ffprobe_binary = ffprobe
probe_timeout_seconds = 15
orphan_grace_seconds = 3600
staging_ttl_seconds = 3600

[podcast_asr_fetch]
# External ASR authority only: set this to the fixed public HTTPS CAS route.
# The internal host leaves it empty. Inject the secret through
# DORAMI_PODCAST_ASR_FETCH_SIGNING_SECRET; never commit it or build the public
# base URL from a request Host header. During rotation, temporarily inject the
# old key with DORAMI_PODCAST_ASR_FETCH_PREVIOUS_SIGNING_SECRET.
public_base_url =
signing_secret =
previous_signing_secret =
url_ttl_seconds = 900
clock_skew_seconds = 30
min_remaining_seconds = 300

[aliyun_isi]
# Do not place AK/SK/Appkey/Token here. Inject them on the external host with
# ALIYUN_AK_ID, ALIYUN_AK_SECRET, optional ALIYUN_SECURITY_TOKEN,
# NLS_APP_KEY, NLS_ACCESS_TOKEN and NLS_TOKEN_EXPIRES_AT.
region_id = cn-shanghai
asr_domain = filetrans.cn-shanghai.aliyuncs.com
asr_product = nls-filetrans
asr_api_version = 2018-08-17
asr_task_version = 4.0
asr_enable_words = true
asr_auto_split = true
asr_enable_sample_rate_adaptive = true
token_url = https://nls-meta.cn-shanghai.aliyuncs.com/
tts_url = https://nls-gateway-cn-shanghai.aliyuncs.com/rest/v1/tts/async
tts_device_id = dorami-source-archive
# Logical alias -> provider voice/settings. Keep empty until the selected voice
# has passed the licensing and long-form listening checks.
tts_voice_profiles_json =
tts_result_allowed_host_suffixes = aliyuncs.com
tts_max_chars = 100000
request_timeout_seconds = 30
asr_poll_interval_seconds = 10
tts_poll_interval_seconds = 10
token_refresh_skew_seconds = 300
# Paid calls remain disabled until every matching accounting field is set.
# ASR quota days are always cut at Asia/Shanghai midnight.
asr_quota_scope =
asr_quota_timezone = Asia/Shanghai
asr_daily_audio_seconds_limit = 0
asr_entitlement_ends_at =
asr_provider_deadline_seconds = 0
asr_price_cny_minor_per_hour = 0
asr_pricing_revision =
# Rotate campaign_id when approving another bounded TTS campaign; do not reuse
# a period with different dates, limit, price, or pricing revision.
tts_quota_scope =
tts_campaign_id =
tts_campaign_starts_at =
tts_campaign_ends_at =
tts_campaign_character_limit = 0
tts_provider_deadline_seconds = 0
tts_price_cny_minor_per_10000_chars = 0
tts_pricing_revision =
# Default manual because the task API has no verified billed-character field.
# submitted_characters enables conservative automatic local settlement.
tts_usage_settlement_mode = manual

[cors]
# 生产安全：凭证型跨域（allow_credentials=true）下 allow_origins 必须是具体域名白名单，
# 不能用 *（cookie_secure=true 时启动校验会拒绝 *+credentials 组合）。
# 例：allow_origins = https://your-domain.example.com
allow_origins = *
allow_credentials = true
allow_methods = *
allow_headers = *

[x_api]
# Inject the secret with DORAMI_X_BEARER_TOKEN in production.
bearer_token =
base_url = https://api.x.com/2
timeout_seconds = 30
max_results = 25
monthly_budget_usd = 5.0

[nginx]
# 裸机路径专用:./deploy.sh 读本节生成宿主 Nginx 站点配置(同名大写环境变量可覆盖)。
# Docker 路径下本节不生效(站点配置在 docker/nginx.conf)。
html_dir = /var/www/my_site
site_name = dorami
server_name = _
listen_port = 80
listen_options = default_server
disable_default_site = true
backend_proxy_host = 127.0.0.1
backend_proxy_port = 8088

# 公网站点:DNS 指向本机、证书就位后置 enable_ssl = true(server_name 必须是真实
# 域名,不能是 _),并同步把 [auth] cookie_secure 置 true。证书/私钥留空时默认取
# /etc/nginx/ssl/{server_name}.pem 与 .key。
# 注意 deploy.sh 每次部署都会整体覆写站点文件,故签证书请用 `certbot certonly`
# (webroot/standalone),不要用 `certbot --nginx`——它写进站点的改动会被覆盖。
enable_ssl = false
ssl_listen_port = 443
ssl_redirect = true
ssl_cert_file =
ssl_key_file =
# 证书续期/更换稳定后再开。
enable_hsts = false
