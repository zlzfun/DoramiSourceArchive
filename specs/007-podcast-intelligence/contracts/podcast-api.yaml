openapi: 3.1.0
info:
  title: Dorami Podcast Intelligence API
  version: 0.2.0
  description: >-
    Issue #7 prototype contract. Podcast sources enter the catalog by default.
    The external installation owns collection, ASR, Chinese digest generation,
    TTS and publication; the internal installation only imports and displays
    published text and audio through Archive Sync.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: Podcast reader
  - name: Podcast processing
  - name: Podcast artifacts
  - name: Archive Sync

paths:
  /api/podcasts/episodes/{episode_id}/texts:
    get:
      tags: [Podcast reader]
      operationId: readPodcastEpisodeTexts
      summary: Read published Chinese transcript and premium digest text
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
        - name: kind
          in: query
          schema:
            type: string
            enum: ['', digest_blog_zh, transcript_zh, publisher_transcript]
        - name: q
          in: query
          schema: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Published text artifacts}
        '404': {$ref: '#/components/responses/PodcastError'}

  /api/reader/podcast-artifacts/{artifact_id}/audio:
    get:
      tags: [Podcast reader]
      operationId: readPodcastArtifactAudio
      summary: Stream a published premium-guide audio artifact with Range support
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200': {description: Complete audio stream}
        '206': {description: Partial audio stream}
        '404': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-premium-guides:
    get:
      tags: [Podcast processing]
      operationId: listPodcastPremiumGuides
      summary: List premium episodes only, paginated at no more than 100 rows
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200': {description: Premium-guide task page}

  /api/admin/podcast-premium-guides/{episode_id}/run:
    post:
      tags: [Podcast processing]
      operationId: runPodcastPremiumGuide
      summary: Queue the configured premium-guide mode for one eligible episode
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '202': {description: Task queued or already running}
        '404': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-episodes/{episode_id}/process:
    post:
      tags: [Podcast processing]
      operationId: requestPodcastProcessing
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodcastProcessRequest'
      responses:
        '202': {description: Durable processing state created or reused}
        '409': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-processings/{processing_id}:
    get:
      tags: [Podcast processing]
      operationId: getPodcastProcessing
      parameters:
        - $ref: '#/components/parameters/ProcessingId'
      responses:
        '200': {description: Redacted processing state}
        '404': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-processings/{processing_id}/retry:
    post:
      tags: [Podcast processing]
      operationId: retryPodcastProcessing
      parameters:
        - $ref: '#/components/parameters/ProcessingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodcastRetryRequest'
      responses:
        '202': {description: Retry accepted}
        '409': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-stages/capabilities:
    get:
      tags: [Podcast processing]
      operationId: getPodcastStageCapabilities
      responses:
        '200': {description: Effective stage ownership and provider readiness}

  /api/admin/podcast-artifacts/stats:
    get:
      tags: [Podcast artifacts]
      operationId: getPodcastArtifactStats
      responses:
        '200': {description: Local CAS usage and quota statistics}

  /api/admin/podcast-artifacts:
    get:
      tags: [Podcast artifacts]
      operationId: listPodcastArtifacts
      parameters:
        - name: episode_id
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200': {description: Local artifact records}

  /api/admin/podcast-artifacts/reconcile:
    post:
      tags: [Podcast artifacts]
      operationId: reconcilePodcastArtifacts
      responses:
        '200': {description: Storage reconciliation report}

  /api/admin/podcast-artifacts/{artifact_id}/publish:
    post:
      tags: [Podcast artifacts]
      operationId: publishPodcastArtifact
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - name: expected_updated_at
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Published digest audio artifact}
        '409': {$ref: '#/components/responses/PodcastError'}

  /api/admin/podcast-artifacts/{artifact_id}/withdraw:
    post:
      tags: [Podcast artifacts]
      operationId: withdrawPodcastArtifact
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200': {description: Withdrawn artifact}

  /api/archive/v2/podcast-audio/{artifact_id}:
    get:
      tags: [Archive Sync]
      operationId: exportArchivePodcastAudio
      summary: Export a published digest-audio blob declared by the sync manifest
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200': {description: Verified digest-audio blob}
        '404': {$ref: '#/components/responses/PodcastError'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  parameters:
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema: {type: string}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string}
    ProcessingId:
      name: processing_id
      in: path
      required: true
      schema: {type: string}
  schemas:
    PodcastProcessRequest:
      type: object
      required: [target, reason, idempotency_key]
      properties:
        target:
          type: string
          enum: [transcript, digest_blog]
        selection_override: {type: boolean, default: false}
        reason: {type: string, minLength: 3, maxLength: 1000}
        idempotency_key: {type: string, minLength: 8, maxLength: 200}
    PodcastRetryRequest:
      type: object
      required: [idempotency_key, expected_attempt_count, reason]
      properties:
        idempotency_key: {type: string, minLength: 8, maxLength: 200}
        expected_attempt_count: {type: integer, minimum: 0}
        reason: {type: string, minLength: 3, maxLength: 1000}
    PodcastError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
  responses:
    PodcastError:
      description: Podcast domain error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PodcastError'
