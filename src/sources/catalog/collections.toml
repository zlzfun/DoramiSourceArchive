# 源合集:发现页的策展视图 + 批量订阅动作(定调见 docs/archive/source-collections-wave-plan.md)。
# 合集不是订阅实体——「订阅合集」= 一次性批量订阅它当前的成员,之后新增的成员不会自动推给已订阅者。
#
# 每个 [[collection]]:
#   id               kebab 稳定标识(API 路径段 / 前端 key),定了就别改
#   name             合集名
#   description      内容式一句话(取名规范沿 docs/sources/node_audit_playbook.md)
#   provenance_note  策展来源注;支持受限 markdown 子集(**加粗** 与 [文字](http(s) 链接)),
#                    前端用公告白名单渲染器(utils/announcementText.jsx)渲染,零注入面
#   sources          成员,有序;必须是本目录里的现役策展源,同一个源可以出现在多个合集
#
# 加载与校验 src/fetchers/catalog_files.py;读取 src/services/source_collections.py。

[[collection]]
id = "hn-popular-blogs-2025"
name = "2025 人气独立博客"
description = "Hacker News 社区 2025 年最受欢迎的个人技术博客,AI 与软件工程一线从业者的深度个人写作。"
provenance_note = "Karpathy 分享了 Evan Schwartz 统计的[2025 Hacker News 最受欢迎 RSS 博客榜单](https://gist.github.com/emschwartz/e6d2bf860ccc367fe37ff953ba6de66b),本合集基于该榜单拓展收录。"
sources = [
    "rss_sean_goedecke",
    "rss_giles_thomas",
    "rss_max_woolf",
    "rss_geohot",
    "rss_geoffrey_litt",
    "rss_martin_alderson",
    "rss_anil_dash",
]

