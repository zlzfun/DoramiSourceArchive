[project]
name = "doramisourcearchive"
version = "3.41.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0",
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "lxml>=4.9.0",
    # 上限是硬约束:代码用 1.x 的 mcp.server.fastmcp.FastMCP,2.0(2026-07-28)把它
    # 改名为 MCPServer 并变更 API。裸机路径现解依赖曾因此装到 2.x 而起不来。
    "mcp>=1.27.1,<2",
    "playwright>=1.35.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.8",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# 可选：基于 crawl4ai 的浏览器详情后端（统一 Web Content Runtime，阶段一旁路对比）。
# 默认 `uv sync` 不安装；启用浏览器后端时 `uv sync --extra crawl4ai` 并 `playwright install chromium`。
crawl4ai = [
    "crawl4ai>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
