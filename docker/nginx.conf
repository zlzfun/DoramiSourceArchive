# Dorami 容器内 Nginx 站点配置(与 deploy.sh 生成的裸机版同构)。
# 容器只做 HTTP:80,TLS 终止交给宿主/外层(见 docs/deploy-docker.md 的 HTTPS 节)。
#
# 协议透传(issue #172):本容器只监听 80,$scheme 恒为 http。若照直写
# `proxy_set_header X-Forwarded-Proto $scheme;`,外层 TLS 边缘传来的正确 https
# 会在这一跳被踩掉,后端 request.base_url 恒为 http(MCP 配置导出即受害者)。
# 故透传上游值,仅在上游未给(直连容器、无边缘)时才回落 $scheme。
# 注:该值只在 backend 侧被采信(uvicorn 已把 nginx 容器 IP 列入可信代理),
# 直连容器端口仍可自报协议,故生产务必把容器端口收进环回(DORAMI_HTTP_LISTEN=127.0.0.1:8080)。
map $http_x_forwarded_proto $dorami_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # 安全响应头与裸机版对齐
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dorami_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_pass http://backend:8088;
    }

    location /mcp {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dorami_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8088;
    }

    # Revalidate entry points; expires retains the server's security headers.
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
