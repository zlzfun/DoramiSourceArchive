# 哆啦美出网跳板机 —— 纯 nginx(+ 官方第一方 njs 模块)反代任意目标。
#
# 部署形态: 公网 ECS / 容器, 官方 nginx 镜像(已内置 njs)。内网机的
# mitmproxy 把「访问任意域名」改写成「GET https://本机/relay?t=<base64url(原URL)>」,
# 本配置解码 t → 反代真实目标 → 原样回传。
#
# 挂载:
#   - scripts/relay/njs/relay.js → /etc/nginx/njs/relay.js
#   - 跳板机域名证书           → /etc/nginx/certs/{fullchain,privkey}.pem
#
# 源码编译的 nginx(无 njs)需 ./configure --add-module=.../njs/nginx 或装
# nginx.org 的 nginx-module-njs 包; 官方 Docker 镜像开箱即用。

load_module modules/ngx_http_js_module.so;

events {}

http {
    js_import relay from /etc/nginx/njs/relay.js;
    js_set $relay_url   relay.url;    # https://目标host/path?query(或空=非法)
    js_set $relay_host  relay.host;   # 目标 host[:port]
    js_set $relay_block relay.blocked; # '1'=拒绝(非法/私网), 空=放行

    # proxy_pass 用变量时需显式 resolver 解析目标域名(跳板机在公网可解析)。
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 32m;   # LLM 等 POST 体
    proxy_http_version 1.1;

    server {
        listen 443 ssl;
        server_name 跳板机域名;          # ← 改成实际域名(与白名单一致)

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # 入方向白名单: 只放行企业 proxy 的出口 IP。
        # 更稳的做法是同时在云安全组上限制来源 IP(纵深防御)。
        allow 企业出口IP;                 # ← 改成实际出口 IP(可多行)
        deny  all;

        location = /relay {
            if ($relay_block) { return 403; }   # nginx 官方认可的 if+return 安全用法

            proxy_pass $relay_url;
            proxy_ssl_server_name on;           # SNI 跟真实目标(取自 proxy_pass host)
            proxy_set_header Host $relay_host;   # 上游 Host 必须是真实目标而非跳板机

            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
            proxy_buffering off;                 # 流式回传(图片/大响应)

            # 不改写响应体/Location: 重定向的绝对 URL 会在下一跳经 mitmproxy
            # 重新编码,故此处无需(也不应)重写,归档忠实性不受污染。
        }

        # 其余路径一律拒绝,不暴露任何其它入口。
        location / { return 444; }
    }
}
